<!doctype html><html><meta charset="utf-8"><title>Home QA widths</title><style>body{margin:0;background:#e6eee9;font:13px system-ui}nav{display:flex;justify-content:center;gap:6px;padding:5px}button,select{padding:5px}iframe{display:block;border:0;margin:auto;width:390px;height:844px}</style><nav><select id="width" aria-label="画面幅"><option>320</option><option>375</option><option selected>390</option><option>430</option></select><select id="height" aria-label="画面高さ"><option>568</option><option>667</option><option selected>844</option><option>932</option></select><button id="game">育成画面</button><button id="cast">複数体比較</button><button id="notice">通知＋会話の配置見本</button></nav><iframe title="QA画面" src="game.html"></iframe><script>const f=document.querySelector('iframe');width.onchange=()=>f.style.width=width.value+'px';height.onchange=()=>f.style.height=height.value+'px';game.onclick=()=>f.src='game.html';cast.onclick=()=>f.src='cast-qa.html';notice.onclick=()=>{const d=f.contentDocument,s=d.getElementById('storyFlash');s.classList.remove('hidden');s.style.setProperty('display','flex','important');d.getElementById('storyFlashText').textContent='じっせきたっせい！「みんなと暮らす世界」';d.getElementById('speechBubble').classList.remove('hidden');d.getElementById('speechBubble').style.setProperty('display','flex','important');d.getElementById('speechText').textContent='木のあいだを、いっしょにおさんぽしよう。';};</script></html>

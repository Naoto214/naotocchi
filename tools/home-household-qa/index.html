<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28体ホーム確認</title><style>body{margin:0;background:#dce6e1;color:#244a45;font:14px system-ui}nav{display:flex;gap:8px;flex-wrap:wrap;padding:8px;justify-content:center}select,button{font:inherit;padding:6px}iframe{display:block;border:0;width:390px;height:844px;margin:auto;background:white}p{text-align:center}</style><nav><label>地域<select id="region"><option value="forest">もり</option><option value="river_lake">みずべ</option><option value="city">とかい</option></select></label><label>人数<select id="count"><option>1</option><option>2</option><option>6</option><option>13</option><option>26</option><option>27</option><option selected>28</option></select></label><label>幅<select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option></select></label><label>高さ<select id="height"><option>576</option><option>640</option><option>740</option><option selected>844</option></select></label><label>版<select id="version"><option value="game.html">新28体</option><option value="v9-game.html">v9来訪のみ</option></select></label><button id="start">表示する</button><a href="index.html">試遊入口</a></nav><p>確認専用データ・本番セーブとは別です。「表示する」は試遊データを置き換えます。人数は主役を含む合計です。</p><iframe title="ホーム確認" id="game"></iframe><script src="character-world-master.v1.js"></script><script>
const KEY='naotocchi-home-diorama-preview-v1';
async function start(){const old=document.getElementById('game');await new Promise(resolve=>{old.onload=resolve;old.src='about:blank';});const s=await(await fetch('pilot-seed.json')).json(),m=NAOTOCCHI_CHARACTER_WORLD_MASTER_V1,n=+document.getElementById('count').value;const defs=[...m.companions.normal,...m.companions.rare];s.companions=defs.slice(0,n===28?26:n-1).map((c,i)=>({id:c.id,bond:i%3===0?20:85}));const p=m.partners.find(p=>p.id==='forest_bear');s.partner=n===28?{...p,emoji:"🐻",gender:"male",orientationId:"bi",label:p.name||p.label,affection:80,married:true,bondCount:3}:null;s.regionId=document.getElementById('region').value;s.lastSavedAt=s.savedAt=s.lastTickAt=Date.now();s.lifetime.saveRevision=1;for(const k of [KEY,KEY+'-backup',KEY+'-snaps'])localStorage.removeItem(k);localStorage.setItem(KEY,JSON.stringify(s));localStorage.setItem(KEY+':home-guide-v1','done');const f=document.getElementById('game');f.style.width=document.getElementById('width').value+'px';f.style.height=document.getElementById('height').value+'px';f.src=document.getElementById('version').value+'?householdqa='+Date.now();}
document.getElementById('start').onclick=start;document.getElementById('width').onchange=()=>document.getElementById('game').style.width=document.getElementById('width').value+'px';document.getElementById('height').onchange=()=>document.getElementById('game').style.height=document.getElementById('height').value+'px';start();
</script></html>

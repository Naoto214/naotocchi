<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PR253配置の復元比較</title><style>body{margin:0;background:#e5f1dd;color:#245340;font:14px system-ui;text-align:center}#stage{position:relative;margin:30px auto;background:linear-gradient(#daeecd,#b5d594);border-radius:24px}img{position:absolute;image-rendering:auto}p{padding:12px;line-height:1.6}</style><h2>旧ホーム：仲間26体の配置</h2><p>PR #253 の配置コードによる再構成です。<br>当時の画面キャプチャではありません。</p><div id="stage"></div><p>主役＋獲得済み仲間26体。旧二重半円の比較用。</p><script src="../character-world-master.v1.js"></script><script src="cast-bounds.js"></script><script src="cast-layout.js"></script><script>const defs=[...NAOTOCCHI_CHARACTER_WORLD_MASTER_V1.companions.normal,...NAOTOCCHI_CHARACTER_WORLD_MASTER_V1.companions.rare];const paths=['assets/characters/dog/04.png',...defs.map(x=>x.asset)];const width=358;const l=NaotocchiCast.layoutHomeCast({width,mainAsset:paths[0],hasPartner:false,hasAccessory:false,companions:paths.slice(1),motionRadius:0});const host=document.getElementById('stage');host.style.width=width+'px';host.style.height=l.height+'px';[l.main,...l.companions].forEach((f,i)=>{const img=document.createElement('img');img.src='../'+paths[i];img.alt=i?defs[i-1].name||defs[i-1].label:'なおとっち';Object.assign(img.style,{left:f.x+'px',top:(f.y+(f.artOffsetY||0))+'px',width:f.w+'px',height:f.h+'px'});host.append(img)});</script></html>

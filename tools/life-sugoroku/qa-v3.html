<!doctype html><html lang="ja"><meta charset="utf-8"><title>なおころ。V3 browser QA</title><style>body{margin:20px;background:#eee9dc;font:14px system-ui;color:#294a45}button,select{font:inherit;padding:10px;margin:4px}iframe{display:block;background:white;border:1px solid #b8c5ad;height:1000px}pre{white-space:pre-wrap;max-width:1000px}.bar{position:sticky;top:0;background:#eee9dc;z-index:5}</style><h1>なおころ。V3 Chrome画面検証</h1><div class="bar"><label>幅<select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option></select></label><label>場面<select id="scene"><option>overview</option><option>selection</option><option>followers</option><option>forest</option><option>river</option><option>sea</option><option>city</option><option>event</option><option>relationship</option><option>cpu</option><option>mini0</option><option>mini1</option><option>mini2</option><option>rewind</option><option>evolution</option><option>album</option></select></label><button id="show">場面表示</button><button id="matrix">4幅検証</button><button id="flow">操作・保存検証</button><button id="inspect">記録</button></div><iframe id="game" width="390" title="検証用ゲーム" src="../../prototypes/life-sugoroku/?qa=1"></iframe><pre id="report">準備中</pre><script type="module">
import {createGame,dispatch,serialize,cpuAction} from '../../prototypes/life-sugoroku/engine.mjs';import {makeMiniChallenge} from '../../prototypes/life-sugoroku/minigame-adapter.mjs';
const f=document.querySelector('#game'),out=document.querySelector('#report'),records=[],wait=ms=>new Promise(r=>setTimeout(r,ms));const state=()=>f.contentWindow.lifeDebug.getState(),doc=()=>f.contentDocument,send=(s,c)=>dispatch(s,{revision:s.revision,...c});
const fresh=()=>createGame({seed:405,rounds:10,players:['dog','cat','penguin','frog'].map(id=>({character:{id,gender:'female',orientationId:'pan'},human:true}))});const set=s=>f.contentWindow.lifeDebug.setState(s);const click=q=>{const e=doc().querySelector(q);if(!e||e.disabled)throw Error('not clickable '+q);e.click();};
function withFollowers(s){const p=s.players[0];p.pos=15;p.walkPath=[10,11,12,13,14,15];p.stage=6;p.relationships={squirrel:{status:'friend',affinity:3,visits:2,firstRound:1,lastRound:1},cat_ceo:{status:'partner',affinity:5,visits:3,firstRound:1,lastRound:1}};p.following={friend:'squirrel',partner:'cat_ceo'};return s;}
function show(kind=document.querySelector('#scene').value){let s=fresh();const p=s.players[0];if(kind==='followers')s=withFollowers(s);if(['forest','river','sea','city'].includes(kind)){p.pos={forest:15,river:4,sea:39,city:31}[kind];p.walkPath=[p.pos];}if(kind==='event'){s.phase='event';s.pending={eventId:'friend-01'};}if(kind==='relationship'){s.phase='event';s.pending={eventId:'friend-01'};s=send(s,{type:'choose',index:0});s=send(s,{type:'continue'});}if(kind==='cpu')s.players[0].human=false;if(kind.startsWith('mini')){s.phase='mini';const kindNo=+kind.slice(-1);s.pending={kind:kindNo,scores:[null,null,null,null],attempt:null,challenge:makeMiniChallenge(kindNo,n=>Math.min(n-1,1))};}if(kind==='rewind'){p.stage=6;p.items=['clock'];}if(kind==='evolution'){s.round=2;s.phase='result';s.pending={title:'成長の日',text:'一日をしまう',delta:{sodachi:0,money:0}};}if(kind==='album'){s=withFollowers(s);while(s.phase!=='done')s=send(s,cpuAction(s));}set(s);if(kind==='selection'){click('#menu');click('#to-title');click('#new');}if(['forest','river','sea','city','followers'].includes(kind))click('#follow');if(kind==='rewind'){click('#inventory');click('[data-item="clock"]');}if(kind==='evolution')click('#continue');return s;}
async function images(){await Promise.all([...doc().images].map(i=>i.decode().catch(()=>{})));}
function record(label){const d=doc(),s=state(),b=d.querySelector('#board-wrap')?.getBoundingClientRect();const r={label,width:f.clientWidth,phase:s?.phase,active:s?.active,overflow:d.documentElement.scrollWidth>f.clientWidth,nodes:d.querySelectorAll('[data-node]').length,numbers:d.querySelectorAll('.tile-number').length,followers:d.querySelectorAll('.follower').length,missingImages:[...d.images].filter(i=>!i.complete||!i.naturalWidth).map(i=>i.src),actions:d.querySelector('.actions')?.innerText,allNodesInside:!b||[...d.querySelectorAll('.tile-surface')].every(e=>{const r=e.getBoundingClientRect();return r.left>=b.left&&r.right<=b.right&&r.top>=b.top&&r.bottom<=b.bottom;})};records.push(r);out.textContent=JSON.stringify(records,null,2);return r;}
async function restoreExact(label){const before=serialize(state());await new Promise(resolve=>{f.onload=()=>{click('#resume');resolve();};f.contentWindow.location.reload();});const equal=before===serialize(state());records.push({label,width:f.clientWidth,equal});if(!equal)throw Error(label);}
async function until(fn){const t=Date.now();while(!fn()){if(Date.now()-t>10000)throw Error('timeout');await wait(30);}}
document.querySelector('#width').onchange=e=>f.width=e.target.value;document.querySelector('#show').onclick=()=>show();document.querySelector('#inspect').onclick=()=>record('manual');
document.querySelector('#matrix').onclick=async()=>{try{for(const width of [320,375,390,430]){f.width=width;await wait(100);for(const kind of ['selection','overview','followers','event','relationship','mini0','mini1','mini2','rewind','evolution','album']){show(kind);await images();const r=record(kind);if(r.overflow||r.missingImages.length||r.numbers)throw Error('layout '+width+' '+kind);if(kind==='overview'&&!r.allNodesInside)throw Error('overview cutoff');}}document.querySelector('#matrix').textContent='4幅完了';}catch(e){records.push({FAIL:e.message});document.querySelector('#matrix').textContent='失敗';}out.textContent=JSON.stringify(records,null,2);};
document.querySelector('#flow').onclick=async()=>{try{for(const width of [320,375,390,430]){f.width=width;let s=fresh();s.players[0].dieMode='double';set(s);click('#roll');const dice=state().pending.dice,rng=state().rng;if(state().phase!=='dice'||!doc().querySelector('#dice-stop'))throw Error('stop missing');await restoreExact('dice waiting');click('#dice-stop');if(JSON.stringify(state().pending.dice)!==JSON.stringify(dice)||state().rng!==rng)throw Error('reroll');await restoreExact('dice settling');await until(()=>state().phase!=='dice');record('dice-tap');
s=show('relationship');await restoreExact('relationship');click('[data-relate="invite"]');if(state().players[0].following.friend!=='squirrel')throw Error('invite');await restoreExact('friend');record('friend joined');
s=show('cpu');click('#cpu-skip');if(state().active!==0||state().phase!=='result')throw Error('skip boundary');const skipped=serialize(state());click('#cpu-skip');if(state().rng!==JSON.parse(skipped).rng)throw Error('skip reroll');await restoreExact('CPU skipped');record('CPU summary');
for(const kind of ['mini0','mini1','mini2']){show(kind);click('#mini-start');await restoreExact(kind);if(kind==='mini1')click('[data-pair="0"]');if(kind==='mini2')click('[data-short-light="0"]');click('#mini-pass');if(state().active!==1)throw Error('mini advance');record(kind+' played');}
show('rewind');if(!doc().querySelector('.rewinding'))throw Error('rewind');await restoreExact('rewind');show('evolution');if(!doc().querySelector('.growing'))throw Error('growth');await restoreExact('growth');}
document.querySelector('#flow').textContent='操作・保存完了';}catch(e){records.push({FAIL:e.message});document.querySelector('#flow').textContent='失敗';}out.textContent=JSON.stringify(records,null,2);};f.onload=()=>out.textContent='準備完了';
</script></html>

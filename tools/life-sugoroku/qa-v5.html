<!doctype html><meta charset="utf-8"><title>なおころ。 V5 検証</title><style>body{margin:12px;background:#ddd;font:14px sans-serif}header{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}iframe{border:0;background:white;display:block}button,select{padding:8px}#report{white-space:pre-wrap}</style>
<header><label>幅<select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option></select></label><label>向き<select id="orientation"><option value="portrait">縦</option><option value="landscape">横</option></select></label><label>場面<select id="scene"><option value="board">盤面</option><option value="friends">仲間3人</option><option value="partner">恋人同行</option><option value="marriage">結婚同行</option><option value="crowd">20体同行</option><option value="friend-choice">仲間3候補</option><option value="partner-choice">恋人3候補</option><option value="friend-farewell">仲間と別れ</option><option value="partner-farewell">恋人と別れ</option><option value="married-farewell">配偶者と別れ</option><option value="shield">恋人防御</option><option value="married-shield">結婚防御</option><option value="time">とき</option><option value="transform">へんしん3候補</option><option value="event">人生イベント</option><option value="numeric">数値マス</option><option value="shop">お店</option><option value="reroll">振り直し</option><option value="quick">クイック対戦</option><option value="normal">通常ゲーム対戦</option><option value="normal-cpu">通常ゲームCPU</option></select></label><button id="branches">全分岐・縦横・拡縮検証</button><button id="auto-match">CPU4人・15R完走検証</button><button id="match-progress">完走進捗</button><button id="show">場面表示</button><button id="inspect">表示検査</button><button id="suite">幅別表示テスト</button><button id="reload">保存から再読込</button></header><iframe id="view" title="V5検証画面" src="../../prototypes/life-sugoroku/v4.html?qa=1" width="390" height="844"></iframe><pre id="report"></pre>
<script type="module">
import * as E from '../../prototypes/life-sugoroku/engine-v4.mjs';import * as R from '../../prototypes/life-sugoroku/rules-v4.mjs';import {PLAYER_SPECIES} from '../../prototypes/life-sugoroku/canonical.mjs';
const $=id=>document.getElementById(id),view=$('view');
function size(){const w=+$('width').value,land=$('orientation').value==='landscape';view.width=land?844:w;view.height=land?w:844;}
$('width').onchange=$('orientation').onchange=size;
function arrive(s,to){const from=E.BOARD.find(n=>n.next.includes(to));s.players[s.active].pos=from.id;s.players[s.active].walkPath=[from.id];s.pending={staged:true,path:[from.id],remaining:1,dice:[1]};s.phase=from.next.length>1?'branch':'moving';return E.dispatch(s,{revision:s.revision,type:s.phase==='branch'?'branch':'step',to});}
function relation(p,kind,count=1){for(let i=0;i<count;i++){const offer=R.offer(p,kind,()=>0,1);R.select(p,offer,0,1);}}
$('show').onclick=()=>{let s=E.createGame({seed:405,rounds:15,players:['dog','cat','penguin','frog'].map(id=>({character:PLAYER_SPECIES.find(c=>c.id===id),human:true,difficulty:'normal'}))}),p=s.players[0],scene=$('scene').value;
 if(['friends','crowd','friend-farewell','reroll'].includes(scene))relation(p,'friend',3);
 if(['partner','marriage','crowd','partner-farewell','married-farewell','shield','married-shield'].includes(scene))relation(p,'partner');
 if(['marriage','married-farewell','married-shield','crowd'].includes(scene))R.offer(p,'partner',()=>0,1);
 for(const q of s.players){q.pos=7;q.walkPath=[0,1,6,7];}
 if(scene==='crowd')for(const q of s.players.slice(1)){relation(q,'friend',3);relation(q,'partner');R.offer(q,'partner',()=>0,1);}
 const ids={'friend-choice':7,'partner-choice':23,'friend-farewell':45,'partner-farewell':41,'married-farewell':41,shield:11,'married-shield':11,time:8,transform:20,event:2,numeric:1,shop:12,quick:5,normal:9,'normal-cpu':9};if(scene in ids)s=arrive(s,ids[scene]);
 if(scene==='normal-cpu'){s.players.forEach(p=>p.human=false);}
 if(scene==='reroll'){for(const type of ['dice-start','dice-stop','dice-settle'])s=E.dispatch(s,{revision:s.revision,type});}
 view.contentWindow.lifeDebug.setState(s);size();$('report').textContent='設定: '+scene;
};
$('inspect').onclick=()=>{const d=view.contentDocument,s=view.contentWindow.lifeDebug.getState();$('report').textContent=JSON.stringify({width:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,tiles:d.querySelectorAll('[data-node]').length,followers:d.querySelectorAll('.follower').length,portraitsBroken:[...d.querySelectorAll('img')].filter(i=>!i.complete||!i.naturalWidth).map(i=>i.src),phase:s?.phase,pending:s?.pending,players:s?.players.map(p=>({id:p.id,friends:p.friends,partner:p.partner,married:p.married,rerolls:p.rerolls,sodachi:p.sodachi,money:p.money}))},null,2);};
$('suite').onclick=async()=>{
 const rows=[],scenes=['board','crowd','friend-choice','partner-choice','friend-farewell','partner-farewell','married-farewell','shield','married-shield','time','transform','event','numeric','shop','reroll'];
 for(const width of ['320','375','390','430'])for(const orientation of ['portrait','landscape'])for(const scene of scenes){
  try{$('width').value=width;$('orientation').value=orientation;$('scene').value=scene;$('show').onclick();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const d=view.contentDocument;await Promise.all([...d.images].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=r;i.onerror=r;})));const state=view.contentWindow.lifeDebug.getState();rows.push({width:+width,orientation,scene,actualWidth:d.documentElement.clientWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,tiles:d.querySelectorAll('[data-node]').length,followers:d.querySelectorAll('.follower').length,broken:[...d.images].filter(i=>!i.naturalWidth).length,phase:state.phase});}catch(error){rows.push({width,orientation,scene,error:String(error)});}
  $('report').textContent=JSON.stringify({complete:false,count:rows.length,rows});
 }
 $('report').textContent=JSON.stringify({complete:true,count:rows.length,rows},null,2);
};
let matchTimer=null,matchEvidence=null;
$('auto-match').onclick=()=>{clearInterval(matchTimer);const s=E.createGame({seed:405,rounds:15,players:['dog','cat','penguin','frog'].map(id=>({character:PLAYER_SPECIES.find(c=>c.id===id),human:false,difficulty:'normal'}))});view.contentWindow.lifeDebug.setState(s);matchEvidence={started:Date.now(),phases:[],errors:[],done:false};matchTimer=setInterval(()=>{const state=view.contentWindow.lifeDebug.getState(),d=view.contentDocument;if(!matchEvidence.phases.includes(state.phase))matchEvidence.phases.push(state.phase);const err=d.querySelector('#official-error')?.textContent;if(err&&!matchEvidence.errors.includes(err))matchEvidence.errors.push(err);if(state.phase==='done'){clearInterval(matchTimer);matchEvidence.done=true;matchEvidence.elapsedMs=Date.now()-matchEvidence.started;matchEvidence.round=state.round;matchEvidence.players=state.players.map(p=>({id:p.id,sodachi:p.sodachi,money:p.money,stage:p.stage}));matchEvidence.games=state.miniHistory;sessionStorage.setItem('naokoro-v4-browser-match',JSON.stringify(matchEvidence));$('report').textContent=JSON.stringify(matchEvidence,null,2);return;}const speed=d.querySelector('#speed');if(speed?.textContent==='CPU 標準'&&!speed.disabled)speed.click();const skip=d.querySelector('#cpu-skip');if(skip&&!skip.disabled)skip.click();},180);};
$('match-progress').onclick=()=>{const s=view.contentWindow.lifeDebug.getState();$('report').textContent=JSON.stringify({evidence:matchEvidence,round:s?.round,phase:s?.phase,games:s?.miniHistory?.length},null,2);};
$('branches').onclick=async()=>{
 const rows=[];
 for(const width of ['320','375','390','430'])for(const orientation of ['portrait','landscape'])for(const zoom of ['overview','zoomin'])for(const fork of E.BOARD.filter(n=>n.next.length>1))for(const to of fork.next){
  $('width').value=width;$('orientation').value=orientation;size();
  let s=E.createGame({seed:405,rounds:15,players:['dog','cat','penguin','frog'].map(id=>({character:PLAYER_SPECIES.find(c=>c.id===id),human:true,difficulty:'normal'}))});
  s.players[0].pos=fork.id;s.players[0].walkPath=[fork.id];s.phase='branch';s.pending={staged:true,path:[fork.id],remaining:1,dice:[1]};
  view.contentWindow.lifeDebug.setState(E.restore(E.serialize(s)));
  const d=view.contentDocument;d.getElementById(zoom).click();
  const choice=d.querySelector('[data-path="'+to+'"]'),label=choice.textContent;
  choice.click();await new Promise(r=>setTimeout(r,700));
  const after=view.contentWindow.lifeDebug.getState();
  rows.push({width:+width,orientation,zoom,fork:fork.id,to,label,actual:after.players[0].pos,pass:after.players[0].pos===to,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth});
  $('report').textContent=JSON.stringify({complete:false,count:rows.length,failed:rows.filter(r=>!r.pass||r.overflow)},null,2);
 }
 $('report').textContent=JSON.stringify({complete:true,count:rows.length,failed:rows.filter(r=>!r.pass||r.overflow),rows},null,2);
};
$('reload').onclick=()=>view.contentWindow.location.reload();
</script>

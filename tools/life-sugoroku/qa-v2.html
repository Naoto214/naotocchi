<!doctype html><html lang="ja"><meta charset="utf-8"><title>なおころ。VERSION 2 QA</title><style>body{margin:20px;background:#eee9dc;font:14px system-ui;color:#294a45}button,select{font:inherit;padding:10px;margin:4px}iframe{display:block;background:white;border:1px solid #b8c5ad;height:900px}pre{white-space:pre-wrap;max-width:1000px}.bar{position:sticky;top:0;background:#eee9dc;z-index:5}</style><h1>なおころ。VERSION 2 画面確認</h1><div class="bar"><label>幅 <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option></select></label><label>場面 <select id="scene"><option value="overview">初期全体</option><option value="forest">森</option><option value="sea">海</option><option value="city">都会</option><option value="double">ダブルサイコロ</option><option value="branch">分岐</option><option value="event">選択前</option><option value="result">結果</option><option value="clock">若返り</option><option value="evolution">進化</option><option value="cpu">CPU</option><option value="items">アイテム</option></select></label><button id="show">場面表示</button><button id="matrix">4幅チェック</button><button id="reload">再読込して復帰</button><button id="inspect">状態を記録</button><button id="save-report">記録JSONを保存</button></div><iframe id="game" title="検証用ゲーム" width="390" src="../../prototypes/life-sugoroku/?debug=1"></iframe><pre id="report">読み込み中</pre><script type="module">
import {createGame,dispatch} from '../../prototypes/life-sugoroku/engine.mjs';import {catalog} from '../../prototypes/life-sugoroku/adapter.mjs';import {EVENTS} from '../../prototypes/life-sugoroku/data.mjs';
const frame=document.querySelector('#game'),report=document.querySelector('#report'),records=[];const wait=ms=>new Promise(r=>setTimeout(r,ms));const send=(s,c)=>dispatch(s,{revision:s.revision,...c});
function fresh(){const w=frame.contentWindow,cs=catalog(w.NAOTOCCHI_CHARACTER_WORLD_MASTER_V1);return createGame({seed:405,rounds:10,players:['dog','cat','penguin','frog'].map(id=>({character:cs.find(c=>c.id===id),human:true,difficulty:'normal'}))});}
function show(){let s=fresh(),kind=document.querySelector('#scene').value;const p=s.players[0];if(['forest','sea','city'].includes(kind))p.pos={forest:4,sea:16,city:28}[kind];if(kind==='double'){p.items=['double'];s=send(s,{type:'item',id:'double'});}if(kind==='branch'){p.pos=1;s=send(s,{type:'roll-start'});}if(kind==='event'){s.phase='event';s.pending={eventId:EVENTS[0].id};}if(kind==='result'){s.phase='event';s.pending={eventId:EVENTS[0].id};s=send(s,{type:'choose',index:0});}if(kind==='clock'){p.stage=6;p.items=['clock'];}if(kind==='evolution'){s.round=2;s.phase='result';s.pending={title:'成長の一日',text:'一日をしまうと成長します。',delta:{sodachi:0,money:0}};}if(kind==='cpu')s.players.forEach(p=>p.human=false);if(kind==='items'){p.money=100;p.items=['double','slow','clock'];}
frame.contentWindow.lifeDebug.setState(s);const d=frame.contentDocument;if(['forest','sea','city'].includes(kind))d.querySelector('#follow').click();if(['items','clock'].includes(kind)){d.querySelector('#inventory').click();if(kind==='items')d.querySelector('#shop').click();}record(kind);}
function record(label){const w=frame.contentWindow,d=frame.contentDocument,s=w.lifeDebug.getState();const b=d.querySelector('#board-wrap')?.getBoundingClientRect(),nodes=[...d.querySelectorAll('[data-node] .tile-surface')].map(n=>{const r=n.getBoundingClientRect();return{inside:!b||r.left>=b.left&&r.right<=b.right&&r.top>=b.top&&r.bottom<=b.bottom,id:n.parentNode.dataset.node}});const r={label,width:frame.clientWidth,phase:s?.phase,revision:s?.revision,pos:s?.players[s.active].pos,remaining:s?.pending?.remaining,dice:s?.pending?.dice||s?.lastMove?.dice,resources:s?.players.map(p=>({pos:p.pos,sodachi:p.sodachi,money:p.money,stage:p.stage})),nodeCount:nodes.length,allNodesInside:nodes.every(n=>n.inside),overflow:d.documentElement.scrollWidth>w.innerWidth,missingImages:[...d.images].filter(i=>!i.complete||!i.naturalWidth).map(i=>i.src),choices:[...d.querySelectorAll('[data-choice]')].map(e=>e.textContent),diceFaces:[...d.querySelectorAll('.die-stage')].map(e=>({result:e.dataset.result,faces:e.querySelectorAll('.die-face').length})),actions:d.querySelector('.actions')?.textContent};records.push(r);report.textContent=JSON.stringify(records,null,2);return r;}
document.querySelector('#show').onclick=show;document.querySelector('#width').onchange=e=>frame.width=e.target.value;document.querySelector('#inspect').onclick=()=>record('manual');document.querySelector('#reload').onclick=()=>{frame.onload=()=>{frame.contentDocument.querySelector('#resume')?.click();record('restored');};frame.contentWindow.location.reload();};document.querySelector('#matrix').onclick=async()=>{for(const width of [320,375,390,430]){frame.width=width;await wait(120);for(const scene of ['overview','event','result','items']){document.querySelector('#scene').value=scene;show();await wait(150);record('matrix-'+scene);}}report.textContent=JSON.stringify(records,null,2);};document.querySelector('#save-report').onclick=()=>{const a=document.createElement('a');a.download='naokoro-v2-browser-qa.json';a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));a.click();};frame.onload=()=>{report.textContent='準備完了';};
</script></html>

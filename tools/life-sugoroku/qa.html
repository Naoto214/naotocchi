<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>なおころ。画面幅QA</title>
<style>body{font-family:system-ui;background:#dce3da;margin:10px}button{padding:12px;margin:0 8px 12px 0}iframe{display:block;height:900px;border:1px solid #999;background:white}h1{font-size:20px}</style>
<h1>なおころ。画面幅QA</h1>
<p>同じ対戦を保ったまま幅を切り替えます（複数タブの保存競合を避けるため1画面）。</p>
<nav aria-label="確認する幅"><button data-width="320">320px</button><button data-width="375">375px</button><button data-width="390">390px</button><button data-width="430">430px</button></nav>
<output id="width">320px</output><iframe title="ゲーム表示" width="320" src="../../prototypes/life-sugoroku/?debug=1"></iframe>
<script>document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{document.querySelector('iframe').width=b.dataset.width;document.querySelector('#width').textContent=b.textContent;});</script>
</html>

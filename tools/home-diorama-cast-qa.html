<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>複数キャラの操作見本</title><link rel="stylesheet" href="home-diorama.css"><style>
*{box-sizing:border-box}body{margin:0;background:#e6eee9;color:#2c514e;font:14px/1.7 system-ui}main{position:relative;z-index:1;max-width:520px;margin:auto;padding:16px}h1{font-size:21px}button,select,a{font:inherit}button,select{min-height:44px;border:1px solid #adbfba;border-radius:8px;background:#fafff9;color:#2c514e;padding:8px}nav{display:flex;gap:6px;flex-wrap:wrap}.cast-stage{position:relative;height:300px;isolation:isolate;margin:20px 0}.cast-sway,.cast-response,#pet{position:absolute;inset:0}#pet>span{position:absolute;display:block}.character-visual{display:block;width:100%;height:100%}img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}.diorama-hint{top:-8px}a{color:#3b7186}#event{min-height:45px;font-size:12px;padding:10px;background:#ffffff60;border-radius:10px}
</style><main><a href="index.html">← 3地域の試遊へ</a><h1>複数キャラの操作見本</h1><p>同じ操作基盤を使う、保存しない見本です。本編の来訪条件には影響しません。</p><nav><select id="region" aria-label="地域"><option value="forest">もり</option><option value="river_lake">みずべ</option><option value="city">とかい</option></select><select id="time" aria-label="時間"><option value="day">ひる</option><option value="night">よる</option></select><select id="weather" aria-label="天気"><option value="sunny">はれ</option><option value="rain">あめ</option></select><select id="season" aria-label="季節"><option value="summer">なつ</option><option value="autumn">あき</option><option value="winter">ふゆ</option><option value="spring">はる</option></select></nav>
<div class="cast-stage" id="castStage"><div class="cast-sway"><div class="cast-response" id="response"><div id="pet"></div></div></div></div><details><summary>動作の計測</summary><pre id="metrics" style="font-size:10px;white-space:pre-wrap"></pre></details><p id="event" role="status">キャラをタップして選択してください。</p><nav><button id="visitor">なかまの退出・再来訪</button><button id="care">お世話モーション</button><button id="reduce">動きをひかえめに</button></nav><p>選択したキャラに足元の輪が出ます。移動先は点線。雨の日は木の下へ、夜はゆっくり。キーボードではTabでキャラを選び、矢印で歩けます。</p></main>
<script src="meguru.js"></script><script src="home-diorama-model.js"></script><script src="home-diorama.js"></script><script src="cast-motion.js"></script><script>
(async()=>{
const profiles=await(await fetch('pilot-profiles.json')).json(),stage=document.getElementById('castStage'),pet=document.getElementById('pet'),status=document.getElementById('event');
const specs=[{kind:'pet',id:'dog',label:'いぬ',asset:'assets/characters/dog/06.png',w:108,h:108,x:.46,y:180},{kind:'companion',id:'shiba',label:'しば',asset:'assets/characters/companions/shiba.png',w:64,h:64,x:.2,y:218},{kind:'partner',id:'forest_bear',label:'もりのクマさん',asset:'assets/characters/partners/forest_bear.png',w:72,h:72,x:.76,y:206}];
const M=installNaotocchiMeguru({getState:()=>({regionId:'forest',lifetime:{}})});
let away=false,busyUntil=0,reduced=false;
function mount(s){const n=document.createElement('span');n.innerHTML='<span class="character-visual"><img alt="'+s.label+'" draggable="false" src="'+s.asset+'"></span>';s.node=n;s.owner=n;pet.appendChild(n);}
specs.forEach(mount);
function actors(){return specs.filter(s=>s.node.isConnected).map(s=>{const x=stage.clientWidth*s.x;s.node.style.left=(x-s.w/2)+'px';s.node.style.top=(s.y-s.h)+'px';s.node.style.width=s.w+'px';s.node.style.height=s.h+'px';return {...s,key:s.kind+':'+s.id,x};});}
const motion=NaotocchiCastMotion.createController({getActors:actors,getGroup:()=>document.getElementById('response'),env:window});
const env=Object.create(window);env.NaotocchiHomeDioramaModel=NaotocchiHomeDioramaModel;env.requestAnimationFrame=window.requestAnimationFrame.bind(window);env.cancelAnimationFrame=window.cancelAnimationFrame.bind(window);const preference={get matches(){return reduced||window.matchMedia('(prefers-reduced-motion:reduce)').matches},addEventListener(){},removeEventListener(){}};env.matchMedia=()=>preference;
const c=NaotocchiHomeDiorama.createController({stage,document,env,getActors:actors,getMeguru:()=>M,isBlocked:()=>Date.now()<busyUntil,getProfile:r=>M.REGION3D[r],getWorld:r=>M.WORLDS[r],onGesture:(a,m)=>motion.gesture(a,m)});
function update(){c.update(Object.fromEntries(['region','time','weather','season'].map(k=>[k,document.getElementById(k).value])));}
for(const id of ['region','time','weather','season'])document.getElementById(id).onchange=update;
stage.addEventListener('naotocchi:home-reaction',e=>{const d=e.detail;status.textContent=(specs.find(s=>s.id===d.actor.id)?.label||d.actor.id)+' · '+({tap:'えらんだ',move:'歩いていく',arrive:'ついた',environment:'景色をながめる',proximity:'そばにいる'}[d.type]||d.type);});
document.getElementById('visitor').onclick=()=>{away=!away;if(away)specs[1].node.remove();else mount(specs[1]);update();};
document.getElementById('care').onclick=()=>{c.interrupt();busyUntil=Date.now()+1600;motion.speak({event:'feed',text:'',speaker:{kind:'pet',id:'dog'}});update();setTimeout(update,1700);};
document.getElementById('reduce').onclick=e=>{reduced=!reduced;e.target.textContent=reduced?'通常の動きへ':'動きをひかえめに';update();};
setInterval(()=>{const m=JSON.parse(stage.dataset.livingMetrics||'{}');document.getElementById('metrics').textContent=JSON.stringify(m,null,1);},1000);
new ResizeObserver(update).observe(stage);update();
})();</script></html>

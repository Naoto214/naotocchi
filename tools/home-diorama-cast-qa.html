<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ホーム・サイズと配置の比較</title><link rel="stylesheet" href="home-diorama.css"><style>
*{box-sizing:border-box}body{margin:0;background:#e6eee9;color:#24453f;font:13px/1.5 system-ui}main{position:relative;z-index:1;max-width:390px;margin:auto;padding:12px}h1{font-size:18px;margin:6px 0}button,select,a{font:inherit}button,select{min-height:36px;border:1px solid #adbfba;border-radius:8px;background:#fafff9e8;color:#24453f;padding:5px}nav{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.cast-stage{position:relative;height:280px;isolation:isolate;margin:18px 0 8px}.cast-sway,.cast-response,#pet{position:absolute;inset:0}#pet>span{position:absolute;display:block}.character-visual{display:block;width:100%;height:100%;transform:translateY(var(--cast-art-offset-y,0px))}img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}.diorama-hint{top:-8px}#event{min-height:35px;font-size:12px;background:#ffffffba;padding:6px;border-radius:6px}.note{background:#ffffffb8;padding:7px;border-radius:8px;font-size:11px}a{color:#315b6d}.accessory{position:absolute;pointer-events:none;font-size:16px;color:#315b6d}.qa-label{font-size:11px;background:#ffffffe0;padding:4px;border-radius:6px}
</style><main><a href="index.html">← 育成画面へ</a><h1>大きさと、みんなの距離感</h1><nav><select id="region" aria-label="地域"><option value="forest">もり</option><option value="river_lake">みずべ</option><option value="city">とかい</option></select><select id="count" aria-label="人数"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>6</option></select><select id="scale" aria-label="大きさ"><option value="auto">おすすめ</option><option value="1">100%</option><option value="0.9">90%</option><option value="0.8">80%</option><option value="0.7">70%</option></select></nav><nav><select id="species" aria-label="主役"><option value="dog/04">大人のいぬ</option><option value="dog/01">赤ちゃんのいぬ</option><option value="dog/06">大きないぬ</option><option value="dog/08">老いたいぬ</option><option value="turtle/04">かめ</option><option value="plush/04">ぬいぐるみ</option></select><select id="time" aria-label="時間"><option value="day">ひる</option><option value="night">よる</option></select><select id="weather" aria-label="天気"><option value="sunny">はれ</option><option value="rain">あめ</option></select></nav><div class="qa-label" id="sizeLabel"></div>
<div class="cast-stage" id="castStage"><div class="cast-sway"><div class="cast-response" id="response"><div id="pet"></div></div></div></div><p id="event" role="status">選択して左右に歩かせてみてください。</p><nav><button id="left">左へ歩く</button><button id="right">右へ歩く</button><button id="care">お世話モーション</button><button id="pause">比較のため静止</button><button id="visitor">なかま退出・再来訪</button></nav><p class="note">正式イラスト・本編と同じ配置計算／操作基盤の見本です。保存はしません。本編の来訪条件も変わりません。おすすめは100%。本編の人数別サイズ調整を保ち、追加縮小はしません。</p><details><summary>動作の計測</summary><pre id="metrics" style="font-size:10px;white-space:pre-wrap"></pre></details></main>
<script src="meguru.js"></script><script src="cast-bounds.js"></script><script src="cast-layout.js"></script><script src="home-diorama-model.js"></script><script src="home-diorama.js"></script><script src="cast-motion.js"></script><script>
(()=>{
const stage=document.getElementById('castStage'),pet=document.getElementById('pet'),status=document.getElementById('event');
const specs=[{kind:'pet',id:'dog',label:'いぬ',asset:'assets/characters/dog/04.png'},{kind:'partner',id:'forest_bear',label:'もりのクマさん',asset:'assets/characters/partners/forest_bear.png'},{kind:'companion',id:'shiba',label:'しば',asset:'assets/characters/companions/shiba.png'},{kind:'companion',id:'cat_friend',label:'ねこ',asset:'assets/characters/companions/cat_friend.png'},{kind:'companion',id:'snail',label:'かたつむり',asset:'assets/characters/companions/snail.png'},{kind:'companion',id:'penguin_friend',label:'ペンギン',asset:'assets/characters/companions/penguin_friend.png'}];
const M=installNaotocchiMeguru({getState:()=>({regionId:'forest',lifetime:{}})});let busyUntil=0,paused=false,away=false,rows=[];
function rebuild(){
 const chosen=document.getElementById('species').value;specs[0].asset='assets/characters/'+chosen+'.png';specs[0].id=chosen.split('/')[0];
 const count=+document.getElementById('count').value,list=specs.slice(0,count).filter(s=>!away||s.id!=='shiba');
 const args={width:stage.clientWidth,height:stage.clientHeight,conversationHeight:44,mainAsset:list[0].asset,hasPartner:count>1,partnerAsset:specs[1].asset,companions:list.filter(s=>s.kind==='companion').map(s=>s.asset),motionRadius:16};
 const raw=NaotocchiCast.layoutHomeCast(args),value=document.getElementById('scale').value,k=value==='auto'?NaotocchiHomeDiorama.crowdScale(list.length):+value,layout=NaotocchiHomeDiorama.scaleLayout(raw,args,k);
 pet.replaceChildren();let friend=0;rows=list.map(s=>{
 const f=s.kind==='pet'?layout.main:s.kind==='partner'?layout.partner:layout.companions[friend++],b=NaotocchiCastBounds[s.asset].box;
 const n=document.createElement('span');n.innerHTML='<span class="character-visual"><img alt="'+s.label+'" draggable="false" src="'+s.asset+'"></span>';
 Object.assign(n.style,{left:f.x+'px',top:f.y+'px',width:f.w+'px',height:f.h+'px'});n.style.setProperty('--cast-art-offset-y',(f.artOffsetY||0)+'px');pet.appendChild(n);
 return {...s,key:s.kind+':'+s.id,node:n,owner:n,x:f.x+f.w*(b[0]+b[2])/256,y:f.y+f.h*b[3]/128+(f.artOffsetY||0),w:f.w*(b[2]-b[0])/128,h:f.h*(b[3]-b[1])/128,originX:(b[0]+b[2])/256*100};
 });document.getElementById('sizeLabel').textContent=list.length+'体 / '+Math.round(k*100)+'% / 主役の画像枠 '+Math.round(layout.main.w)+'px';
 // Reinitialize comparison poses, without relying on private page state from browser automation.
 c?.model.sync([],{region:'reset'});update();
}
const motion=NaotocchiCastMotion.createController({getActors:()=>rows,getGroup:()=>document.getElementById('response'),env:window});
let c=NaotocchiHomeDiorama.createController({stage,document,env:window,getActors:()=>rows,getMeguru:()=>M,isBlocked:()=>Date.now()<busyUntil||paused,getProfile:r=>M.REGION3D[r],getWorld:r=>M.WORLDS[r],onGesture:(a,m)=>motion.gesture(a,m)});
function update(){c.update({...Object.fromEntries(['region','time','weather'].map(k=>[k,document.getElementById(k).value])),season:'summer'});}
for(const id of ['region','count','scale','species'])document.getElementById(id).onchange=rebuild;
for(const id of ['time','weather'])document.getElementById(id).onchange=update;
for(const side of ['left','right'])document.getElementById(side).onclick=()=>{paused=false;document.getElementById('pause').textContent='比較のため静止';update();const key=c.model.selected()||rows[0].key,a=c.model.snapshot().find(a=>a.key===key);c.model.select(key);c.model.move(key,{x:side==='left'?0:stage.clientWidth,y:a.y},'tap');};
stage.addEventListener('naotocchi:home-reaction',e=>{status.textContent=e.detail.actor.id+' · '+e.detail.type;});
document.getElementById('visitor').onclick=()=>{away=!away;rebuild();};
document.getElementById('care').onclick=()=>{c.interrupt();busyUntil=Date.now()+1600;motion.speak({event:'feed',text:'',speaker:{kind:'pet',id:specs[0].id}});update();setTimeout(update,1700);};
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'自律行動を再開':'比較のため静止';update();};
setInterval(()=>{document.getElementById('metrics').textContent=JSON.stringify({actors:c.model.snapshot().map(({key,x,y,w,h,direction,activity})=>({key,x,y,w,h,direction,activity})),...JSON.parse(stage.dataset.livingMetrics||'{}')},null,1);},1000);
new ResizeObserver(rebuild).observe(stage);rebuild();
})();</script></html>

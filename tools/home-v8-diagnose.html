<!doctype html><meta charset="utf-8"><button id="run">320px 1体 昼夜の回転再現</button><pre id="result">準備完了</pre><iframe id="f" style="width:320px;height:844px;border:0"></iframe><script>
const f=document.getElementById('f'),out=document.getElementById('result'),wait=ms=>new Promise(r=>setTimeout(r,ms));
document.getElementById('run').onclick=async()=>{try{const rows=[];for(const time of ['day','night']){const s=await(await fetch('pilot-seed.json')).json();s.regionId='star_stop';s.lastSavedAt=s.savedAt=s.lastTickAt=Date.now();localStorage.setItem('naotocchi-home-v7-qa-v1',JSON.stringify(s));await new Promise(r=>{f.onload=r;f.src='qa-home-v7-game.html?candidate=star-new&diag='+time});for(let i=0;i<200&&!f.contentWindow.HomeV22QA;i++)await wait(50);const q=f.contentWindow.HomeV22QA;q.scene('star_stop',1,time);await wait(1800);const read=phase=>{const d=q.detail(),sc=q.inspect().scene;return{phase,time,...d,bounds:q.inspect().bounds,transform:sc.navigation.transform}};rows.push(read('initial'));q.prepare();q.moveTest();await wait(1000);q.live();await wait(1000);q.freeze();rows.push(read('before'));f.style.width='844px';f.style.height='390px';await wait(350);rows.push(read('landscape'));f.style.width='320px';f.style.height='844px';await wait(350);rows.push(read('after'));out.textContent=JSON.stringify(rows,null,2);}out.dataset.done='true';}catch(e){out.textContent=e.stack}};
</script>

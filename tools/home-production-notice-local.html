<!doctype html><html lang="ja"><meta charset="utf-8"><title>V5通知レイアウト測定</title><style>body{font:14px system-ui;margin:12px}iframe{display:block;border:1px solid #aaa}pre{max-height:150px;overflow:auto}</style><button id="run">全幅・縦横・通知テスト</button><button id="forest">森の長文 390px</button><button id="story">ジャングルの長文 320px</button><button id="export">測定JSONを保存</button><pre id="result">未実行</pre><iframe id="game" width="390" height="844"></iframe><script>
const pause=ms=>new Promise(r=>setTimeout(r,ms));let records=[];
function inspect(){const d=game.contentDocument,r=e=>e.getBoundingClientRect().toJSON(),slot=d.getElementById('homeEventSlot'),stage=d.getElementById('castStage');return {slot:r(slot),extra:parseFloat(game.contentWindow.getComputedStyle(slot).marginBottom),stage:r(stage),speech:r(d.getElementById('speechSlot')),info:r(d.getElementById('homeInformation')),panels:[...slot.children].filter(e=>e.getClientRects().length).map(e=>({id:e.id,text:e.textContent,rect:r(e),clip:e.scrollHeight>e.clientHeight+1,inner:[...e.querySelectorAll('.story-flash-text')].map(n=>({clip:n.scrollHeight>n.clientHeight+1}))}))};}
async function open(region,width,height){game.width=width;game.height=height;game.src='v5-qa.html?region='+region+'&count=6';await new Promise(r=>game.onload=r);for(let i=0;i<100&&!game.contentWindow.HomeReleaseQA?.detail().world?.loaded;i++)await pause(50);await game.contentDocument.fonts.ready;game.contentWindow.HomeReleaseQA.noticeCase('');await pause(100);}
async function sample(kind){game.contentWindow.HomeReleaseQA.noticeCase(kind);await pause(120);const a=inspect();a.ok=a.slot.height===42&&a.speech.height===76&&a.panels.every(p=>!p.clip&&p.inner.every(n=>!n.clip)&&p.rect.bottom<=a.stage.top+1&&p.rect.top>=a.info.bottom-1);return a;}
document.getElementById('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({records},null,2)],{type:'application/json'}));a.download='v5-local-notice-matrix.json';a.click()};
run.onclick=async()=>{records=[];for(const w of [320,375,390,430])for(const landscape of [false,true]){await open('forest',w,844);if(landscape){game.width=844;game.height=w;await pause(200)}for(const kind of ['short','forest','multiline','story','court','']){const a=await sample(kind);records.push({w,landscape,kind,...a});result.textContent=JSON.stringify({cases:records.length,failed:records.filter(r=>!r.ok)},null,2);}}};
forest.onclick=async()=>{await open('forest',390,844);result.textContent=JSON.stringify(await sample('forest'),null,2)};story.onclick=async()=>{await open('jungle',320,844);result.textContent=JSON.stringify(await sample('story'),null,2)};
</script></html>

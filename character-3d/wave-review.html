<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character 3D wave review — 未承認候補</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee9dd}canvas{display:block}#label{position:absolute;top:8px;left:10px;font:13px sans-serif;color:#423d36}</style>
<div id="label"></div>
<script type="module">
import './mythic-spec.js';
import './botanical-spec.js';
import './armored-spec.js';
import './aquatic-spec.js';
import './topology-spec.js';
import './fish-spec.js';
import './humanoid-spec.js';
import './rollout-spec.js';
import SPEC from './spec-esm.mjs';
import {THREE} from './geometry.mjs';
import * as builders from './archetypes.mjs';
import {attachFace} from './rig.mjs';
import {instantiate} from './runtime.mjs';
import {animate,setEmotion} from './animate.mjs';
import {snapshotCharacterState} from '../tools/character-3d/qa-state.mjs';
const q=new URLSearchParams(location.search),id=q.get('id')||'cat',stage=Number(q.get('stage')||3),view=q.get('view')||'34';
const row=(globalThis.NaotocchiMythicWave(SPEC.PILOT)[id]||globalThis.NaotocchiBotanicalWave(SPEC.PILOT)[id]||globalThis.NaotocchiArmoredWave(SPEC.PILOT)[id]||globalThis.NaotocchiAquaticWave(SPEC.PILOT)[id]||globalThis.NaotocchiTopologyWave(SPEC.PILOT)[id]||globalThis.NaotocchiHumanoidWave(SPEC.PILOT)[id]||globalThis.NaotocchiCharacter3DRollout(SPEC.PILOT)[id]||globalThis.NaotocchiFishWave(SPEC.PILOT)[id]),sp=row?.stages[stage];
if(!sp)throw Error('No exact candidate '+id+'/'+stage);
const rig=builders.BUILDERS[sp.archetype](sp,id+':'+stage);
rig.faces=(Array.isArray(rig.faceSpec)?rig.faceSpec:[rig.faceSpec]).map(f=>attachFace(rig,f,'C')); rig.face=rig.faces[0];
const instance=instantiate({rig,key:id+':'+stage});
setEmotion(instance,q.get('emotion')||'normal');
for(let n=0;n<30;n++)animate(instance,{dt:1/30,moving:q.get('walk')==='1',animLv:q.get('reduced')==='1'?0:2});
const scene=new THREE.Scene();scene.background=new THREE.Color('#eee9dd');scene.add(instance.holder);
scene.add(new THREE.HemisphereLight('#e6f2ff','#8a7a5a',1.25));const sun=new THREE.DirectionalLight('#fff6e8',1.45);sun.position.set(-1.2,2.2,1.6);scene.add(sun);
instance.root.updateMatrixWorld(true);
const box=new THREE.Box3().setFromObject(instance.root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
const radius=Math.max(size.x,size.y,size.z)*.62;
const camera=new THREE.OrthographicCamera(-radius,radius,radius,-radius,.01,100);
const az={front:0,'34':.62,side:Math.PI/2,back:Math.PI}[view]??.62;
camera.position.set(center.x+Math.sin(az)*8,center.y+1.4,center.z+Math.cos(az)*8);camera.lookAt(center);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);renderer.render(scene,camera);
let triangles=0,meshes=0;instance.root.traverse(o=>{if(o.isMesh){meshes++;triangles+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;}});
document.querySelector('#label').textContent=id+' '+String(stage).padStart(2,'0')+' · '+view+' · '+(q.get('emotion')||'normal')+' / '+(q.get('walk')==='1'?'walk':'idle')+' / '+(q.get('reduced')==='1'?'reduced':'normal')+' · 未承認候補';
window.__wave={ready:true,id,stage,view,...snapshotCharacterState(instance),reduced:q.get('reduced')==='1',triangles,meshes,drawCalls:renderer.info.render.calls,box:box.toArray?.()||[box.min.toArray(),box.max.toArray()]};
</script></html>

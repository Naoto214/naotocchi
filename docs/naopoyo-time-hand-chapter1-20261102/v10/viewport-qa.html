<!doctype html><html lang="ja"><meta charset="utf-8"><title>V10 viewport QA (local only)</title><style>body{margin:12px;background:#e5e8ec;font:14px system-ui}nav{display:flex;gap:8px;margin:8px 0}button,select{padding:8px}iframe{border:0;display:block;background:#192b3d}pre{white-space:pre-wrap}</style><nav><button id="run" disabled>全70条件を測定</button><select id="stage" aria-label="QA面"></select></nav><nav id="sizes"></nav><iframe title="V10 game" width="320" height="568"></iframe><pre id="result">準備中</pre><script type="module">
import {ChapterProgress} from '/prototypes/naopoyo-time-hand-chapter1/progress.mjs';
import {STORAGE_KEY} from '/prototypes/naopoyo-time-hand-chapter1/session.mjs';
import {stages} from '/prototypes/naopoyo-time-hand-chapter1/stages.mjs';
import {solutions} from '/prototypes/naopoyo-time-hand-chapter1/solutions.mjs';
const sizes=[[320,568],[375,667],[390,844],[430,932],[320,480],[844,280],[667,375]],f=document.querySelector('iframe'),result=document.querySelector('#result'),select=document.querySelector('#stage');
for(const s of stages)select.add(new Option(s.id+' '+s.title,s.number-1));
for(const [w,h] of sizes){const b=document.createElement('button');b.textContent=w+'×'+h;b.onclick=()=>{f.width=w;f.height=h};document.querySelector('#sizes').append(b);}
async function show(i){const p=new ChapterProgress();for(let n=0;n<i;n++)for(const a of solutions[n])p.sessions[n].step(...a);p.record();p.index=i;localStorage.setItem(STORAGE_KEY,p.serialize());return new Promise(resolve=>{f.onload=()=>resolve();f.src='/prototypes/naopoyo-time-hand-chapter1/?qa='+i;});}
select.onchange=()=>show(+select.value);
const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};
function measure(i,w,h){const d=f.contentDocument,v=f.contentWindow,c=rect(d.querySelector('canvas')),intro=rect(d.querySelector('.intro')),checks=[];
for(const button of d.querySelectorAll('#play-tools button')){const r=rect(button),range=d.createRange();range.selectNodeContents(button.querySelector('span'));const t=range.getBoundingClientRect();checks.push({label:button.textContent.trim(),height:r.height,fits:t.left>=r.x-.5&&t.right<=r.right+.5&&t.top>=r.y-.5&&t.bottom<=r.bottom+.5&&r.bottom<=h});}
const sign=d.querySelector('.gravity-sign'),sr=rect(sign),visible=v.getComputedStyle(sign).display!=='none',gravity=!!stages[i].board.gravity,signOK=visible===gravity&&(!gravity||(sr.x>=c.x&&sr.right<=c.x+c.width/8&&sr.y>=c.y+c.height*7/8&&Math.abs(sr.bottom-c.bottom)<.5&&Math.abs(sr.width-26*Math.min(1,c.width/320))<.5&&v.getComputedStyle(sign).pointerEvents==='none'&&d.elementFromPoint(c.x+c.width/16,c.y+c.height*15/16)===d.querySelector('canvas')));return {signOK,sign:sr,visible,stage:i+1,viewport:[w,h],canvas:c,infoHeight:intro.height,gravity:d.querySelector('#gravity').textContent,scroll:[d.documentElement.scrollWidth>w,d.documentElement.scrollHeight>h,d.body.scrollHeight>h],buttons:checks,ok:signOK&&checks.every(b=>b.fits&&b.height>=44)&&d.documentElement.scrollHeight<=h&&d.documentElement.scrollWidth<=w&&d.body.scrollHeight<=h&&Math.abs(c.width-c.height)<1&&c.height>120&&d.querySelector('#gravity').textContent===(stages[i].board.gravity?'重力 ↓ ・ 支えがないと落ちる':'ひかりの牢屋')};}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;const records=[];try{for(let i=0;i<10;i++){await show(i);for(const [w,h] of sizes){f.width=w;f.height=h;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));records.push(measure(i,w,h));result.textContent=JSON.stringify({passed:records.filter(r=>r.ok).length,total:records.length,complete:false,records});}}result.textContent=JSON.stringify({passed:records.filter(r=>r.ok).length,total:70,complete:true,records});select.value=7;f.width=375;f.height=667;await show(7);}catch(e){result.textContent=JSON.stringify({error:String(e),passed:records.filter(r=>r.ok).length,total:records.length,complete:false,records});}finally{document.querySelector('#run').disabled=false;}};
await show(0);result.textContent='測定できます';document.querySelector('#run').disabled=false;
</script></html>

<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔法岩 A/B/C 比較</title><style>body{background:#e9efdb;color:#29453b;font:16px system-ui;margin:24px}main{max-width:680px;margin:auto}canvas{width:100%;border-radius:12px;background:#dce9c9}p{line-height:1.7}h1{font-size:24px}</style><main><h1>数字付き魔法岩 — デザイン比較</h1><p>Aを採用。通常の岩と同じ厚み・上面を保ち、中央の大きな刻印と青緑の縁で区別。通過時だけ短く光ります。</p><canvas id="c" width="660" height="240"></canvas><p>A：自然石に刻印。支持物として最も分かりやすい。<br>B：発光数字。明るい森では光がにじみ、出口と競合。<br>C：透明紋章。岩の質感と数字のコントラストが弱い。</p><p>下段は320px幅の8×8盤面相当（1マス40px）の表示。数字は約18px。</p><canvas id="small" width="660" height="100"></canvas></main><script type="module">import{drawStone,drawMagicRock}from'../../prototypes/naopoyo-chapter2/stone.mjs';for(const [id,size,y]of[['c',100,.7],['small',40,.4]]){const c=document.getElementById(id).getContext('2d');c.scale(size,size);for(const [i,v]of['A','B','C'].entries()){const x=i*(220/size)+.6;drawMagicRock(c,{x,y,exact:8},{variant:v});if(id==='c'){c.font='.18px system-ui';c.fillStyle='#29453b';c.fillText(v+(v==='A'?' 採用':''),x+.5,.35)}}}</script></html>

<!doctype html><meta charset="utf-8"><title>V12 move count QA</title>
<style>body{margin:8px;background:#dde7df;font:14px sans-serif}iframe{display:block;margin-top:10px;border:0;width:390px;height:650px}pre{white-space:pre-wrap;position:absolute;left:470px;top:60px;width:600px;max-height:780px;overflow:auto}button{padding:10px}</style>
<button id="run">Run move QA</button><button id="prepare">Prepare stage20</button><button data-size="320,480">320</button><button data-size="375,667">375</button><button data-size="390,650">390</button><button data-size="430,750">430</button><button id="layout">Measure layouts</button><pre id="result">Ready</pre><iframe id="game" src="/prototypes/naopoyo-chapter2/qa.html"></iframe>
<script type="module">
const frame=document.querySelector('#game'),out=document.querySelector('#result'),checks=[];
const wait=ms=>new Promise(r=>setTimeout(r,ms));const until=async(fn)=>{for(let i=0;i<250;i++){if(fn())return;await wait(40)}throw Error('timeout')};
const check=(ok,msg)=>{if(!ok)throw Error(msg);checks.push(msg);out.textContent=JSON.stringify({status:'running',checks},null,2)};
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{const[w,h]=b.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px'};
async function prepare(){await until(()=>frame.contentWindow.pilot);const w=frame.contentWindow,d=w.document,p=w.pilot;if(d.querySelector('dialog.example')){d.querySelector('[data-close]').click();await until(()=>!d.querySelector('dialog.example'))}if(d.querySelector('#dialog').open)d.querySelector('#close').click();p.choose('komorebi-forest-trial');if(d.querySelector('#dialog').open)d.querySelector('#close').click();d.querySelector('#retry').click();await until(()=>!p.session.paused);return{w,d,p,q:p.session}}
document.querySelector('#prepare').onclick=()=>prepare();
document.querySelector('#run').onclick=async()=>{checks.length=0;try{
 let {w,d,p,q}=await prepare();const text=()=>d.querySelector('#moves').textContent,click=s=>d.querySelector(s).click();
 check(text()==='0手','retry shows0');const start=q.snapshot();const a=q.state.actors.find(a=>a.x===0&&a.y===7);
 q.begin(a.id,{x:.5,y:7.5});q.end();await wait(50);check(text()==='0手','selection costs0');
 q.begin(a.id,{x:.5,y:7.5});q.travel({x:-.5,y:7.5});q.end();await wait(50);check(text()==='0手','blocked move costs0');
 q.begin(a.id,{x:.5,y:7.5});q.travel({x:5.5,y:7.5});await until(()=>text()==='5手');check(q.state.moves===5,'five cells count while finger held');q.end();check(q.history.length===1,'one stroke one history');
 click('#pause');const saved=q.serialize();const storage=JSON.stringify({...w.localStorage});
 click('#example');if(d.querySelector('#exampleConfirm'))click('#exampleConfirm');await until(()=>d.querySelector('[data-next]')&&!d.querySelector('[data-reset]').disabled);click('[data-reset]');click('[data-next]');click('[data-next]');click('[data-next]');check(d.querySelector('.example-count').textContent.includes('3 / 97手'),'example retains independent 3/97 count');click('[data-close]');await until(()=>!d.querySelector('dialog.example'));check(q.state.moves===5&&text()==='5手','example leaves normal5');
 const normalKeys=Object.keys(w.localStorage).filter(k=>!k.startsWith('naopoyo.example.'));const previous=JSON.parse(storage);check(normalKeys.every(k=>w.localStorage[k]===previous[k]),'example preserves normal save keys');
 const loaded=new Promise(r=>frame.addEventListener('load',r,{once:true}));w.location.reload();await loaded;await until(()=>frame.contentWindow.pilot);w=frame.contentWindow;d=w.document;p=w.pilot;q=p.session;check(q.restored&&q.state.moves===5&&d.querySelector('#moves').textContent==='5手','reload restores5 and history');
 d.querySelector('#undo').click();check(q.state.moves===0&&d.querySelector('#moves').textContent==='0手','one Undo returns5→0');check(!q.paused&&d.querySelector('#paused').hidden&&!d.querySelector('#dialog').open,'Undo stays in game');
 q.begin(a.id,{x:.5,y:7.5});q.travel({x:1.5,y:7.5});q.end();await until(()=>d.querySelector('#moves').textContent==='1手');check(true,'move after Undo works');d.querySelector('#retry').click();check(d.querySelector('#moves').textContent==='0手','retry returns0');
 out.textContent=JSON.stringify({status:'PASS',checks},null,2);
 }catch(e){out.textContent=JSON.stringify({status:'FAIL',error:e.stack,checks},null,2)}};
document.querySelector('#layout').onclick=async()=>{try{const{w,d,p,q}=await prepare();const rows=[];for(const[width,height]of[[320,480],[375,667],[390,650],[430,750],[844,390]])for(const inset of[false,true]){frame.style.width=width+'px';frame.style.height=height+'px';d.querySelector('main').style.paddingTop=inset?'47px':'';d.querySelector('main').style.paddingBottom=inset?'34px':'';await until(()=>w.innerWidth===width&&w.innerHeight===height);w.dispatchEvent(new w.Event('resize'));const baseline=d.querySelector('#board').getBoundingClientRect().toJSON();for(const count of[0,42,47,999999,Number.MAX_SAFE_INTEGER]){q.state.moves=count;w.dispatchEvent(new w.Event('resize'));await until(()=>d.querySelector('#moves').textContent===count+'手');const moves=d.querySelector('#moves'),title=d.querySelector('#title'),mr=moves.getBoundingClientRect(),tr=title.getBoundingClientRect(),br=d.querySelector('#board').getBoundingClientRect(),nav=d.querySelector('nav').getBoundingClientRect();rows.push({width,height,inset,count,text:moves.textContent,font:w.getComputedStyle(moves).fontSize,boardWidth:br.width,boardHeight:br.height,boardUnchanged:br.width===baseline.width&&br.height===baseline.height,inside:mr.x>=0&&mr.right<=width,overlap:mr.left<tr.right,navInside:nav.bottom<=height,scroll:d.documentElement.scrollHeight>height});}}q.state.moves=0;frame.style.width='390px';frame.style.height='650px';d.querySelector('main').style.paddingTop='';d.querySelector('main').style.paddingBottom='';out.textContent=JSON.stringify({status:rows.every(r=>r.text===r.count+'手'&&r.boardUnchanged&&r.inside&&!r.overlap&&r.navInside&&!r.scroll)?'PASS':'FAIL',rows},null,2)}catch(e){out.textContent=String(e.stack)}};
</script>

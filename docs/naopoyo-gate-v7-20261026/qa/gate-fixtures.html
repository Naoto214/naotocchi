<!doctype html><html lang="ja"><meta charset="utf-8"><title>魔法ゲート・実エンジン表示QA</title><style>body{font:14px system-ui;background:#eef1e6;color:#294739;margin:12px}#boards{display:flex;gap:16px;flex-wrap:wrap}section{width:390px}canvas{width:362px;height:362px;display:block;border:0;outline:2px solid #9aaf84;border-radius:12px}h2{font-size:15px}p{max-width:1100px}button{font:inherit;padding:8px}#result{max-height:80px;overflow:auto}</style><h1>実描画QA · 390px相当 / 1マス45.25px</h1><p>実ゲームと同じCanvas描画・正式画像・ForestSession・v6判定で再生する検査fixture。正式ステージの配置と保存データには触れません。通過中の指定時刻で静止しています。</p><button id="toggle">通常モーション</button><div id="boards"></div><pre id="result"></pre>
<script type="module">
import{ForestSession}from'./prototypes/naopoyo-chapter2/session.mjs';import{render,loadForest}from'./prototypes/naopoyo-chapter2/render.mjs';import{loadSprites}from'./prototypes/naopoyo-rescue/sprites.mjs';import{stages}from'./prototypes/naopoyo-chapter2/stages.mjs';
const dog=(id,x,y,level=8)=>({id,x,y,level,species:'dog'}),base={...stages[0],id:'komorebi-visual-fixture',gravity:false,walls:[],exits:[],spikes:[],actors:[],gates:[]};let reduced=false;
const scenes=[
 {name:'1〜8・通常岩との並列・隣接ゲート',stage:{...base,walls:Array.from({length:8},(_,x)=>[x,5]),gates:Array.from({length:8},(_,x)=>({x,y:6,exact:x+1}))}},
 {name:'右上斜め66ms · 数字を右柱へ回避',stage:{...base,actors:[dog('a',1,4)],gates:[{x:2,y:3,exact:8}]},from:[1,4],to:[2,3],ms:66},
 {name:'位置交換120ms · 同じ8どうし',stage:{...base,actors:[dog('a',1,4),{...dog('b',2,4),species:'frog'}],gates:[{x:2,y:4,exact:8}]},from:[1,4],to:[2,4],ms:120},
 {name:'重力220ms · 落下で8を通過',stage:{...base,gravity:true,actors:[dog('a',1,2)],walls:[[1,3]],gates:[{x:2,y:4,exact:8}]},from:[1,2],to:[2,2],ms:220},
 {name:'連続130ms · 並んだ8を通過',stage:{...base,actors:[dog('a',1,4)],gates:[{x:2,y:4,exact:8},{x:3,y:4,exact:8}]},from:[1,4],to:[3,4],ms:130},
 {name:'不一致 · 3は8の上で支持される',stage:{...base,gravity:true,actors:[dog('a',2,3,3)],gates:[{x:2,y:4,exact:8}]}}
];
await Promise.all([loadForest(),loadSprites()]);function draw(){boards.replaceChildren();const out=[];for(const scene of scenes){const section=document.createElement('section'),h=document.createElement('h2'),c=document.createElement('canvas');h.textContent=scene.name;section.append(h,c);boards.append(section);const q=new ForestSession(scene.stage);render(c,q,{dpr:2,reducedMotion:reduced});if(scene.from){q.begin('a',{x:scene.from[0]+.5,y:scene.from[1]+.5});const res=q.travel({x:scene.to[0]+.5,y:scene.to[1]+.5});q.end();for(let t=0;t<scene.ms;t+=11){const dt=Math.min(11,scene.ms-t);q.advance(dt);q.animate(dt,reduced);render(c,q,{dpr:2,reducedMotion:reduced});}out.push({name:scene.name,accepted:res.every(r=>r.ok),events:res.flatMap(r=>r.events||[]).map(e=>e.type),moves:q.state.moves})}else render(c,q,{dpr:2,reducedMotion:reduced});}result.textContent=JSON.stringify({reduced,scenes:out},null,2)}toggle.onclick=()=>{reduced=!reduced;toggle.textContent=reduced?'reduced-motion ON（発光なし）':'通常モーション';draw()};draw();
</script></html>

<!doctype html><html lang="ja"><meta charset="utf-8"><title>version 6 / 7 実ゲーム比較QA</title>
<style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#eef1e6;color:#294739;font:14px system-ui}header{display:flex;gap:12px;align-items:center;margin-bottom:10px}label{display:flex;gap:5px}select,button{font:inherit;padding:5px}#views{display:flex;gap:16px}section{flex:none}h2{font-size:14px;margin:4px 0 8px}iframe{border:0;display:block}#report{white-space:pre-wrap;font-size:11px;margin:6px 0}</style>
<header><b>実ゲーム · Chrome</b><label>幅<select id="width"><option>375</option><option selected>390</option><option>430</option></select></label><label>高さ<select id="height"><option>570</option><option>664</option><option selected>740</option><option>844</option></select></label><label>面<select id="stage"><option>19</option><option>20</option></select></label><button id="reset">初期盤面</button><button id="reduced">動きを減らす: OFF</button><button id="freeze">通過100msで停止</button><button id="support">19面22手後の支持</button><button id="restore">保存復帰を検査</button></header><p id="scenario">初期盤面の比較。幅はiframeのCSS viewport。</p>
<div id="views"><section><h2>VERSION 6 · 旧魔法岩</h2><iframe id="v6" title="version 6" src="v6/prototypes/naopoyo-chapter2/qa.html"></iframe></section><section><h2>VERSION 7 · 石造りの魔法ゲート A</h2><iframe id="v7" title="version 7" src="prototypes/naopoyo-chapter2/qa.html"></iframe></section></div><pre id="report"></pre>
<script type="module">
const frames=[v6,v7];let reduced=false,restoreExpected=null;
function measure(){report.textContent=JSON.stringify(frames.map(f=>{const w=f.contentWindow,p=w.pilot;return {version:f.id,...p?.measure(),moves:p?.session.state.moves,actors:p?.session.state.actors.map(a=>({id:a.id,x:a.x,y:a.y,level:a.level})),stored:!!w.localStorage.getItem(p?.progress.actualKey),gateModule:performance.getEntriesByType('resource').length}}),null,1)}
function resize(){for(const f of frames){f.width=width.value;f.height=height.value;}requestAnimationFrame(measure)}
function reset(){for(const f of frames){const w=f.contentWindow;if(!w.pilot)continue;const b=[...w.document.querySelectorAll('[data-stage]')];w.document.getElementById('close').click();w.document.getElementById('select').click();const btn=[...w.document.querySelectorAll('[data-stage]')].find(e=>e.textContent.trim().startsWith(stage.value));btn?.click();w.document.getElementById('close').click();w.document.getElementById('retry').click();}requestAnimationFrame(measure)}
for(const f of frames)f.onload=()=>{resize();if(f===v7&&restoreExpected){const q=v7.contentWindow.pilot.session;scenario.textContent='保存復帰: '+(JSON.stringify({state:q.state,history:q.history})===restoreExpected?'PASS':'FAIL');restoreExpected=null;}else reset()};width.onchange=height.onchange=resize;stage.onchange=reset;document.getElementById('reset').onclick=reset;
document.getElementById('reduced').onclick=()=>{reduced=!reduced;for(const f of frames){const w=f.contentWindow,original=w.matchMedia.bind(w);w.matchMedia=q=>q==='(prefers-reduced-motion: reduce)'?{matches:reduced}:original(q)}document.getElementById('reduced').textContent='動きを減らす: '+(reduced?'ON':'OFF')};

document.getElementById('freeze').onclick=()=>{stage.value='19';reset();const w=v7.contentWindow,q=w.pilot.session,c=w.document.getElementById('board'),r=c.getBoundingClientRect(),z=r.width/8;
 const fire=(type,x)=>c.dispatchEvent(new w.PointerEvent(type,{pointerId:7,bubbles:true,clientX:r.x+x*z,clientY:r.y+7.5*z}));
 fire('pointerdown',1.5);fire('pointermove',2.5);fire('pointerup',2.5);
 setTimeout(()=>{q.paused=true;scenario.textContent='実19面: 8が8へ進入。入力後約100msで表示時間だけ停止（QA専用）。';measure()},100);
};
document.getElementById('support').onclick=async()=>{stage.value='19';reset();const path=await (await fetch('support-path.json')).json();for(const f of frames){const w=f.contentWindow,q=w.pilot.session;for(const p of path){const a=q.state.actors.find(a=>a.x===p.at[0]&&a.y===p.at[1]);q.begin(a.id,{x:a.x+.5,y:a.y+.5});q.travel({x:a.x+.5+p.d[0],y:a.y+.5+p.d[1]});q.end();q.animate(10000,true);}q.paused=true;}scenario.textContent='実19面・既存解答22手目: 数字3が8ゲート上で支持される。配置変更なし。';measure()};
document.getElementById('restore').onclick=()=>{const w=v7.contentWindow,q=w.pilot.session;q.paused=false;w.document.getElementById('pause').click();restoreExpected=JSON.stringify({state:q.state,history:q.history});w.location.reload();};
setInterval(measure,500);resize();
</script></html>

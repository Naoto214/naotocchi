<!doctype html><html lang="ja"><meta charset="utf-8"><title>V7 fixed-lane diagnostic</title><style>body{margin:12px;font:14px system-ui;background:#edf0f0}iframe{border:1px solid #333;display:block}pre{white-space:pre-wrap;max-width:900px;display:none}button{padding:10px}h1{font-size:18px}</style><h1>V7 実測：表示欄と予約枠の位置</h1><button id="measure">測定</button><button id="sleep">睡眠切替</button><button id="egg">卵に戻す</button><div id="summary"></div><iframe id="game"></iframe><pre id="result">読み込み中</pre><script>
const p=new URLSearchParams(location.search),frame=document.getElementById('game');frame.width=p.get('w')||390;frame.height=p.get('h')||844;
const q=new URLSearchParams({region:p.get('region')||'home',count:p.get('n')||1});if(p.get('comment'))q.set('comment',p.get('comment'));
frame.src='v7-qa.html?'+q;
function inspect(){const w=frame.contentWindow,d=w.document,rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom,right:r.right}},ids=['homeEventSlot','castStage','speechSlot','homeCommentDock','speechBubble','careActions'];const controls=rect(d.getElementById('careActions')),target={top:controls.y-4-76,bottom:controls.y-4};const rows=[...d.querySelectorAll('[data-diorama-actor]')].map(e=>({key:e.dataset.dioramaActor,rect:rect(e),display:w.getComputedStyle(e).display,visibility:w.getComputedStyle(e).visibility}));const data={viewport:{width:w.innerWidth,height:w.innerHeight},regions:Object.fromEntries(ids.map(id=>[id,rect(d.getElementById(id))])),meters:rect(d.querySelector('.home-meters')),frame:rect(d.querySelector('.screen-frame')),scroll:d.querySelector('.screen-frame').scrollTop,fixed76Target:target,actors:rows,selected:[...d.querySelectorAll('.diorama-selected-label')].map(e=>({text:e.textContent,hidden:e.hidden,rect:rect(e)})),state:w.HomeReleaseQA?.detail(),sleepAsset:[...d.querySelectorAll('#petSprite img')].map(e=>({src:e.getAttribute('src'),complete:e.complete,naturalWidth:e.naturalWidth,rect:rect(e)}))};document.getElementById('result').textContent=JSON.stringify(data,null,2);document.getElementById('summary').textContent='viewport '+w.innerWidth+'×'+w.innerHeight+' / slot y='+data.regions.speechSlot.y+' h='+data.regions.speechSlot.height+' / dock y='+data.regions.homeCommentDock.y+' h='+data.regions.homeCommentDock.height;return data;}
document.getElementById('egg').onclick=()=>frame.contentWindow.HomeReleaseQA.egg();document.getElementById('measure').onclick=inspect;document.getElementById('sleep').onclick=()=>{frame.contentWindow.document.getElementById('sleepBtn').click();setTimeout(inspect,700)};
frame.onload=()=>{let tries=0;const timer=setInterval(()=>{if(frame.contentWindow.HomeReleaseQA?.detail()?.world?.loaded||++tries>100){clearInterval(timer);setTimeout(inspect,1000)}},100)};
</script>

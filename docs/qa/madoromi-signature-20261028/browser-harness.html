<!doctype html><html><meta charset="utf-8"><title>Signature viewport QA</title><style>body{margin:20px;background:#eee;font:14px sans-serif}button,select{margin:0 5px 12px 0;padding:8px}iframe{display:block;border:0;width:390px;height:664px}pre{white-space:pre-wrap;max-height:60px;overflow:auto}</style>
<button id="run">Run 16 layouts</button><button id="ending">Ending</button><button id="signature">Signature</button><button id="back">Back to ending</button><select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option></select><pre id="result">Ready</pre><iframe id="reader" src="prototypes/madoromi-white-reader-20261027/dist/?from=game#top"></iframe>
<script>
const frame=document.querySelector('iframe'),out=document.querySelector('#result');let results=[];
const settle=()=>new Promise(r=>frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(()=>setTimeout(r,80))));
const last=()=>frame.contentDocument.querySelector('[data-source-index="394"]');
const ending=()=>{const w=frame.contentWindow;w.scrollBy(0,last().getBoundingClientRect().bottom-w.innerHeight+120)};
const signature=()=>{const w=frame.contentWindow;w.scrollTo(0,frame.contentDocument.documentElement.scrollHeight)};
document.querySelector('#ending').onclick=ending;document.querySelector('#back').onclick=ending;document.querySelector('#signature').onclick=signature;
document.querySelector('#width').onchange=e=>frame.style.width=e.target.value+'px';
document.querySelector('#run').onclick=async()=>{
 results=[];try{
 await frame.contentDocument.fonts.ready;
 for(const width of [320,375,390,430])for(const size of [16,16.5,19,21]){
  frame.style.width=width+'px';const w=frame.contentWindow,d=frame.contentDocument;
  d.querySelector(`[data-size="${size}"]`).click();await settle();ending();await settle();
  const end=last().getBoundingClientRect(),sig=d.querySelector('#signature p').getBoundingClientRect();
  const endingOnly=end.top>=58&&end.bottom<=w.innerHeight&&sig.top>w.innerHeight;
  w.scrollBy(0,w.innerHeight);await settle();signature();await settle();
  const rect=d.querySelector('#signature p').getBoundingClientRect();
  const clean=d.body.classList.contains('signature-visible')&&w.getComputedStyle(d.querySelector('.toolbar')).visibility==='hidden'&&w.getComputedStyle(d.querySelector('footer')).visibility==='hidden';
  const signatureOnly=last().getBoundingClientRect().bottom<0&&rect.top>0&&rect.bottom<w.innerHeight;
  const fits=d.documentElement.scrollWidth<=w.innerWidth;
  const smaller=parseFloat(w.getComputedStyle(d.querySelector('#signature p')).fontSize)<parseFloat(w.getComputedStyle(last()).fontSize);
  ending();await settle();const restored=w.getComputedStyle(d.querySelector('.toolbar')).visibility==='visible';
  const r={endTop:end.top,endBottom:end.bottom,signatureStart:sig.top,width,height:w.innerHeight,size,endingOnly,signatureOnly,clean,fits,smaller,restored,signatureY:Math.round(rect.top)};results.push(r);
  if(!endingOnly||!signatureOnly||!clean||!fits||!smaller||!restored)throw Error(JSON.stringify(r));
 }
 frame.style.width='390px';frame.contentDocument.querySelector('[data-size="16.5"]').click();await settle();signature();await settle();
 out.textContent=JSON.stringify({pass:true,results},null,2);
 }catch(e){out.textContent=JSON.stringify({pass:false,error:String(e),results},null,2)}
};
</script></html>

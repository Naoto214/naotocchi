<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1298" viewBox="0 0 680 1298"><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" fill="#152638"><text x="20" y="36" font-size="23">⑭ 軌跡・粒子の連結性（8近傍）</text><text x="20" y="76" font-size="19">通常基準：灰=最大成分／桃=独立成分</text><image x="20" y="92" width="512" height="512" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="642" font-size="19">tired：灰=最大成分／桃=独立成分</text><image x="20" y="658" width="512" height="512" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="1208" font-size="16">通常の独立25成分は別成分として識別可能。</text><text x="20" y="1234" font-size="16">tiredの左下線・中央線は身体と同じ最大成分に接続。</text><text x="20" y="1260" font-size="16">連結性は画素帰属の証明ではなく、分離困難の証拠です。</text></g></svg>

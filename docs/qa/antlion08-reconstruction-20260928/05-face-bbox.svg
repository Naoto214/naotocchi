<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1234" viewBox="0 0 680 1234"><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" fill="#152638"><text x="20" y="36" font-size="23">⑤ 顔bboxと境界：安全maskではない</text><text x="20" y="76" font-size="19">通常顔・同じ座標枠</text><image x="20" y="92" width="540" height="480" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="610" font-size="19">tired顔・同じ座標枠</text><image x="20" y="626" width="540" height="480" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="1144" font-size="16">観測要素の外接bbox [93, 59, 107, 69]（右・下端は含まない）</text><text x="20" y="1170" font-size="16">右目は外縁と接し、口周囲は顎の陰影・輪郭と連続。</text><text x="20" y="1196" font-size="16">矩形には頭部背景も含まれ、矩形コピーを提案しません。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1348" viewBox="0 0 680 1348"><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" fill="#152638"><text x="20" y="36" font-size="23">⑦ 脚・腹部・太線の交差部</text><text x="20" y="76" font-size="19">通常基準：同一crop</text><image x="20" y="92" width="610" height="550" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="680" font-size="19">tired：同一crop</text><image x="20" y="696" width="610" height="550" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="1284" font-size="16">付け根から先端までの線が重なる部分は保護側。</text><text x="20" y="1310" font-size="16">腹部・脚を個別に安全置換できるという意味ではありません。</text></g></svg>

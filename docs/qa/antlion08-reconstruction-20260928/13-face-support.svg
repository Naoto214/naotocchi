<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1224" viewBox="0 0 680 1224"><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" fill="#152638"><text x="20" y="36" font-size="23">⑬ 顔構成要素・背景・外縁の関係</text><text x="20" y="76" font-size="19">通常顔の手動注記（安全な抽出maskではない）</text><image x="20" y="92" width="600" height="475" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="605" font-size="19">tired顔の手動注記（安全な抽出maskではない）</text><image x="20" y="621" width="600" height="475" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="1134" font-size="16">桃色は位置・局所形状に基づく注記。色閾値抽出ではない。</text><text x="20" y="1160" font-size="16">支持域と矩形の差55画素を顔と決めつけません。</text><text x="20" y="1186" font-size="16">外縁接触16画素には口／顎の曖昧な部分も含まれます。</text></g></svg>

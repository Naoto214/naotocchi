<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1224" viewBox="0 0 680 1224"><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" fill="#152638"><text x="20" y="36" font-size="23">⑥ 通常顔と疲労顔・頭部の一体感</text><text x="20" y="76" font-size="19">通常：目・口・頬・頭部陰影</text><image x="20" y="92" width="600" height="475" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="605" font-size="19">tired：まぶた・目の下・口／顎の陰影</text><image x="20" y="621" width="600" height="475" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="1134" font-size="16">通常顔の背後の無表情な頭部背景はPNGに保存されていない。</text><text x="20" y="1160" font-size="16">通常顔の除去を近傍色で埋める場合、推測が必要。</text><text x="20" y="1186" font-size="16">alphaは二値でも色・陰影の継ぎ目リスクは残ります。</text></g></svg>

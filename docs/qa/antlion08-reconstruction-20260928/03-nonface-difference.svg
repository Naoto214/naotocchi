<svg xmlns="http://www.w3.org/2000/svg" width="680" height="732" viewBox="0 0 680 732"><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" fill="#152638"><text x="20" y="36" font-size="23">③ 顔周辺を除いたpixel差分</text><text x="20" y="76" font-size="19">緑=RGBA一致／黄=占有一致・色差／紫=形状差</text><image x="20" y="92" width="512" height="512" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="642" font-size="16">青灰=顔周辺の除外域 x86:110 / y52:71。</text><text x="20" y="668" font-size="16">透明同士を「一致」の水増しに数えていません。</text><text x="20" y="694" font-size="16">黄は同じ輪郭位置の画素。視覚的同一とは断定しません。</text></g></svg>

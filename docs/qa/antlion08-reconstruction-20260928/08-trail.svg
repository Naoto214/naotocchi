<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1268" viewBox="0 0 680 1268"><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" fill="#152638"><text x="20" y="36" font-size="23">⑧ 左下の軌跡／粒子</text><text x="20" y="76" font-size="19">通常基準</text><image x="20" y="92" width="480" height="510" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="640" font-size="19">tired</text><image x="20" y="656" width="480" height="510" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="1204" font-size="16">通常は散在粒子と淡い線。tiredは連続する太い線。</text><text x="20" y="1230" font-size="16">独立成分だけ追加しても既存の太線は消えません。</text></g></svg>

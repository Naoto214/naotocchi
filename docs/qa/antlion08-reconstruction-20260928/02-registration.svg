<svg xmlns="http://www.w3.org/2000/svg" width="680" height="732" viewBox="0 0 680 732"><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" fill="#152638"><text x="20" y="36" font-size="23">② 身体registration：輪郭対応</text><text x="20" y="76" font-size="19">通常=青／tired=赤／重複=灰</text><image x="20" y="92" width="512" height="512" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="20" y="642" font-size="16">tired→通常：平行移動 [0, -1] px。</text><text x="20" y="668" font-size="16">顔を除外し、触角・上側翅・下側翅・腹部を等重み。</text><text x="20" y="694" font-size="16">回転fitは測定のみ。変形による一致化はしていません。</text></g></svg>

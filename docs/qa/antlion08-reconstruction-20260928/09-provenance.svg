<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540"><rect width="100%" height="100%" fill="white"/><g font-family="sans-serif" fill="#172638"><text x="20" y="35" font-size="23">⑨ 方式B1の由来概念図（合成画像ではない）</text><rect x="30" y="75" width="620" height="210" fill="#dbefff" stroke="#167bbb"/><text x="50" y="110" font-size="21">通常基準由来となる想定領域</text><text x="50" y="150" font-size="19">触角・翅・腹部・脚・軌跡・粒子・頭部背景</text><text x="50" y="190" font-size="18">→ tired側の輪郭・陰影・姿勢の微差を失う</text><rect x="70" y="215" width="530" height="50" fill="#ffdce4" stroke="#ba4560"/><text x="85" y="247" font-size="18">tired由来：目・まぶた・口（境界未確定）</text><text x="30" y="330" font-size="20">接続条件は未解決</text><text x="30" y="369" font-size="18">通常顔を消した後の背景は既存情報だけで復元不能。</text><text x="30" y="405" font-size="18">右目と頭部外縁、口と顎の境界を安全分離できない。</text><text x="30" y="450" font-size="18">B3：頭部まで保持すると、触角付け根・首境界が増える。</text><text x="30" y="490" font-size="18">本図は処理の仮説説明のみ。候補PNGは0枚。</text></g></svg>

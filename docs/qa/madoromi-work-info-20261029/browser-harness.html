<!doctype html><html><meta charset="utf-8"><title>読書画面 QA</title><style>body{margin:0;background:#ddd;font:14px sans-serif}header{padding:8px}button{padding:8px}iframe{border:0;background:#FCFBF9;display:block}#frames{display:flex;align-items:start;gap:16px}pre{white-space:pre-wrap}</style><header><button data-view="cover">表紙</button><button data-view="ending">末尾</button><button data-view="toc">目次</button><button data-view="info">作品情報</button><button id="run">4幅検証</button><select id="width"><option>390</option><option>320</option><option>375</option><option>430</option></select><output id="status"></output></header><div id="frames"><iframe id="reader" width="390" height="844" src="prototypes/madoromi-white-reader-20261027/dist/?from=game"></iframe></div><pre id="results"></pre><script>
window.addEventListener('error',e=>document.querySelector('#status').textContent=e.message);window.addEventListener('unhandledrejection',e=>document.querySelector('#status').textContent=String(e.reason));
const frame=document.querySelector('iframe'), result=document.querySelector('#results');
frame.onload=()=>{const style=frame.contentDocument.createElement('style');style.textContent='html{scrollbar-width:none}::-webkit-scrollbar{display:none}';frame.contentDocument.head.append(style)};
const wait=()=>new Promise(r=>setTimeout(r,40));
async function view(name){let d=frame.contentDocument,w=frame.contentWindow;d.querySelector('#reader-menu').open=false;d.querySelector('#back-to-toc').click();w.scrollTo(0,0);await wait();if(name==='ending')w.scrollTo(0,d.documentElement.scrollHeight);if(name==='toc'||name==='info'){d.querySelector('summary').click();await wait();if(name==='info')d.querySelector('#open-work-info').click()}await wait();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelector('select').onchange=e=>{frame.width=e.target.value};
document.querySelector('#run').onclick=async()=>{let rows=[];for(let width of [320,375,390,430]){frame.width=width;await wait();for(let size of [16,16.5,19,21]){const d=frame.contentDocument,w=frame.contentWindow;d.querySelector(`[data-size="${size}"]`).click();for(let mode of ['cover','ending','toc','info']){await view(mode);const panel=d.querySelector('.menu-panel'),box=panel.getBoundingClientRect();rows.push({width,size,mode,noHorizontalOverflow:d.documentElement.scrollWidth<=d.documentElement.clientWidth,authorVisible:d.querySelector('#work-info').checkVisibility(),signatureAbsent:!d.querySelector('#signature'),panelFits:['toc','info'].includes(mode)?box.left>=0&&box.right<=width&&box.bottom<=w.innerHeight:true,finalText:d.querySelector('#chapter-6 p:last-child').textContent});}}}result.textContent=JSON.stringify(rows,null,2);document.querySelector('#status').textContent=rows.every(r=>r.noHorizontalOverflow&&r.signatureAbsent&&r.panelFits&&r.authorVisible===(r.mode==='info'))?'PASS 64 cases':'FAIL';frame.width=390;frame.contentDocument.querySelector('[data-size="16.5"]').click();await view('cover')};
</script></html>

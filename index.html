<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たまごっちもどき</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="device">
    <div class="device-top">
      <div class="lamp" id="lamp"></div>
    </div>

    <div class="name-plate">なおとっち</div>

    <div class="screen-frame">
      <div class="screen" id="screen">
        <div class="screen-normal" id="screenNormal">
          <div class="status-row">
            <span id="ageLabel">日齢: 0</span>
            <span id="stageLabel">たまご</span>
          </div>

          <div class="pet-area">
            <div class="badges" id="badges"></div>
            <div class="pet" id="pet">🥚</div>
            <div class="poop-row" id="poopRow"></div>
          </div>

          <div class="bars">
            <div class="bar-line">
              <span class="bar-label">満腹</span>
              <div class="bar"><div class="bar-fill hunger" id="hungerBar"></div></div>
            </div>
            <div class="bar-line">
              <span class="bar-label">機嫌</span>
              <div class="bar"><div class="bar-fill happiness" id="happinessBar"></div></div>
            </div>
            <div class="bar-line">
              <span class="bar-label">元気</span>
              <div class="bar"><div class="bar-fill energy" id="energyBar"></div></div>
            </div>
            <div class="bar-line">
              <span class="bar-label">体力</span>
              <div class="bar"><div class="bar-fill health" id="healthBar"></div></div>
            </div>
          </div>

          <div class="bars meters">
            <div class="bar-line">
              <span class="bar-label">進化</span>
              <div class="bar"><div class="bar-fill evo" id="evoBar"></div></div>
            </div>
            <div class="bar-line">
              <span class="bar-label">退化</span>
              <div class="bar"><div class="bar-fill devo" id="devoBar"></div></div>
            </div>
            <div class="bar-line">
              <span class="bar-label">死亡</span>
              <div class="bar"><div class="bar-fill death" id="deathBar"></div></div>
            </div>
          </div>

          <div class="message" id="message">卵がやってきた…</div>
        </div>

        <div class="minigame-overlay hidden" id="minigameOverlay"></div>

        <div class="story-flash hidden" id="storyFlash">
          <div class="story-flash-emoji" id="storyFlashEmoji"></div>
          <div class="story-flash-text" id="storyFlashText"></div>
        </div>

        <div class="game-clear-overlay hidden" id="gameClearOverlay">
          <div class="game-clear-confetti">🎉🎊✨🎉🎊✨</div>
          <div class="game-clear-title">GAME CLEAR</div>
          <div class="game-clear-subtitle">go to heaven!!</div>
          <div class="game-clear-desc">さいごまで そだてきった!<br>「はじめから」で またあたらしい たまごを そだてよう</div>
          <div class="game-clear-confetti">✨🎊🎉✨🎊🎉</div>
        </div>
      </div>
    </div>

    <div class="buttons">
      <button id="feedBtn" title="ごはん">🍚<br><span>ごはん</span></button>
      <button id="playBtn" title="あそぶ">🎮<br><span>あそぶ</span></button>
      <button id="cleanBtn" title="そうじ">🧹<br><span>そうじ</span></button>
      <button id="sleepBtn" title="ねる">💤<br><span>ねる</span></button>
      <button id="medicineBtn" title="くすり">💊<br><span>くすり</span></button>
      <button id="resetBtn" title="リセット" class="hidden">🔄<br><span>はじめから</span></button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

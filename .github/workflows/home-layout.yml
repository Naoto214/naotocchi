name: Home layout

on:
  pull_request:
    branches: [main]
    paths:
      - '**.css'
      - '**.html'
      - '**.js'
      - '**.cjs'
      - 'package*.json'
      - '.github/workflows/home-layout.yml'
  push:
    branches: [main]
    paths:
      - '**.css'
      - '**.html'
      - '**.js'
      - '**.cjs'
      - 'package*.json'
      - '.github/workflows/home-layout.yml'

permissions:
  contents: read

jobs:
  home-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/home-layout-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-layout
          path: test-results/home-layout
          retention-days: 14

name: Home layout

on:
  pull_request:
    branches: [main]
    paths:
      - '**.css'
      - '**.html'
      - '**.js'
      - '**.cjs'
      - 'package*.json'
      # RH-3: images, atlas/manifest JSON and vite.config.mjs also change what the browser layout loads.
      - 'assets/**'
      - '**.json'
      - '**.mjs'
      - '.github/workflows/home-layout.yml'
  push:
    branches: [main, integration/pr278-home-ci-20260930]
    paths:
      - '**.css'
      - '**.html'
      - '**.js'
      - '**.cjs'
      - 'package*.json'
      # RH-3: images, atlas/manifest JSON and vite.config.mjs also change what the browser layout loads.
      - 'assets/**'
      - '**.json'
      - '**.mjs'
      - '.github/workflows/home-layout.yml'

permissions:
  contents: read

jobs:
  home-layout:
    runs-on: ubuntu-latest
    # Full layout already approaches 10 minutes; include the focused regression gate.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/sticker-background-browser.cjs
      - run: node tests/boot-rescue-browser.cjs
      - run: node tests/back-navigation-browser.cjs
      - run: node tests/home-layout-regressions-browser.cjs
      - run: node --require ./tests/helpers/route-transport-diagnostics.cjs tests/home-layout-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-layout
          path: test-results/home-layout
          retention-days: 14

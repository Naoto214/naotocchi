name: Home layout

on:
  pull_request:
    branches: [main, feat/character-3d-pilot]
    paths:
      - '**.css'
      - '**.html'
      - '**.js'
      - '**.cjs'
      - 'package*.json'
      # RH-3: images, atlas/manifest JSON and vite.config.mjs also change what the browser layout loads.
      - 'assets/**'
      - '**.json'
      - '**.mjs'
      - '.github/workflows/home-layout.yml'
  push:
    branches: [main]
    paths:
      - '**.css'
      - '**.html'
      - '**.js'
      - '**.cjs'
      - 'package*.json'
      # RH-3: images, atlas/manifest JSON and vite.config.mjs also change what the browser layout loads.
      - 'assets/**'
      - '**.json'
      - '**.mjs'
      - '.github/workflows/home-layout.yml'

permissions:
  contents: read

jobs:
  home-layout:
    runs-on: ubuntu-latest
    # Both browser engines plus focused gates and artifact upload reach 20 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: v19 scenery, safe terrain and fixed UI (Chromium and WebKit)
        run: node tests/home-v19-browser.cjs
      - name: v18 intrinsic typography and glyph clipping (Chromium and WebKit)
        run: |
          git fetch --depth=1 origin 264e0a7d0a893f5d993da7d3c8b3087a3baaa91f
          node tests/home-v18-browser.cjs
      - name: v17 typography and actor identity (Chromium and WebKit)
        run: |
          git fetch --depth=1 origin 479de0388cab0898beb8f7524c6da70055a4bab6
          node tests/home-v17-browser.cjs
      - run: node tests/sticker-background-browser.cjs
      - run: node tests/boot-rescue-browser.cjs
      - run: node tests/back-navigation-browser.cjs
      - run: node tests/motion-v2-browser.cjs
      - run: node tests/home-layout-regressions-browser.cjs
      - run: node tests/meguru-discovery-transition-browser.cjs
      - run: node tests/meguru-landscape-browser.cjs
      - name: Camera framing and regional rotation regression
        run: node tools/meguru-3d-qa/camera-framing.cjs
        env:
          FRAMING_VARIANTS: candidate
          FRAMING_OUT: test-results/home-layout/camera-framing
      - run: node tools/meguru-3d-qa/camera-framing-mutation.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-layout
          path: test-results/home-layout
          retention-days: 14

  # Keep the full legacy suite intact, but give the final aggregate test its own
  # runner. v20 and the first v21 candidate hit the shared 30-minute job limit.
  home-core-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Complete legacy Home layout, touch, overflow and conversation checks
        run: node tests/home-layout-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-core-layout
          path: test-results/home-layout
          retention-days: 14

  home-v20:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: v20 regional depth and 48-case interaction matrix
        run: node tests/home-v20-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-v20
          path: test-results/home-layout/v20
          retention-days: 14

  home-v21:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: v21 regional depth and 32-case day/night interaction matrix
        run: node tests/home-v21-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-v21
          path: test-results/home-layout/v21
          retention-days: 14

  pad-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Paired baseline and candidate pad layout/input
        run: |
          git fetch --depth=1 origin e9932859c1479b2c1e53d77b20bb3b8f104343df
          node tests/meguru-pad-size-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meguru-pad-size
          path: test-results/home-layout/pad-size
          retention-days: 14

  home-v22-regions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        region: [city, countryside, forest, mountain, snow, sea, deepsea, river_lake, jungle, desert, star_stop, memory_lake, home]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: All widths, day and night, 1/6/28 actors in both engines
        run: node tests/home-v22-browser.cjs
        env:
          HOME_V22_REGION: ${{ matrix.region }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-v22-${{ matrix.region }}
          path: test-results/home-layout/v22
          retention-days: 14

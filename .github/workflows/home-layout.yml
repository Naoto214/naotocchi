name: Home layout

on:
  pull_request:
    branches: [main, feat/character-3d-pilot]
    paths:
      - '**.css'
      - '**.html'
      - '**.js'
      - '**.cjs'
      - 'package*.json'
      # RH-3: images, atlas/manifest JSON and vite.config.mjs also change what the browser layout loads.
      - 'assets/**'
      - '**.json'
      - '**.mjs'
      - '.github/workflows/home-layout.yml'
  push:
    branches: [main]
    paths:
      - '**.css'
      - '**.html'
      - '**.js'
      - '**.cjs'
      - 'package*.json'
      # RH-3: images, atlas/manifest JSON and vite.config.mjs also change what the browser layout loads.
      - 'assets/**'
      - '**.json'
      - '**.mjs'
      - '.github/workflows/home-layout.yml'

permissions:
  contents: read

jobs:
  home-layout:
    runs-on: ubuntu-latest
    # Both browser engines plus focused gates and artifact upload reach 20 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/sticker-background-browser.cjs
      - run: node tests/boot-rescue-browser.cjs
      - run: node tests/back-navigation-browser.cjs
      - run: node tests/motion-v2-browser.cjs
      - run: node tests/home-layout-regressions-browser.cjs
      - run: node tests/meguru-discovery-transition-browser.cjs
      - run: node tests/meguru-landscape-browser.cjs
      - name: Camera framing and regional rotation regression
        run: node tools/meguru-3d-qa/camera-framing.cjs
        env:
          FRAMING_VARIANTS: candidate
          FRAMING_OUT: test-results/home-layout/camera-framing
      - run: node tools/meguru-3d-qa/camera-framing-mutation.cjs
      - run: node tests/home-layout-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-layout
          path: test-results/home-layout
          retention-days: 14

name: Remove retired reward tests once

on:
  push:
    branches: [chatgpt/items-v2-home-strip-20260915]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[skip reward-test-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/items-v2-home-strip-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove retired reward remnants
        run: node tools/remove-retired-reward-dialogue-tests.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/dialogue-test.js script.js item-memories.js item-system.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove retired reward remnants [skip reward-test-cleanup]"
          git push origin HEAD:chatgpt/items-v2-home-strip-20260915
      - name: Verify full test suite
        run: npm test

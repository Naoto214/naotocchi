name: Items V2 care RED check

on:
  push:
    branches: [chatgpt/items-v2-home-strip-20260915]

jobs:
  red-check:
    if: ${{ !contains(github.event.head_commit.message, '[skip-v2-care-red]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify retired special-date CSS is caught by the V2 audit
        run: |
          set +e
          node --test tests/items-v2-care-automation-test.cjs > /tmp/red.log 2>&1
          code=$?
          cat /tmp/red.log
          if [ "$code" -eq 0 ]; then
            echo "Expected the retired special-date CSS audit to fail before cleanup, but it passed."
            exit 1
          fi
          grep -q "retired dedicated reward inventory has no production UI or runtime path" /tmp/red.log
          grep -q "data-theme" /tmp/red.log
          echo "RED confirmed: the retired special-date CSS is still present and is caught by the V2 audit."

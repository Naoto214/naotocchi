name: Home beauty V7 private comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'comparisons/home-beauty-v7/**'
      - '.github/workflows/home-beauty-v7-comparison.yml'
permissions:
  contents: read
jobs:
  private-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify autumn leaves, protected originals and private packaging
        run: node --test comparisons/home-beauty-v7/*.test.mjs
      - name: Build the private comparison with the official Pages asset list
        run: node comparisons/home-beauty-v7/build.cjs "$RUNNER_TEMP/beauty-v7" --fresh
      - name: Verify the built compositor can load every renderer
        run: node --input-type=module -e 'await import(process.argv[1])' "$RUNNER_TEMP/beauty-v7/game/beauty/paint.mjs"

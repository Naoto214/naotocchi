name: Fix reward message once

on:
  push:
    branches: [chatgpt/items-v2-home-strip-20260915]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip reward-message-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/items-v2-home-strip-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove final reward result branch
        run: node tools/fix-reward-message-once.js
      - name: Verify full test suite
        run: npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove final dedicated reward result branch [skip reward-message-fix]"
          git push origin HEAD:chatgpt/items-v2-home-strip-20260915

name: Pages runtime package

on:
  pull_request:
    branches: [main, feat/card-art-cpu-integration-20261019]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test allowlist and failure guards
        run: python -m unittest discover -s tests/pages -v
      - name: Build byte-preserving runtime artifact
        run: >-
          python tools/pages/package.py
          --out "${{ runner.temp }}/pages-runtime"
          --report "${{ runner.temp }}/pages-reports/package-report.json"
      # Match the GNU tar layout used by the last successful Pages deployment.
      # The staged directory contains only verified allowlist files and .nojekyll.
      - name: Archive and verify Pages deployment payload
        env:
          PAGES_RUNTIME: ${{ runner.temp }}/pages-runtime
          PAGES_REPORT: ${{ runner.temp }}/pages-reports/package-report.json
          PAGES_TAR: ${{ runner.temp }}/artifact.tar
        run: |
          tar --dereference --hard-dereference --directory "$PAGES_RUNTIME" -cf "$PAGES_TAR" .
          python - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          report_path = pathlib.Path(os.environ["PAGES_REPORT"])
          archive_path = pathlib.Path(os.environ["PAGES_TAR"])
          report = json.loads(report_path.read_text())
          with tarfile.open(archive_path) as archive:
              members = archive.getmembers()
              assert all(m.isfile() or m.isdir() for m in members), "Unexpected archive entry"
              files = [m for m in members if m.isfile()]
              names = [m.name.removeprefix("./") for m in files]
              assert len(names) == len(set(names)), "Duplicate archive path"
              assert set(names) == set(report["sha256"]), "Archive file set mismatch"
              for member, name in zip(files, names):
                  assert hashlib.sha256(archive.extractfile(member).read()).hexdigest() == report["sha256"][name], name
          assert archive_path.stat().st_size <= report["max_bytes"], "Archive exceeds budget"
          with archive_path.open("rb") as stream:
              report["tar"] = {"bytes": archive_path.stat().st_size, "sha256": hashlib.file_digest(stream, "sha256").hexdigest()}
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          print(f"Verified {len(files)} archive files; all SHA-256 hashes match")
          PY
      - name: Verify every HTTP file, entry point and card image
        run: >-
          python tools/pages/verify.py
          --artifact "${{ runner.temp }}/pages-runtime"
          --package-report "${{ runner.temp }}/pages-reports/package-report.json"
          --report "${{ runner.temp }}/pages-reports/http-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pages-capacity-reports
          path: ${{ runner.temp }}/pages-reports/
      # Publish the verified tar verbatim, including its allowlisted .nojekyll.
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    # PRs (including the stacked capacity fix) can never deploy.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed runtime artifact
        id: deployment
        uses: actions/deploy-pages@v4

name: Home art 2.5D independent experiment
on:
  push:
    branches: [experiment/home-art-25d-20261028]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/home-art-test.cjs tests/home-japan-test.cjs tests/home-recovered-test.cjs tests/home-recovered-gallery-test.cjs tests/home-ab-test.cjs tests/home-ab-build-test.cjs tests/home-ab-storage-test.cjs tests/home-ab-gallery-test.cjs
      - run: node tools/home-v22-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-art-regression
          path: test-results/home-v22-regression.log
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        region: [forest, river_lake, city]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/home-art-browser.cjs
        env:
          HOME_ART_REGION: ${{ matrix.region }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-art-${{ matrix.region }}
          path: test-results/home-layout/art25d
  japan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        region: [home, forest, river_lake, city]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/home-japan-browser.cjs
        env:
          HOME_ART_REGION: ${{ matrix.region }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-japan-${{ matrix.region }}
          path: test-results/home-layout/japan

  recovered:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [home-interior-a, home-garden, forest-waterfall, forest-no-waterfall, water, city]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/home-recovered-browser.cjs
        env:
          HOME_ART_CANDIDATE: ${{ matrix.candidate }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-recovered-${{ matrix.candidate }}
          path: test-results/home-layout/recovered

  home-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [home-interior-a, home-interior-b]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/home-ab-browser.cjs
        env:
          HOME_ART_CANDIDATE: ${{ matrix.candidate }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-ab-${{ matrix.candidate }}
          path: test-results/home-layout/home-ab

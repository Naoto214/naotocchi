name: Home selected name
on:
  pull_request:
    branches: [main]
    paths:
      - 'home-production-*.js'
      - 'home-production-*.mjs'
      - 'tests/home-egg-*.cjs'
      - 'home-production-layout.css'
      - 'home-diorama.css'
      - 'script.js'
      - 'index.html'
      - 'tests/home-selected-name-browser.cjs'
      - 'tests/home-panel-comments-browser.cjs'
      - 'tests/game-home-return-browser.cjs'
      - 'tests/home-cast-sizing-*.cjs'
      - 'tools/home-cast-size-*'
      - 'game-home-return.*'
      - 'story-navigation.js'
      - 'prototypes/card-game/index.html'
      - 'prototypes/life-sugoroku/*.html'
      - 'prototypes/naopoyo-time-hand-chapter1/index.html'
      - '.github/workflows/home-selected-name.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  touch-label:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node --test tests/home-production-startup-test.cjs tests/home-egg-loading-test.cjs
      - run: node tests/home-egg-startup-browser.cjs
        env:
          HOME_NAME_ENGINES: ${{ matrix.engine }}
      - run: node tests/home-selected-name-browser.cjs
        env:
          HOME_NAME_ENGINES: ${{ matrix.engine }}
      - name: Home panels, return routes and resident sizing
        env:
          HOME_NAME_ENGINES: ${{ matrix.engine }}
        run: |
          node --test tests/home-cast-sizing-test.cjs
          node tests/home-panel-comments-browser.cjs
          node tests/game-home-return-browser.cjs
          node tests/home-cast-sizing-browser.cjs .work-output/cast-sizing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-selected-name-${{ matrix.engine }}
          path: |
            .work-output/selected-name/
            .work-output/egg-startup/
            .work-output/cast-sizing/
          retention-days: 7

name: Reward cleanup once

on:
  push:
    branches: [chatgpt/items-v2-home-strip-20260915]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[skip reward-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/items-v2-home-strip-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove dedicated reward system
        run: node tools/remove-reward-system.js
      - name: Verify focused inventory test
        run: node --test tests/item-inventory-test.cjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js item-system.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove dedicated reward system [skip reward-cleanup]"
          git push origin HEAD:chatgpt/items-v2-home-strip-20260915

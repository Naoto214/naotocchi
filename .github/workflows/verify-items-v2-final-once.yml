name: Verify Items V2 final once

on:
  push:
    branches: [chatgpt/items-v2-home-strip-20260915]

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full test suite
        run: npm test

  home-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/home-layout-browser.cjs

name: CARD GAME 459 integration
on:
  pull_request:
    paths: ['prototypes/card-game/**', 'tests/helpers/approved-card459-v18.*', '.github/workflows/card459-integration.yml']
  push:
    branches: [main]
    paths: ['prototypes/card-game/**', 'tests/helpers/approved-card459-v18.*', '.github/workflows/card459-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/card459-browser --no-save --package-lock=false playwright@1.62.1
      - run: /tmp/card459-browser/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - run: node prototypes/card-game/tests/card459-browser.cjs
        env:
          NODE_PATH: /tmp/card459-browser/node_modules
          CARD_BROWSER: ${{ matrix.browser }}
          ARTIFACT_DIR: ${{ runner.temp }}/card459-${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card459-${{ matrix.browser }}
          path: ${{ runner.temp }}/card459-${{ matrix.browser }}

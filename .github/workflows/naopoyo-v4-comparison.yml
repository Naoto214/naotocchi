name: Naopoyo V4 comparison
on:
  pull_request:
    paths:
      - 'prototypes/naopoyo-100/v4/**'
      - 'docs/naopoyo-100-v4/**'
      - '.github/workflows/naopoyo-v4-comparison.yml'
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            prototypes/naopoyo-100
            prototypes/naopoyo-v2
            prototypes/naopoyo-rescue
            prototypes/naopoyo-world
            prototypes/naopoyo-chapter1
            prototypes/naopoyo-chapter2
            prototypes/naopoyo-shared
            prototypes/naopoyo-time-hand-chapter1
            docs/naopoyo-100-v1
            docs/naopoyo-100-v2
            docs/naopoyo-100-v3
            docs/naopoyo-100-v4
            docs/naopoyo-time-hand-chapter1-20261102
            docs/naopoyo-gimmick-atlas-v2
            tests
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/puzzle-*.test.mjs prototypes/naopoyo-100/tests/*.test.mjs prototypes/naopoyo-time-hand-chapter1/tests/*.test.mjs prototypes/naopoyo-100/v4/tests/*.test.mjs

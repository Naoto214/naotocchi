name: Home mobility V12 native WebKit performance
on:
  push:
    branches: [draft/home-mobility-v12]
  workflow_dispatch:
    inputs:
      experiment:
        type: choice
        options: [all, core, extra, final-care, live-forward, live-reverse, fixed, stress, attribution, touch, growth, curve]
        default: all
        description: Native performance measurements
permissions:
  contents: read
  actions: read
jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[v12-perf')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        experiment: ${{ fromJSON((inputs.experiment == 'final-care' || contains(github.event.head_commit.message,'[v12-perf-care]')) && '["final-care"]' || (inputs.experiment == 'core' || contains(github.event.head_commit.message,'[v12-perf-core]')) && '["live-forward","live-reverse","fixed","stress","attribution","touch"]' || (inputs.experiment == 'extra' || contains(github.event.head_commit.message,'[v12-perf-extra]')) && '["growth","curve"]' || inputs.experiment && inputs.experiment != 'all' && format('["{0}"]',inputs.experiment) || '["live-forward","live-reverse","fixed","stress","attribution","touch","growth","curve"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: comparisons
      - uses: actions/checkout@v4
        with:
          ref: e07d2cc53eca36ff23e02142ab385d6001e0521b
          path: .cast-reference
          persist-credentials: false
          sparse-checkout: |
            comparisons
            tools/work
      - uses: actions/checkout@v4
        with:
          ref: 28628cf336a8ed92efe4e9e197ca03298b798a1e
          path: .leaf-reference
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the pinned native homes
        run: |
          folder=.cast-reference/comparisons
          node "$folder/home-cast-size-v1/build.cjs" "$RUNNER_TEMP/v1" --reference-checkout .leaf-reference
          for n in 2 3 4; do node "$folder/home-cast-size-v$n/build.cjs" "$RUNNER_TEMP/v$n" --baseline "$RUNNER_TEMP/v$((n-1))"; done
          node comparisons/home-finish-v5/build.cjs "$RUNNER_TEMP/v5" --baseline "$RUNNER_TEMP/v4"
          node comparisons/home-drag-v6/build.cjs "$RUNNER_TEMP/v6" --baseline "$RUNNER_TEMP/v5"
          for n in 7 8 9 10 11; do node "comparisons/home-mobility-v$n/build.cjs" "$RUNNER_TEMP/v$n" --baseline "$RUNNER_TEMP/v$((n-1))"; done
          node comparisons/home-mobility-v12/build.cjs "$RUNNER_TEMP/v12" --baseline "$RUNNER_TEMP/v11"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native WPE
        run: |
          python -m pip install playwright==1.62.0 psutil==7.2.2 Pillow==11.3.0
          python -m playwright install --with-deps webkit
      - name: Retrieve the historical motion and environment fixture
        if: matrix.experiment == 'fixed' || matrix.experiment == 'stress'
        uses: actions/download-artifact@v4
        with:
          name: mobility-v10-performance-${{ matrix.experiment }}
          path: ${{ runner.temp }}/tape
          run-id: 44921996416
          github-token: ${{ github.token }}
      - name: Run the dedicated experiment
        env:
          EXPERIMENT: ${{ matrix.experiment }}
        run: |
          python -m http.server 8377 --bind 127.0.0.1 --directory "$RUNNER_TEMP/v12" > "$RUNNER_TEMP/http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          prior=comparisons/home-mobility-v11
          folder=comparisons/home-mobility-v12
          out="$RUNNER_TEMP/performance"
          mkdir -p "$out"
          forward=v10,v11-foot,v12
          reverse=v12,v11-foot,v10
          case "$EXPERIMENT" in
            live-forward|live-reverse)
              [[ "$EXPERIMENT" == live-forward ]] && order="$forward" || order="$reverse"
              python -B "$prior/performance.py" native --order "$order" --seconds 180 --out "$out/$EXPERIMENT.json"
              ;;
            fixed|stress)
              (cd "$RUNNER_TEMP/tape" && sha256sum -c "$GITHUB_WORKSPACE/comparisons/home-mobility-v10/$EXPERIMENT-fixture.sha256")
              python -B "$prior/performance.py" replay --order "$forward,$reverse" --tape "$RUNNER_TEMP/tape" --kind "$EXPERIMENT" --out "$out/$EXPERIMENT.json"
              ;;
            attribution)
              python -B "$folder/performance-trace.py" --order "$forward" --seconds 40 --out "$out/trace-forward.json"
              python -B "$folder/performance-trace.py" --order "$reverse" --seconds 40 --out "$out/trace-reverse.json"
              ;;
            touch)
              python -B "$prior/performance.py" touch --order "$forward" --out "$out/touch-forward.json"
              python -B "$prior/performance.py" touch --order "$reverse" --out "$out/touch-reverse.json"
              ;;
            final-care)
              python -B "$folder/performance-growth.py" --final --out "$out/growth-final.json"
              python -B "$folder/performance-growth.py" --profile --widths 320 390 --out "$out/care-profile.json"
              python -B "$folder/performance-growth.py" --life --out "$out/life.json"
              MOBILITY_GAME="$RUNNER_TEMP/v12/game" node "$folder/performance-statue.mjs" "$out/statue.json"
              ;;
            growth)
              python -B "$folder/performance-growth.py" --final --out "$out/growth.json"
              python -B "$folder/performance-growth.py" --profile --widths 320 390 --out "$out/care-profile.json"
              python -B "$folder/performance-growth.py" --life --out "$out/life.json"
              ;;
            curve)
              MOBILITY_GAME="$RUNNER_TEMP/v12/game" node "$folder/performance-curve.mjs" "$out/curve.json"
              python -B "$folder/performance-witness.py" --out "$out/witness.json"
              MOBILITY_GAME="$RUNNER_TEMP/v12/game" node "$folder/performance-statue.mjs" "$out/statue.json"
              MOBILITY_GAME="$RUNNER_TEMP/v12/game" node "$folder/performance-statue.mjs" "$out/exit-guard.json" --guard
              ;;
          esac
      - name: Retain rAF, Linux compositor and input observations
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobility-v12-performance-${{ matrix.experiment }}
          path: ${{ runner.temp }}/performance/
          retention-days: 14
          if-no-files-found: error

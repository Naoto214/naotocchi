name: Minigame scoring P1

# ミニゲーム採点監査 Phase 1(重大3件: たまころがし迷路・上海・スライドパズル)。
# 本物の ページを スマホ幅・タッチで ひらき、Chromium と WebKit(iPhone の Safari と おなじ エンジン)で たしかめる。
# 乱数の 回帰テスト(上海の 詰み・スライドの 偶奇・迷路の 進み具合)は npm test(Runtime smoke test)の tests/minigame-scoring-p1-test.cjs。
on:
  pull_request:
    branches: [main]
    paths:
      - 'games.js'
      - 'script.js'
      - 'index.html'
      - 'tests/minigame-scoring-p1-*.cjs'
      - 'tests/helpers/**'
      - 'package*.json'
      - '.github/workflows/minigame-scoring-p1.yml'
  push:
    branches: [main]
    paths:
      - 'games.js'
      - 'script.js'
      - 'index.html'
      - 'tests/minigame-scoring-p1-*.cjs'
      - 'tests/helpers/**'
      - 'package*.json'
      - '.github/workflows/minigame-scoring-p1.yml'

permissions:
  contents: read

jobs:
  minigame-scoring-p1-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Random-generation regressions (harness)
        run: node --test tests/minigame-scoring-p1-test.cjs
      - name: Real page, phone size, touch (Chromium and WebKit)
        run: |
          mkdir -p test-results/minigame-scoring-p1
          node tests/minigame-scoring-p1-browser.cjs --engines chromium,webkit --shots test-results/minigame-scoring-p1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minigame-scoring-p1
          path: test-results/minigame-scoring-p1
          retention-days: 14

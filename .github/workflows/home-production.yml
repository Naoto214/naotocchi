name: Production 2.5D home
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: home-production-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fixed-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: python tools/pages/package.py --out "${{ runner.temp }}/fixed-controls" --report "${{ runner.temp }}/fixed-package.json"
      - run: python tools/pages/verify.py --artifact "${{ runner.temp }}/fixed-controls" --package-report "${{ runner.temp }}/fixed-package.json" --report "${{ runner.temp }}/fixed-http.json"
      - run: node tools/home-production-qa.cjs "${{ runner.temp }}/fixed-controls"
      - name: Capture unchanged VERSION 3 birth baseline
        run: |
          git fetch origin ed182b6d79422f1d85c95f5c8c2777849595f7ce --depth=1
          cp -a "${{ runner.temp }}/fixed-controls" "${{ runner.temp }}/v3-baseline"
          for file in script.js egg-hatching.css home-production-egg.mjs home-production-world.mjs home-production-transform.mjs index.html; do
            git show "ed182b6d79422f1d85c95f5c8c2777849595f7ce:$file" > "${{ runner.temp }}/v3-baseline/$file"
          done
          git show ed182b6d79422f1d85c95f5c8c2777849595f7ce:tests/home-production-birth-browser.cjs > tests/.v3-birth-browser.cjs
          node tests/.v3-birth-browser.cjs "${{ runner.temp }}/v3-baseline"
        env:
          HOME_BIRTH_ENGINES: ${{ matrix.engine }}
          HOME_BIRTH_OUTPUT: test-results/home-production-v3-baseline
      - run: node tests/home-production-birth-browser.cjs "${{ runner.temp }}/fixed-controls"
        env:
          HOME_BIRTH_ENGINES: ${{ matrix.engine }}
      - run: node tests/home-production-guide-browser.cjs "${{ runner.temp }}/fixed-controls"
        env:
          HOME_LAYOUT_ENGINES: ${{ matrix.engine }}
      - run: node tests/home-production-layout-browser.cjs
        env:
          HOME_LAYOUT_ENGINES: ${{ matrix.engine }}
      - run: node tests/home-production-scroll-browser.cjs "${{ runner.temp }}/fixed-controls"
        env:
          HOME_LAYOUT_ENGINES: ${{ matrix.engine }}
      - name: Build private-only V5 QA fixture
        run: node tools/home-production-v5-qa.cjs "${{ runner.temp }}/fixed-controls"
      - name: Natural long notices and isolated special-region resume
        run: node tests/home-production-notice-browser.cjs "${{ runner.temp }}/fixed-controls"
        env:
          HOME_LAYOUT_ENGINES: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-home-controls-${{ matrix.engine }}
          path: |
            test-results/home-production-birth/
            test-results/home-production-v3-baseline/
            test-results/home-production-layout/
            test-results/home-production-scroll/
            test-results/home-production-native/
            test-results/home-production-guide/
            test-results/home-production-notices/
  production-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/home-production-backdrop-test.cjs tests/home-production-birth-test.cjs tests/egg-birth-story-test.cjs tests/egg-hatching-test.cjs
      - run: node tools/home-production-regression.cjs
      - run: node --test tests/home-production-startup-test.cjs tests/harness-determinism-test.cjs tests/meguru-resident-expression-test.cjs
      - run: node --test tests/home-production-notice-queue-test.cjs tests/home-production-scroll-focus-test.cjs tests/home-production-notice-layout-test.cjs
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        region: [home, forest, river_lake, city, countryside, mountain, snow, sea, jungle, desert, deepsea, star_stop, memory_lake]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node --test tests/home-production-test.cjs tests/home-production-save-test.cjs
      - run: python tools/pages/package.py --out "${{ runner.temp }}/home-production" --report "${{ runner.temp }}/home-package.json"
      - run: node tools/home-production-qa.cjs "${{ runner.temp }}/home-production"
      - run: node tests/home-production-browser.cjs "${{ runner.temp }}/home-production"
        env:
          HOME_RELEASE_REGION: ${{ matrix.region }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-home-${{ matrix.region }}
          path: test-results/home-production/

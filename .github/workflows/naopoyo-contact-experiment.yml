name: Naopoyo Contact Experiment
on:
  pull_request:
    paths:
      - 'prototypes/naopoyo-chapter2/**'
      - 'prototypes/naopoyo-v2/**'
      - '.github/workflows/naopoyo-contact-experiment.yml'
permissions:
  contents: read
jobs:
  comparison-and-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node prototypes/naopoyo-chapter2/contact-comparison/audit.mjs
      - run: node prototypes/naopoyo-chapter2/contact-comparison/build.mjs /tmp/contact-comparison
      - run: python -m unittest discover -s tests/pages -v

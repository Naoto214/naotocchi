name: Minigame failure penalty C

# ミニゲームの しっぱいに 育成ペナルティを つけない(C案)。
# 本物の ページを スマホ幅・タッチで ひらき、Chromium と WebKit(iPhone の Safari と おなじ エンジン)で たしかめる。
# 全100本の 回帰テストは npm test(Runtime smoke test)の tests/minigame-failure-penalty-test.cjs。
on:
  pull_request:
    branches: [main]
    paths:
      - 'games.js'
      - 'script.js'
      - 'index.html'
      - 'tests/minigame-failure-penalty-*.cjs'
      - 'tests/helpers/**'
      - 'package*.json'
      - '.github/workflows/minigame-failure-penalty.yml'
  push:
    branches: [main]
    paths:
      - 'games.js'
      - 'script.js'
      - 'index.html'
      - 'tests/minigame-failure-penalty-*.cjs'
      - 'tests/helpers/**'
      - 'package*.json'
      - '.github/workflows/minigame-failure-penalty.yml'

permissions:
  contents: read

jobs:
  minigame-failure-penalty-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Failure penalty regressions (harness, all 100 games)
        run: node --test tests/minigame-failure-penalty-test.cjs
      - name: Real page, phone size, touch (Chromium and WebKit)
        run: |
          mkdir -p test-results/minigame-failure-penalty
          node tests/minigame-failure-penalty-browser.cjs --engines chromium,webkit --shots test-results/minigame-failure-penalty
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minigame-failure-penalty
          path: test-results/minigame-failure-penalty
          retention-days: 14

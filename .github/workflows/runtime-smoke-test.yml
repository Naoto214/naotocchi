name: Runtime smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run runtime smoke test
        run: node tests/smoke-test.js
      - name: Run dialogue regression test
        run: node tests/dialogue-test.js
      - name: Validate development visual QA fixtures
        run: node tests/visual-qa-test.cjs
      - name: Run minigame input lifecycle regression test
        run: node --test tests/minigame-lifecycle-test.cjs
      - name: Run save recovery regression test
        run: node --test tests/save-recovery-test.cjs
      - name: Run UI, cast and environment regression tests
        run: node --test tests/ui-integration-test.cjs tests/cast-layout-test.cjs tests/cast-motion-test.cjs tests/world-environment-test.cjs

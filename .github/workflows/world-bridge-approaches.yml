name: World bridge approach baseline (Draft branch)

on:
  push:
    branches: [feat/meguru-3d-geometry-terrain-v1]
    paths:
      - '.github/workflows/world-bridge-approaches.yml'
      - 'docs/qa/meguru-3d-bridge-approaches/recipe-validation.json'

permissions:
  contents: read

jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install existing browser QA dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_CHROMIUM=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"
          echo "NODE_PATH=$PWD/node_modules" >> "$GITHUB_ENV"
      - name: Capture four validated dry road approaches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/commit.txt
          sha256sum meguru.js meguru-3d.mjs index.html > qa-artifacts/source-sha256.txt
          node --version > qa-artifacts/node-version.txt
          node -p 'JSON.stringify({playwright:require("playwright/package.json").version,chromium:process.env.PLAYWRIGHT_CHROMIUM})' > qa-artifacts/browser-environment.json
          node -p 'JSON.stringify(require("./docs/qa/meguru-3d-bridge-approaches/recipe-validation.json").shots)' > qa-artifacts/recipe.json
          node tools/meguru-3d-qa/shot.cjs "$PWD" "$PWD/qa-artifacts/approaches" "$(cat qa-artifacts/recipe.json)" 2>&1 | tee qa-artifacts/captures.log
          printf '0\n' > qa-artifacts/runner-exit-code.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-bridge-approaches-${{ github.sha }}
          path: qa-artifacts
          retention-days: 30


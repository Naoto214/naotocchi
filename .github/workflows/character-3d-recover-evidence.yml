name: Recover Character wave evidence
on:
  push:
    branches: [feat/character-3d-full-rollout-v0]
    paths: ['.github/workflows/character-3d-recover-evidence.yml', '.github/character-3d-qa-export.json', '.github/scripts/character_qa_export.py', '.github/scripts/test_character_qa_export.py']
permissions:
  contents: write
  actions: read
jobs:
  recover:
    if: github.ref == 'refs/heads/feat/character-3d-full-rollout-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify export selection and provenance guards
        run: python .github/scripts/test_character_qa_export.py
      - name: Prepare original QA images as Git Data objects without changing a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/character_qa_export.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-qa-export-result-${{ github.sha }}
          path: qa-export-result.json

name: Time Hand Tutorial (isolated)
on:
  pull_request:
    paths:
      - 'prototypes/naopoyo-time-hand-tutorial/**'
      - '.github/workflows/naopoyo-time-hand-tutorial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tutorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test prototypes/naopoyo-time-hand-tutorial/tests/*.test.mjs
      - run: node prototypes/naopoyo-time-hand-tutorial/build-preview.mjs /tmp/tutorial-preview
  puzzle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --test-concurrency=2 prototypes/naopoyo-chapter2/tests/*.test.mjs prototypes/naopoyo-chapter1/tests/*.test.mjs prototypes/naopoyo-insight/tests/*.test.mjs prototypes/naopoyo-world/tests/*.test.mjs prototypes/naopoyo-v2/tests/*.test.mjs prototypes/naopoyo-rescue/tests/*.test.mjs
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --test-concurrency=2 prototypes/card-game/tests/*.test.mjs

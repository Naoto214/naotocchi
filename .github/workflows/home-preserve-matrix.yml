name: Native home preservation
on:
  push:
    branches: [draft/home-production-preserve]
permissions:
  contents: read
jobs:
  region:
    if: contains(github.event.head_commit.message, '[preserve-matrix]')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        region: [home, forest, river_lake, city, countryside, mountain, snow, sea, jungle, desert, deepsea, star_stop, memory_lake]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tests
            assets
            vendor
            comparisons/dayparts-20261103
      - uses: actions/checkout@v4
        with:
          ref: 384730f1f2b1ef287a2bc4d17df35b861de9f2ae
          path: .production
          persist-credentials: false
          sparse-checkout: |
            assets
            vendor
            comparisons/dayparts-20261103
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select exact candidate runtime
        id: candidate
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MESSAGE" == *"[preserve-stage-a]"* ]]; then
            echo "ref=e731b5d0a9c6f8eabc0dc8b40d29f8d2af35dfd2" >> "$GITHUB_OUTPUT"
          elif [[ "$MESSAGE" == *"[preserve-stage-b]"* ]]; then
            echo "ref=190992523134d4e86a0da6838fb45e921f18a6d1" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          path: .candidate
          ref: ${{ steps.candidate.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            assets
            vendor
            comparisons/dayparts-20261103
      - name: Exercise paired native households
        env:
          REGION: ${{ matrix.region }}
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          python -m pip install playwright==1.62.0
          python tests/home-preserve/matrix.py --production .production --candidate .candidate --region "$REGION" --out "$RUNNER_TEMP/pairs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pairs-${{ matrix.region }}
          path: ${{ runner.temp }}/pairs
          retention-days: 14
          if-no-files-found: error

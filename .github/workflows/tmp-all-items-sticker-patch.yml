name: Temporary all-item sticker patch

on:
  push:
    branches:
      - feat/all-items-stickers-20260917
    paths:
      - .github/workflows/tmp-all-items-sticker-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/all-items-stickers-20260917
      - name: Patch sticker item catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          text = p.read_text()
          old = "    for (const item of SHOP_ITEMS) list.push({ id: `item:${item.id}`, kind: 'item', label: item.label, rarity: 'common', art: { asset: '', emoji: item.emoji }, visual: () => itemIconHTML(item) });"
          lines = [
              "    const stickerItemFallbacks = new Map(SHOP_ITEMS.map((item) => [item.id, item.emoji]));",
              "    for (const [id, def] of Object.entries(ITEM_SYSTEM.CATALOG)) {",
              "      const visualId = id === 'new_themed_pack' ? 'sticker_pack' : id;",
              "      const item = { id: visualId, label: def.label, emoji: stickerItemFallbacks.get(id) || '🎁' };",
              "      list.push({",
              "        id: `item:${id}` ,",
              "        kind: 'item',",
              "        label: def.label,",
              "        rarity: 'common',",
              "        art: { asset: `assets/items/unified/${visualId}.png`, emoji: item.emoji },",
              "        visual: () => itemIconHTML(item),",
              "      });",
              "    }",
          ]
          new = '\n'.join(lines).replace('` ,', '`,')
          if text.count(old) != 1:
              raise SystemExit(f'expected one sticker item loop, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
      - name: Commit implementation and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-all-items-sticker-patch.yml
          git add script.js
          git commit -m "feat: make every current item a sticker"
          git push origin HEAD:feat/all-items-stickers-20260917

name: Home mobility V7 triple-arm regression
on:
  push:
    branches: [draft/home-mobility-v7]
    paths:
      - 'comparisons/home-mobility-v7/build.cjs'
      - 'comparisons/home-mobility-v7/*.js'
      - 'comparisons/home-mobility-v7/*.cjs'
      - 'comparisons/home-mobility-v7/native/**'
      - 'comparisons/home-mobility-v7/matrix_worker.py'
      - 'comparisons/home-mobility-v7/matrix_age.js'
      - '.github/workflows/home-mobility-v7-matrix.yml'
concurrency:
  group: home-mobility-v7-matrix-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  region:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        region: [home, forest, river_lake, city, countryside, mountain, snow, sea, jungle, desert, deepsea, star_stop, memory_lake]
    env:
      REGION: ${{ matrix.region }}
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            comparisons/home-mobility-v7
            comparisons/home-drag-v6
            comparisons/home-finish-v5
      - uses: actions/checkout@v4
        with:
          ref: e07d2cc53eca36ff23e02142ab385d6001e0521b
          path: .cast-reference
          persist-credentials: false
          sparse-checkout: |
            comparisons/home-cast-size-v1
            comparisons/home-cast-size-v2
            comparisons/home-cast-size-v3
            comparisons/home-cast-size-v4
            tools/work
      - uses: actions/checkout@v4
        with:
          ref: 28628cf336a8ed92efe4e9e197ca03298b798a1e
          path: .leaf-reference
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the three isolated game entries from the pinned releases
        run: |
          node .cast-reference/comparisons/home-cast-size-v1/build.cjs "$RUNNER_TEMP/v1" --reference-checkout .leaf-reference
          node .cast-reference/comparisons/home-cast-size-v2/build.cjs "$RUNNER_TEMP/v2" --baseline "$RUNNER_TEMP/v1"
          node .cast-reference/comparisons/home-cast-size-v3/build.cjs "$RUNNER_TEMP/v3" --baseline "$RUNNER_TEMP/v2"
          node .cast-reference/comparisons/home-cast-size-v4/build.cjs "$RUNNER_TEMP/v4" --baseline "$RUNNER_TEMP/v3"
          node comparisons/home-finish-v5/build.cjs "$RUNNER_TEMP/v5" --baseline "$RUNNER_TEMP/v4"
          node comparisons/home-drag-v6/build.cjs "$RUNNER_TEMP/drag" --baseline "$RUNNER_TEMP/v5"
          node comparisons/home-mobility-v7/build.cjs "$RUNNER_TEMP/mobility" --baseline "$RUNNER_TEMP/drag"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure frozen initial gesture replay, natural living, and post-aging touch
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m http.server 8377 --bind 127.0.0.1 --directory "$RUNNER_TEMP/mobility" > "$RUNNER_TEMP/drag-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          python -B comparisons/home-mobility-v7/matrix_worker.py --url http://127.0.0.1:8377 --region "$REGION" --out "$RUNNER_TEMP/mobility-evidence/$REGION"
      - name: Retain only numerical observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobility-matrix-${{ matrix.region }}
          path: ${{ runner.temp }}/mobility-evidence/${{ matrix.region }}
          retention-days: 14
          if-no-files-found: error

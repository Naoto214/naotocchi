name: Minigame phase 4

# ミニゲーム Phase 4(2026-11-28): 100点に とどく 式・ボクセル・ハーフパイプの 光る ポンプ・制限時間の 見直し。
# 本物の ページを スマホ幅・タッチで ひらき、Chromium と WebKit(iPhone の Safari と おなじ エンジン)で たしかめる。
# 回帰テストは npm test(Runtime smoke test)の tests/minigame-phase4-test.cjs。
on:
  pull_request:
    branches: [main]
    paths:
      - 'games.js'
      - 'tools/minigame-audit/**'
      - 'script.js'
      - 'index.html'
      - 'tests/minigame-phase4-*.cjs'
      - 'tests/helpers/**'
      - 'package*.json'
      - '.github/workflows/minigame-phase4.yml'
  push:
    branches: [main]
    paths:
      - 'games.js'
      - 'tools/minigame-audit/**'
      - 'script.js'
      - 'index.html'
      - 'tests/minigame-phase4-*.cjs'
      - 'tests/helpers/**'
      - 'package*.json'
      - '.github/workflows/minigame-phase4.yml'

permissions:
  contents: read

jobs:
  minigame-phase4-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Scoring regressions (harness)
        run: node --test tests/minigame-phase4-test.cjs
      - name: Real page, phone size, touch (Chromium and WebKit)
        run: |
          mkdir -p test-results/minigame-phase4
          node tests/minigame-phase4-browser.cjs --engines chromium,webkit --shots test-results/minigame-phase4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minigame-phase4
          path: test-results/minigame-phase4
          retention-days: 14

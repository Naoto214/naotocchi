name: World single-tree relocation inspection (Draft branch)
on:
  push:
    branches: [feat/meguru-3d-geometry-terrain-v1]
    paths:
      - '.github/workflows/world-tree-relocation.yml'
      - 'docs/qa/meguru-3d-waterwheel-supports/tree-relocation/scene-inspection.cjs'
      - 'docs/qa/meguru-3d-waterwheel-supports/tree-relocation/play.json'
permissions:
  contents: read
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ebec89db9add8d0de28dbf07d8416f61868dc9e3
          path: before
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser QA dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_CHROMIUM=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"
          echo "NODE_PATH=$PWD/node_modules" >> "$GITHUB_ENV"
      - name: Capture unchanged wheel with relocated tree from four sides and normal gameplay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/commit.txt
          git -C before rev-parse HEAD > qa-artifacts/before-commit.txt
          sha256sum meguru.js meguru-3d.mjs index.html > qa-artifacts/source-sha256.txt
          (cd before; sha256sum meguru.js meguru-3d.mjs index.html) > qa-artifacts/before-source-sha256.txt
          root="$PWD"
          for side in before after; do
            source="$root"; if [ "$side" = before ]; then source="$root/before"; fi
            (cd "$source"; node "$root/docs/qa/meguru-3d-waterwheel-supports/tree-relocation/scene-inspection.cjs" "$source" "$root/qa-artifacts/$side") 2>&1 | tee "qa-artifacts/$side-gallery.log"
            (cd "$source"; node "$root/tools/meguru-3d-qa/shot.cjs" "$source" "$root/qa-artifacts/$side" "$(cat "$root/docs/qa/meguru-3d-waterwheel-supports/tree-relocation/play.json")") 2>&1 | tee "qa-artifacts/$side-play.log"
          done
          node - <<'JS'
          const fs=require('fs'),assert=require('assert/strict');
          const b=JSON.parse(fs.readFileSync('qa-artifacts/before/inspection.json'));
          const a=JSON.parse(fs.readFileSync('qa-artifacts/after/inspection.json'));
          assert.deepEqual(a.errors,[]);assert.deepEqual(b.errors,[]);
          assert.equal(a.records.length,4);assert.equal(b.records.length,4);
          for(const v of a.records){const u=b.records.find(q=>q.name===v.name);
            assert.equal(v.targetSha256,u.targetSha256,'waterwheel unchanged');
            assert.deepEqual(v.camera,u.camera);assert.deepEqual(v.tree.parts,u.tree.parts);
            assert.notDeepEqual([v.tree.x,v.tree.z],[u.tree.x,u.tree.z],'source-distinct tree positions');
            assert.equal(v.worldObjects,u.worldObjects);assert.ok(v.active&&u.active);
          }
          console.log('4 source-bound wheel/tree pairs: wheel and tree geometry unchanged, tree position changed');
          JS
          printf '0\n' > qa-artifacts/runner-exit-code.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tree-relocation-inspection-${{ github.sha }}
          path: qa-artifacts
          retention-days: 30

<!doctype html><meta charset="utf-8"><title>V10 responsive QA</title><style>body{font:14px sans-serif}.row{display:flex;gap:20px}article{flex:none}iframe{border:0}</style><h1>V10 Chrome responsive QA (not iPhone Safari)</h1><div class="row" id="frames"></div><script>
for(const [i,[width,height]]of [[320,850],[375,850],[390,850],[430,850],[850,320],[850,375],[850,390],[850,430]].entries()){const a=document.createElement('article'),f=document.createElement('iframe'),p=document.createElement('pre');f.id='q'+i;f.title=width+'x'+height;f.style.width=width+'px';f.style.height=height+'px';f.src='./';a.append(p,f);document.querySelector('#frames').append(a);f.onload=()=>{const d=f.contentDocument;f.style.width=(width+(width-d.documentElement.clientWidth))+'px';p.textContent=width+'x'+height;};}
</script>

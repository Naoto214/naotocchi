<!doctype html><html lang="ja"><meta charset="utf-8"><title>V8 responsive QA</title><style>body{margin:16px;font:14px sans-serif}.row{display:flex;gap:20px;align-items:start}iframe{height:850px;border:0}pre{white-space:pre-wrap}article{flex:none}</style><h1>V8 viewport-width QA (Chrome, not iPhone Safari)</h1><div class="row" id="frames"></div><script>
for(const width of [320,375,390,430]){const article=document.createElement('article'),frame=document.createElement('iframe'),pre=document.createElement('pre');frame.id='w'+width;frame.title=width+'px';frame.style.width=width+'px';frame.src='./';article.append(pre,frame);document.querySelector('#frames').append(article);frame.onload=()=>{const d=frame.contentDocument;frame.style.width=(width+(width-d.documentElement.clientWidth))+'px';setTimeout(()=>{pre.textContent=JSON.stringify({requested:width,clientWidth:d.documentElement.clientWidth,overflow:d.documentElement.scrollWidth-d.documentElement.clientWidth,buttonsMinHeight:Math.min(...[...d.querySelectorAll('button')].map(b=>b.getBoundingClientRect().height)),svg:d.querySelectorAll('svg').length,selected:d.querySelector('#selected').textContent},null,2)},300)}}
</script></html>

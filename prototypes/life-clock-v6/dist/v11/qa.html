<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V11 表示QA</title><style>body{font:15px sans-serif;background:#f5f6f5;color:#233e4e;margin:16px}button,select{padding:12px;min-height:44px}iframe{border:1px solid #bcc;display:block;max-width:none}pre{white-space:pre-wrap}#frame-wrap{overflow:auto;max-width:100%}</style><h1>VERSION 11 画面幅検証</h1><p>iframeのCSS viewportを変更します。iPhone Safari・セーフエリアの実機検証ではありません。</p><button id="run">8画面を自動検証</button><select id="size"><option>320×850</option><option>375×850</option><option selected>390×850</option><option>430×850</option><option>850×320</option><option>850×375</option><option>850×390</option><option>850×430</option></select><pre id="result">未実行</pre><div id="frame-wrap"><iframe title="検証対象" id="frame" width="390" height="850" src="index.html"></iframe></div><script type="module">
const frame=document.querySelector('#frame'),result=document.querySelector('#result'),select=document.querySelector('#size');
const cases=[[320,850],[375,850],[390,850],[430,850],[850,320],[850,375],[850,390],[850,430]];
async function open(w,h){frame.width=w;frame.height=h;await new Promise(resolve=>{frame.onload=resolve;frame.src='index.html?qa='+w+'x'+h;});await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));}
function inspect(){const d=frame.contentDocument;return {width:frame.width,height:frame.height,overflow:d.documentElement.scrollWidth-d.documentElement.clientWidth,numerals:d.querySelectorAll('#live [data-main-number]').length,minButton:Math.min(...[...d.querySelectorAll('button')].map(x=>x.getBoundingClientRect().height)),variants:d.querySelectorAll('[data-variant]').length,comparison:d.querySelectorAll('#comparison figure').length};}
select.onchange=async()=>{await open(...select.value.split('×').map(Number));result.textContent=JSON.stringify(inspect(),null,2)};
document.querySelector('#run').onclick=async()=>{const rows=[];result.textContent='実行中';for(const [w,h] of cases){await open(w,h);rows.push(inspect());result.textContent=JSON.stringify(rows,null,2);}result.dataset.complete='true';};
</script></html>

<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V12 viewport QA</title><style>body{font:16px sans-serif;background:#edf1f2}section{overflow:auto;margin:30px 0}iframe{border:1px solid #789;display:block}</style><h1>V12 viewport QA</h1><p>内部iframeのCSS幅の検証です。実機Safariの代わりにはなりません。</p><div id="frames"></div><script>for(const [w,h] of [[320,568],[375,667],[390,844],[430,932],[568,320],[667,375],[844,390],[932,430]]){const s=document.createElement('section');s.innerHTML=`<h2>${w} × ${h}</h2><iframe width="${w}" height="${h}" title="${w}x${h}" src="index.html"></iframe>`;document.getElementById('frames').append(s);}</script></html>

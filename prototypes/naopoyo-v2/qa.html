<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>なおぽよ v2 画面QA</title><style>body{font:14px system-ui;background:#dae0df;margin:12px}button{padding:12px;margin-right:10px}iframe{display:block;margin-top:12px;border:1px solid #7b8c80;width:390px;height:844px;background:white}</style><p>画面幅の確認用。iPhone Safari実機テストではありません。</p><button data-size="375,667">375 × 667</button><button data-size="390,844">390 × 844</button><button data-size="430,932">430 × 932</button><iframe title="iPhone幅の試遊画面" src="./index.html"></iframe><script>for(const b of document.querySelectorAll('button'))b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px'};</script></html>

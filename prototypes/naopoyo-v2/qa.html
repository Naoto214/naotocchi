<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>なおぽよ v2 画面QA</title><style>body{font:14px system-ui;background:#dae0df;margin:12px}button{padding:12px;margin-right:10px}iframe{display:block;margin-top:12px;border:1px solid #7b8c80;width:390px;height:844px;background:white}</style><p>画面幅の確認用。iPhone Safari実機テストではありません。</p><button data-size="375,667">375 × 667</button><button data-size="390,844">390 × 844</button><button data-size="430,932">430 × 932</button><p>下のボタンは実appのPointerEventハンドラを通す描画検査です（合成入力）。実際の指の操作はiframe内で直接試してください。</p><button data-scene="V10">場面10を準備</button><button data-scene="V23">場面23を準備</button><button id="down">タッチ開始</button><button id="step">1マス進む</button><button id="back">1マス戻る</button><button id="up">指を離す</button><span id="phase">通常</span><iframe title="iPhone幅の試遊画面" src="./index.html"></iframe><script>for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px'};
const frame=document.querySelector('iframe');let cursor={x:0,y:3};
for(const b of document.querySelectorAll('[data-scene]'))b.onclick=()=>{
 const d=frame.contentDocument;d.getElementById('stageSelect').click();const i=Number(b.dataset.scene.slice(1))-1;d.getElementById('levels').children[i].click();cursor={x:0,y:i===22?0:3};document.getElementById('phase').textContent='通常';
};
function pointer(type){const d=frame.contentDocument,c=d.getElementById('board'),r=c.getBoundingClientRect();
 // QA-only capture shim: synthetic pointer ids cannot own native pointer capture.
 c.setPointerCapture=()=>{};c.hasPointerCapture=()=>false;
 c.dispatchEvent(new frame.contentWindow.PointerEvent(type,{pointerId:99,pointerType:'touch',bubbles:true,cancelable:true,clientX:r.left+(cursor.x+.5)*r.width/7,clientY:r.top+(cursor.y+.5)*r.height/7}));
 document.getElementById('phase').textContent=type+' / '+d.getElementById('active').textContent;
}
document.getElementById('down').onclick=()=>pointer('pointerdown');
document.getElementById('step').onclick=()=>{cursor.x=Math.min(6,cursor.x+1);pointer('pointermove')};
document.getElementById('back').onclick=()=>{cursor.x=Math.max(0,cursor.x-1);pointer('pointermove')};
document.getElementById('up').onclick=()=>pointer('pointerup');
</script></html>

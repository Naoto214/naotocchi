<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>version 18 白と文字の比較</title><style>body{margin:20px;background:#e8e9e9;color:#343b3e;font:14px sans-serif}h1{font-size:20px}button{padding:10px;margin:0 5px 10px 0}main{display:flex;gap:18px}section{flex:none;width:390px}iframe{width:390px;height:700px;border:0}h2{font-size:14px;margin:8px 0}p{line-height:1.7}</style><h1>微睡みの箱庭 — version 18 比較</h1><p>各画面の本文幅390px。左：変更前 ／ 中：version 18 ／ 右：純白比較。実機Safariの撮影ではありません。</p><nav id="controls"><button data-ch="0">表紙</button><button data-ch="1">第一章・本文</button><button data-ch="2">第二章</button><button data-ch="3">第三章</button><button data-ch="4">第四章</button><button data-ch="5">第五章</button><button data-ch="6">第六章</button></nav><main><section><h2>version 17 · #F7F5F0</h2><iframe title="変更前" src="reader-v17.html"></iframe></section><section><h2>version 18 · #FCFBF9（採用候補）</h2><iframe title="変更後" src="reader-v18.html"></iframe></section><section><h2>純白比較 · #FFFFFF</h2><iframe title="純白" src="reader-pure-white.html"></iframe></section></main><p>番号と章タイトルの余白：旧半角空白 → 0.9em。タイトル色 #414C50、本文色 #343B3E は維持。</p><script>
const frames=[...document.querySelectorAll('iframe')];
frames.forEach(f=>f.onload=()=>{const d=f.contentDocument;d.documentElement.style.scrollbarWidth='none';d.querySelector('[data-size="16.5"]').click();f.contentWindow.scrollTo(0,0)});
document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>frames.forEach(f=>{const d=f.contentDocument,w=f.contentWindow;const h=d.querySelector('#chapter-'+b.dataset.ch+' h2');w.scrollTo(0,b.dataset.ch==='0'?0:w.scrollY+h.getBoundingClientRect().top-d.querySelector('.toolbar').offsetHeight-32)}));
</script></html>

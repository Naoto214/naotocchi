<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>version 19 本文2か所の確認</title><style>body{font:14px/1.8 sans-serif;margin:20px;background:#e8e9e9}h1{font-size:20px}main{display:flex;gap:24px}section{width:390px;flex:none}h2{font-size:16px}iframe{width:390px;height:700px;border:0}button{padding:12px}</style><h1>微睡みの箱庭 version 19 — 承認済み本文修正</h1><p>390px・標準16.5px。左：第五章 ／ 右：第六章。Chromium撮影。</p><main><section><h2>第五章</h2><iframe title="第五章の修正" data-anchor="209" src="index.html"></iframe></section><section><h2>第六章</h2><iframe title="第六章の修正" data-anchor="353" src="index.html"></iframe></section></main><button id="edits">修正2か所</button><button id="ending">結末</button><script>
const fs=[...document.querySelectorAll('iframe')];
function jump(f,id){const d=f.contentDocument,w=f.contentWindow,p=d.querySelector('[data-source-index="'+id+'"]');w.scrollTo(0,w.scrollY+p.getBoundingClientRect().top-d.querySelector('.toolbar').offsetHeight-24)}
fs.forEach(f=>f.onload=async()=>{const d=f.contentDocument;d.documentElement.style.scrollbarWidth='none';await d.fonts.ready;d.querySelector('[data-size="16.5"]').click();requestAnimationFrame(()=>jump(f,f.dataset.anchor))});
document.getElementById('edits').onclick=()=>fs.forEach(f=>jump(f,f.dataset.anchor));document.getElementById('ending').onclick=()=>fs.forEach(f=>jump(f,389));
</script></html>

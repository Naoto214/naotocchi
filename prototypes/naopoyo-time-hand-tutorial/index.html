<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f2e8"><title>なおぽよ。｜ときのはり</title><link rel="stylesheet" href="./style.css"></head><body>
<main><header><div class="brand">なおぽよ。 <span>ときのはり</span></div><div id="progress">0 / 8 クリア</div></header>
<nav id="lessons" aria-label="練習を選ぶ"></nav>
<div class="play-layout"><section class="board-section"><div class="board-top"><span id="phase">プレイ中</span><span id="moves">0 手</span></div><div class="canvas-wrap"><canvas id="board" width="640" height="640" aria-label="8×8の盤面。キャラクターを選び、隣のマスをタップまたはドラッグで移動。矢印ボタンでも操作できます。"></canvas></div><div class="board-bottom"><span id="mass"></span><span id="gravity"></span></div></section>
<section class="panel"><div class="lesson-heading"><span id="lesson-number">01</span><h1 id="title"></h1></div><p id="text"></p><p id="goal"></p>
<div id="status" role="status" aria-live="polite">キャラクターを選んで動かそう。</div>
<div class="tools"><button id="undo">もどす</button><button id="retry">やりなおす</button><button id="hint">ヒント</button></div><p id="hint-text" hidden></p>
<div class="movement"><div><label for="actor">動かすキャラ</label><select id="actor" aria-label="動かすキャラクター"></select><small>タップ・ドラッグ・一筆書き<br>矢印キーでも動かせます</small></div><div id="directions" class="directions" aria-label="8方向へ移動"></div></div>
<div class="inspect"><label><input type="checkbox" id="predict"> 生成先の予告</label><button id="route" disabled>生成経路を見る</button><button id="play" hidden>プレイへ戻る</button></div>
<div id="birth-controls" hidden><label>生成順 <input id="birth" type="range" min="0" max="7" value="7"><output id="birth-label"></output></label><p id="trace-info"></p><button id="settled">重力後・最終配置を見る</button></div>
<footer><button id="prev">← まえへ</button><button id="next" class="primary">つぎへ →</button></footer>
</section></div><p class="footnote">正式導入前の練習版 · 本編とは別の保存領域 <span id="save-note">自動保存</span></p>
</main><script type="module" src="./app.mjs"></script></body></html>

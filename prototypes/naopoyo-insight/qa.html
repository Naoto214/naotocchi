<!doctype html><html lang="ja"><meta charset="utf-8"><title>発想型Pilot 画面検証</title><style>body{font:14px system-ui;background:#e7eee8;color:#294b47}section{display:flex;gap:14px;flex-wrap:wrap}iframe{border:1px solid #aaa}article{width:265px}canvas{width:256px;height:256px}pre{white-space:pre-wrap}h3{font-size:14px}</style><h1>なおぽよ。発想型7面 — Chromium画面検証</h1><section id="gallery"></section><h2>375 / 390 / 430px・短画面</h2><section id="phones"></section><pre id="measure">測定中</pre><script type="module">
import {stages} from './stages.mjs';import {WorldSession} from '../naopoyo-world/session.mjs';import {render,loadGuests} from '../naopoyo-world/render.mjs';import {loadSprites} from '../naopoyo-rescue/sprites.mjs';await Promise.all([loadSprites(),loadGuests(stages)]);
for(const s of stages){const a=document.createElement('article');a.innerHTML=`<h3>${s.id} ${s.title}</h3><canvas></canvas>`;gallery.append(a);render(a.querySelector('canvas'),new WorldSession(s),{dpr:2})}
const frames=[];for(const [w,h] of [[375,667],[390,664],[430,740],[375,520],[375,460]]){const f=document.createElement('iframe');f.width=w;f.height=h;f.src='./index.html';phones.append(f);frames.push(f)}
const timer=setInterval(()=>{if(!frames.every(f=>f.contentWindow.pilot))return;clearInterval(timer);const m=frames.map(f=>{const d=f.contentDocument;d.querySelector('#close').click();const b=d.querySelector('#board').getBoundingClientRect(),nav=d.querySelector('nav').getBoundingClientRect();return{width:f.width,height:f.height,cell:b.width/8,board:[b.x,b.y,b.width,b.height],scroll:d.documentElement.scrollHeight>Number(f.height),controlsFit:nav.bottom<=Number(f.height)}});measure.textContent=JSON.stringify(m,null,2)},100);
</script></html>

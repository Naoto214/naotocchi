<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#edf3ee" />
    <title>なおぽよ。｜星の道をほどこう</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          なおぽよ<span>。</span><small>NAOPOYO. / INSIGHT PILOT</small>
        </div>
        <button id="compare" aria-label="8×8盤面">8×8</button
        ><button id="pause" aria-label="一時停止">Ⅱ</button>
      </header>
      <section class="intro">
        <div><span id="chapter">CHAPTER 01</span><span id="clock"></span></div>
        <h1 id="title"></h1>
      </section>
      <section class="arena">
        <canvas
          id="board"
          aria-label="キャラをなぞって合体・分裂し、全員を星へ"
        ></canvas>
        <div id="paused" hidden>
          ひとやすみ<br /><small>右上の ▶ でつづける</small>
        </div>
      </section>
      <div id="status" role="status">キャラから、なぞってみよう</div>
      <nav>
        <button id="undo">↶ <span>もどす</span></button
        ><button id="retry">↻ <span>やり直す</span></button
        ><button id="hint">✧ <span>ヒント</span></button
        ><button id="select">▦ <span>えらぶ</span></button>
      </nav>
    </main>
    <dialog id="dialog">
      <div class="dialog-head">
        <span>星の道をほどこう</span><button id="close">とじる</button>
      </div>
      <div id="content"></div>
    </dialog>
    <script type="module">
      import { mount } from "../naopoyo-world/app.mjs";
      import { stages } from "./stages.mjs";
      window.pilot = mount({stages, key:"naopoyo.insight.pilot.20261023.v1", fixedBoard:true, label:"発想型7面 v1", intro:true});
    </script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#eaf4f1" />
    <title>なおぽよ・ドロップ｜新ルール試遊</title>
    <link rel="stylesheet" href="phone.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <div>
          <small>独立試遊 · 正式採用前</small>
          <h1>なおぽよ・ドロップ</h1>
        </div>
        <button id="pause">設定 / 保存</button>
      </header>
      <div id="stats">
        <span id="score">0点</span><span id="progress">08へ育てよう</span
        ><span id="cost-label">へんしん 2 / 6</span>
      </div>
      <div id="next" aria-label="次の3組"></div>
      <div class="arena">
        <section id="board" aria-label="6列12段の盤面"></section>
        <aside>
          <div class="gauge">ゲージ<strong id="gauge">0</strong></div>
          <div id="eggs"></div>
          <button id="transform">へんしん<br /><small>2</small></button
          ><button id="bulk">だいへんしん<br /><small>6</small></button
          ><button id="cancel">選択取消</button>
        </aside>
        <div id="celebrate" aria-live="polite"></div>
      </div>
      <section id="selection">
        <span id="instruction" role="status"
          >どの種族でもいい。ひとつの命を08へ。</span
        >
        <div id="choices"></div>
      </section>
      <nav class="controls" aria-label="落下操作">
        <button data-move="left">← 左</button
        ><button data-move="rotate">↻ 回転</button
        ><button data-move="right">右 →</button
        ><button data-move="ccw">↶ 逆回転</button
        ><button data-move="down">↓ ゆっくり</button
        ><button id="drop" class="primary">一気に落とす</button>
      </nav>
      <dialog id="menu">
        <h2>新ルール試遊</h2>
        <p>開発中・正式バランス未確定。旧ルールとは保存・記録・設定が別です。</p>
        <nav><a data-old-rule href="../growth-chain/player.html?series=1">旧ルールへ戻る</a> · <a href="../naopoyo/">シリーズ入口</a></nav>
        <p>
          同じ段階：同種は進化、異種は全体消滅。<br />同種08をつなげて、いのちをめぐらせよう。
        </p>
        <p>
          左右スワイプ＝移動、タップ＝回転、下スワイプ＝落下。道具選択中も時間は進みます。
        </p>
        <label
          >比較費用
          <select id="cost">
            <option value="2">2 / 6（第一候補）</option>
            <option value="8">8 / 24（比較）</option>
          </select></label
        ><label>seed <input id="seed" type="number" value="214" /></label>
        <div id="roster"></div>
        <p>
          5種族を重複なく選択。能力差はありません。設定変更は新しいゲームから適用。
        </p>
        <label><input type="checkbox" id="sound" />音を鳴らす</label
        ><label><input type="checkbox" id="reduced" />動きを控える</label
        ><button id="new">新しく開始</button
        ><button id="resume" class="primary">保存して戻る</button>
        <h3>代表連鎖の再生</h3>
        <select id="example">
          <option value="chain3">3連鎖</option>
          <option value="chain5">5連鎖</option>
          <option value="chain10">10連鎖</option>
          <option value="lifetime08">08寿命</option></select
        ><button id="replay">再生（練習）</button
        ><button id="back">保存したゲームへ戻る</button>
        <h3>試遊の記録</h3>
        <div id="records"></div>
        <p id="storage-status"></p>
        <a href="index.html">従来の比較ラボ</a>
      </dialog>
    </main>
    <script type="module" src="phone.mjs"></script>
  </body>
</html>

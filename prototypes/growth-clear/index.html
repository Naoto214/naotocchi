<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>なおぽよ 成長・消滅比較室</title><link rel="stylesheet" href="style.css">
<main><header><small>独立試作 · 正式採用前</small><h1>ひとつの命を、08へ。</h1><p>同じ段階をつなぐ。同種なら成長、異種が混ざれば全体消滅。</p></header>
<section class="settings"><label>seed <input id="seed" type="number" min="0" max="4294967295" value="4100"></label><label>ルール <select id="mode"><option value="new">新・異種消滅</option><option value="old">旧・同種成長（新出現列）</option></select></label><label>残存位置 <select id="anchor"><option value="A">A 最下段・最左</option><option value="B">B 最後の着地を優先</option><option value="C">C 自分で選ぶ</option></select></label><label>へんしん / 大 <select id="cost"><option value="8">8 / 24</option><option value="2">2 / 6</option><option value="3">3 / 9</option><option value="4">4 / 12</option></select></label><button id="start">この設定で始める</button></section>
<details><summary>好きな5種族（表示用・能力差なし）</summary><div id="species"></div><p>この試作では、お気に入りセットの保存は行いません。</p></details>
<div class="game"><section><div id="next" aria-label="現在とNEXT3"></div><div id="board" role="grid" aria-label="6列12段の盤面"></div><div class="controls"><button data-move="left">←</button><button data-move="rotate">回転</button><button data-move="right">→</button><button id="drop">落とす</button></div></section>
<aside><p id="status" role="status"></p><p id="message" aria-live="polite">種族は色と番号で識別できます。</p><div class="tools"><label>種族 <select id="kind"></select></label><label>卵 <select id="rank"><option value="0">普通 → 01</option><option value="1">銀 → 02</option><option value="2">金 → 03</option><option value="3">プラチナ → 04</option></select></label><button id="egg">卵：置く列をタップ</button><button id="transform">へんしん：対象をタップ</button><label>大へんしんの元 <select id="from"></select></label><button id="bulk">大へんしん</button><button id="cancel">選択をやめる</button></div><hr><button id="ai">AIが1操作</button><button id="export">操作記録を保存</button><label>記録を再現 <input id="import" type="file" accept="application/json,.json"></label><label>代表例 <select id="example"><option value="chain3">3連鎖</option><option value="chain5">5連鎖</option><option value="chain7plus">7連鎖以上</option><option value="lifetime08">08寿命消滅</option><option value="high-stage-mixed-loss">高段階の異種消滅</option></select></label><button id="load-example">代表例を再現</button><div id="replay"><label>直前の連鎖 <input id="wave" type="range" min="0" max="0" value="0"></label><button id="live">現在へ戻る</button></div></aside></div>
<footer>同種08の接続だけが寿命クリア。異種08混合は消滅してもクリアになりません。Cでは連鎖中も残す位置を選びます。自動落下タイマーなしの比較画面です。</footer></main><script type="module" src="ui.mjs"></script></html>

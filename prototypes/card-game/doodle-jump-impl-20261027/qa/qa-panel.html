<section id="dj-qa" class="dj-qa" aria-labelledby="dj-qa-title">
<details>
<summary id="dj-qa-title">本人QA：ぴょんぴょんジャンプ改善案B</summary>
<p class="dj-note">確認用の画面です。通常の対戦・戦績・保存には影響しません（下の「確認用デッキを追加」だけはマイデッキに1件追加します）。</p>
<div class="dj-card" id="dj-card"></div>
<h3>固定局面で効果を確認</h3>
<div class="dj-buttons">
<button type="button" data-dj="single">1段階（いぬ①→②）</button>
<button type="button" data-dj="multi">2段階（いぬ①→③）</button>
<button type="button" data-dj="none">ときおくりしない</button>
<button type="button" data-dj="twice">同じターンに2回</button>
<button type="button" data-dj="legacy">旧版（hotseat-2）の効果</button>
</div>
<ol class="dj-log" id="dj-log" aria-live="polite"></ol>
<h3>CPUの判断</h3>
<div class="dj-buttons">
<button type="button" data-dj="cpu-cannot">ときおくりできない</button>
<button type="button" data-dj="cpu-short">時が1足りない</button>
<button type="button" data-dj="cpu-can">ときおくりできる</button>
<button type="button" data-dj="cpu-discount">カブトムシ④の軽減</button>
</div>
<h3>旧保存の復帰</h3>
<div class="dj-buttons"><button type="button" data-dj="saves">修正前に作った保存3件を再生</button></div>
<h3>盤面で試す</h3>
<p class="dj-note">いぬ①〜⑥・ぴょんぴょんジャンプ3枚などの40枚を「マイデッキ」に追加します。対戦の準備で、自分（とCPUの「マイデッキ」）にこのデッキを選んで開始してください。</p>
<div class="dj-buttons"><button type="button" data-dj="deck">確認用デッキを追加</button></div>
</details>
</section>

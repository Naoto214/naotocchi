<!doctype html><html lang="ja"><meta charset="utf-8"><base href="../../"><link rel="stylesheet" href="style.css"><style>body{padding:12px}#cards{display:flex;flex-wrap:wrap;gap:16px}.sample{width:320px}.sample>p{font-size:13px}.small-sizes{display:flex;gap:16px;align-items:start;margin-top:12px}.small-sizes>div{flex:none}.sample>.card-face{width:320px;height:480px}</style><h1>署名・レア表示・能力値の比較</h1><div id="cards"></div><script type="module">import {CARDS} from './engine.mjs';import {cardMarkup} from './ui-presentation.mjs';const ids=['M-star-06','M-star-07','M-starfish-01','C-shiba','P-anglerfish','G-memory-cards','W-forest','I-c_coin2','E-naoto'];cards.innerHTML=ids.filter(id=>CARDS[id]).map(id=>`<section class="sample"><p>${CARDS[id].form??CARDS[id].name} · ${id}</p>${cardMarkup(CARDS[id],{detail:true})}<div class="small-sizes">${[80,110].map(width=>`<div style="width:${width}px"><p>${width}px</p>${cardMarkup(CARDS[id])}${cardMarkup(CARDS[id],{compact:true})}</div>`).join('')}</div></section>`).join('');import {auditRarityLayout} from './tests/ui-rarity-layout.browser.mjs';await document.fonts.ready;const result=auditRarityLayout(document);const pre=document.createElement('pre');pre.id='layout-report';pre.textContent=JSON.stringify(result,null,2);document.body.append(pre);</script></html>

<!doctype html><html lang="ja"><meta charset="utf-8"><base href="../../"><link rel="stylesheet" href="style.css"><style>body{padding:16px}.row{display:flex;gap:24px;margin:16px 0}section{width:240px;flex:none}h2,p{font-size:14px}#result{white-space:pre-wrap}</style><h1>テスト用コピーでのレア切替（正式定義は無変更）</h1><div id="samples"></div><pre id="result"></pre><script type="module">import {CARDS} from './engine.mjs';import {cardMarkup,cardRarityLabel} from './ui-presentation.mjs';const baseline=JSON.stringify(CARDS),report=[];for(const id of ['M-starfish-01','M-star-07']){const c=CARDS[id],variants=[c,{...c,rare:!c.rare}],row=document.createElement('div');row.className='row';row.innerHTML=variants.map((v,i)=>`<section><h2>${i?'仮変更後':'現行'}：${cardRarityLabel(v)}</h2>${cardMarkup(v,{detail:true})}</section>`).join('');samples.append(row);const cards=[...row.querySelectorAll('.card-face')];report.push({id,from:cardRarityLabel(variants[0]),to:cardRarityLabel(variants[1]),sameImage:cards[0].querySelector('img').src===cards[1].querySelector('img').src,sameSignature:cards.every(c=>c.querySelector('.card-footer').textContent==='NAOTOCCHI'),markers:cards.map(c=>!!c.querySelector('.card-rarity'))});}result.textContent=JSON.stringify({officialDefinitionsUnchanged:baseline===JSON.stringify(CARDS),cases:report},null,2);</script></html>

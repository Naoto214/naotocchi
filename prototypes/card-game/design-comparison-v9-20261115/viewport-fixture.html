<!doctype html><html><meta charset="utf-8"><title>V9 width QA</title><style>body{margin:0;background:#c8ccc8}nav{height:48px;display:flex;gap:10px;align-items:center}button{height:40px}iframe{border:0;display:block;height:844px;background:white}</style><nav><button data-width="320">320</button><button data-width="375">375</button><button data-width="390">390</button><button data-width="430">430</button><button data-page="index.html">比較</button><button data-page="all-cards-fixture.html">全件QA</button><button data-page="battle.html">対戦</button><button data-page="battle.html?scenario=finish">終局QA</button><button data-page="battle.html?scenario=declaration">宣言QA</button></nav><iframe width="405" src="index.html" title="V9 mobile preview"></iframe><script>
const frame=document.querySelector('iframe');let target=390,observer;
function sync(){const doc=frame.contentDocument;if(!doc)return;const scrollbar=frame.contentWindow.innerWidth-doc.documentElement.clientWidth;const next=target+scrollbar;if(Number(frame.width)!==next)frame.width=next;frame.dataset.actual=doc.documentElement.clientWidth;}
frame.onload=()=>{observer?.disconnect();observer=new ResizeObserver(()=>requestAnimationFrame(sync));observer.observe(frame.contentDocument.documentElement);sync();};
document.addEventListener('click',e=>{if(e.target.dataset.page)frame.src=e.target.dataset.page;if(e.target.dataset.width){target=Number(e.target.dataset.width);frame.width=target;requestAnimationFrame(sync);}});
</script></html>

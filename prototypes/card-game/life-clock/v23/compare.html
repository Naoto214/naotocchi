<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>人生の時計 V22 / V23</title>
<link rel="stylesheet" href="/prototypes/card-game/life-clock.css">
<style>*{box-sizing:border-box}body{margin:0;background:#0e1b26;color:#e7edf1;font:15px system-ui;padding:22px max(16px,env(safe-area-inset-right))}main{max-width:1100px;margin:auto}h1{font-size:24px}p{line-height:1.7;color:#b9cbd8}button,select,input{font:inherit}button,select{border:1px solid #61788b;border-radius:9px;padding:10px;background:#213849;color:#edf4f8}button{cursor:pointer}nav{display:flex;gap:10px;flex-wrap:wrap}.clocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.clock svg{width:100%;height:auto;display:block}.clock h2{font-size:19px;margin-bottom:0}.clock p{margin-top:0}.controls{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}.controls label{display:flex;align-items:center;gap:8px}input{width:130px}a{color:#b8d9ed}dialog{color:#243a48}@media(max-width:600px){.clocks{grid-template-columns:1fr}.clock{max-width:440px;margin:auto;width:100%}} </style>
<main><h1>人生の時計 — V22 / V23</h1><p>同じ値で、中央3針と中心軸を比較します。色とゲーム内の意味は同じです。</p><nav><select id="case" aria-label="重なり条件"><option value="separate">3針を分ける</option><option value="all">3針を重ねる</option><option value="red-green">赤と緑</option><option value="gold-red">金と赤</option><option value="gold-green">金と緑</option><option value="crossing">双葉・小文字盤と重ねる</option></select><a href="/prototypes/card-game/index.html">最新版のCARD GAMEを試す</a></nav>
<div class="controls"><label>金・ラウンド <input id="round" type="range" min="0" max="12" value="7"><output></output></label><label>赤・先攻の時 <input id="firstTime" type="range" min="0" max="12" value="4"><output></output></label><label>緑・後攻の時 <input id="secondTime" type="range" min="0" max="12" value="9"><output></output></label></div>
<div class="clocks"><section class="clock"><h2>V22 — 修正前</h2><p>上から 緑 → 赤 → 金</p><div id="old"></div><button id="open-old">V22を拡大・操作</button></section><section class="clock"><h2>V23 — 修正後</h2><p>上から 金 → 赤 → 緑</p><div id="new"></div><button id="open-new">V23を拡大・操作</button></section></div><p>金：秒針相当の形／赤：分針相当の形／緑：時針相当の形。実時間を示す時計ではありません。拡大・表裏・ピンチは既存の時計操作を使用します。</p></main><dialog id="life-clock-dialog"></dialog>
<script type="module">
import {render as old,renderBack,alignNumerals} from '/prototypes/card-game/life-clock/v19/clock-v19.mjs';
import {render as renderV23} from '/prototypes/card-game/life-clock/v23/clock-v23.mjs';
const renderClock=s=>renderV23(s).replaceAll('../v16/','/prototypes/card-game/life-clock/v16/');
import {sample,overlapCases} from '/prototypes/card-game/life-clock/clock.mjs';
import {mountLifeClock} from '/prototypes/card-game/life-clock-view.mjs';
let state={...sample},version='V23';
const oldClock=s=>old(s).replaceAll('../v16/','/prototypes/card-game/life-clock/v16/');
const dialog=document.querySelector('#life-clock-dialog');
const detail=mountLifeClock({dialog,getView:()=>({round:state.round,mode:'local',players:{A:{time:state.firstTime,growth:state.firstGrowth},B:{time:state.secondTime,growth:state.secondGrowth}}}),onPause(){},onResume(){},loadRenderer:async()=>({renderClock:version==='V22'?oldClock:renderClock,renderBack,alignNumerals})});
function draw(){document.querySelector('#old').innerHTML=oldClock(state);document.querySelector('#new').innerHTML=renderClock(state);alignNumerals(document.querySelector('main'));for(const k of ['round','firstTime','secondTime']){const e=document.getElementById(k);e.value=state[k];e.nextElementSibling.value=state[k];}}
for(const k of ['round','firstTime','secondTime'])document.getElementById(k).oninput=e=>{state[k]=+e.target.value;draw();};
document.querySelector('#case').onchange=e=>{state={...sample,...overlapCases.find(c=>c.id===e.target.value).state};draw();};
for(const [id,v]of[['old','V22'],['new','V23']])document.querySelector('#open-'+id).onclick=async()=>{version=v;await detail.open();dialog.querySelector('h2 small').textContent=v;};draw();
</script></html>

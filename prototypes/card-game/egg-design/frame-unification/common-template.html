/* Adopted AB-soft: PR #397 0f6f9bcb, approved 2026-10-19. */
.card-face{--study-frame:1.4cqw;--study-band:55%;--band-ink:#141d24}
.card-face::before{
 content:"";position:absolute;inset:2.6%;border:var(--study-frame) solid var(--card-color);border-radius:4%;z-index:0;pointer-events:none;
}
.card-face .card-heading{
 background:linear-gradient(100deg,color-mix(in srgb,var(--card-color) var(--study-band),white),color-mix(in srgb,var(--card-color) var(--study-band),white));
 border-radius:12% 12% 8% 8%;box-shadow:inset 0 0 0 1px #9099a0;color:var(--band-ink);
}
.card-face .card-stats>span{
 background:linear-gradient(110deg,color-mix(in srgb,var(--card-color) 35%,#f4fdff),#f4fdff 50%,color-mix(in srgb,var(--card-color) 35%,#f4fdff));
 box-shadow:inset 0 -1.6cqw var(--card-color),inset 0 0 0 1px #eff8ff,0 0 0 1px #bfc8cf;
}
.card-face::after{
 content:"";position:absolute;bottom:3.3%;left:8%;right:8%;height:2%;background:var(--card-color);border:1px solid #9099a0;border-radius:50%;z-index:0;pointer-events:none;
}


/* Cost ink is independent of heading ink; no size/placement override of CPU work. */
.card-face .card-cost{color:#141d24}

/* Egg state card shares the normal 2:3 slot canvas, with no extra board row. */
.egg-card{width:100%;height:100%;aspect-ratio:2/3;overflow:hidden;border-radius:5%;background:#386885;position:relative}
.egg-card img{display:block;width:100%;height:100%;object-fit:contain}
.opponent .slot .egg-card{flex:none;width:10px;height:15px}
@media(orientation:landscape){.opponent .slot .egg-card{width:100%;height:100%}}
.detail-card-canvas>.egg-card{width:320px;height:480px}

.egg-card img{object-fit:contain}.effect-scroll ol{padding-left:22px;font-size:14px;line-height:1.6}

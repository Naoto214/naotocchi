<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>たまごカード A/B/C 比較</title><style>body{margin:20px;background:#18332f;color:#eef4ee;font-family:system-ui;line-height:1.7}a{color:#cce3f1}figure{margin:20px 0;overflow-x:auto}img{display:block;max-width:none}article{max-width:720px}.final{width:min(100%,512px);height:auto}</style><h1>たまごカード — C案採用</h1><article><p>A：改訂前 ／ B：メインカード準拠 ／ C：準拠＋控えめ装飾。右端は正式採用済みメインカードの保存画像です。</p><p>丸い外枠、タイトル帯、独立したイラスト・効果欄へ統一。Cは銀葉を四隅へ整理し、たまごを主役にしました。時コスト・ちから・ちえは付けません。</p><p>本文：自分のターン開始時、通常ドローの後にさらに1枚引き、手札1枚を山札の一番下に戻す。</p><p><a href="../../">試遊へ</a> · <a href="../egg-card-print.png">完成カードPNG</a> · <a href="../comparison.html">重ね置きUI比較</a></p></article><h2>カード幅 80px</h2><figure><img src="comparison-80.png" width="420" height="184" alt="A/B/Cと正式メインカードの80px比較"></figure><h2>カード幅 110px</h2><figure><img src="comparison-110.png" width="540" height="229" alt="A/B/Cと正式メインカードの110px比較"></figure><h2>カード幅 320px</h2><figure><img src="comparison-320.png" width="1380" height="544" alt="A/B/Cと正式メインカードの320px比較"></figure><h2>完成カード</h2><img class="final" src="../egg-card-print.png" alt="C案の完成たまごカード"><p>縮小比較は画像検査用です。iPhone Safari実機QAは別途必要です。</p></html>

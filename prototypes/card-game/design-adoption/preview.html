<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A＋B控えめ版 採用確認</title><link rel="stylesheet" href="../style.css"><style>body{display:block;margin:0;background:#123d31;color:#fff7dc;padding:16px;font-family:system-ui}h1{font-size:20px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}a{color:#ffdfa2}.strip{display:flex;gap:8px;width:max-content;padding:12px 4px}.scroller{overflow:auto;max-width:100%}.sample{flex:none;width:var(--width)}.label{font-size:11px;margin-bottom:6px;height:32px}.sample .card-face{width:100%}h2{font-size:16px}.caption{font-size:13px;max-width:850px}.normal{display:flex;gap:20px;flex-wrap:wrap}#audit{font-size:12px}</style><h1>A＋B控えめ版 — 正式採用確認</h1><p class="caption">金縁・植物装飾・分類マーク・専用イラストは従来どおり。色・分類名・マークを併用します。本文は詳細表示でご確認ください。</p><nav><a href="?w=80">80px</a><a href="?w=110">110px</a><a href="?w=320">通常320px</a><a href="?w=80&all=1">全452枚</a><a href="../index.html">試遊へ戻る</a></nav><div id="audit"></div><main id="samples"></main><script type="module">
import {CATALOG} from '../full-catalog.mjs';import {cardMarkup} from '../ui-presentation.mjs';import {fitMainCardCopy} from '../ui-art-loading.mjs';
const p=new URLSearchParams(location.search),w=[80,110,320].includes(+p.get('w'))?+p.get('w'):80;
const ids=['M-man-05','M-cat-05','M-frog-05','M-clownfish-05','M-beetle-05','M-dandelion-05','M-dragon-05','M-unknown-05','C-cat_friend','P-sea_mermaid','W-forest','G-area-claim','I-bowtie','E-new-encounter'];
const labels=['ひと','けもの','みずべ','うみ','むし','くさ','げんそう','ふしぎ','なかま','こいびと','セカイ','あそび','あいてむ','できごと'];const old=document.createElement('style');old.textContent='.baseline.card-face::before,.baseline.card-face::after{content:none}.baseline.card-face .card-heading{background:linear-gradient(90deg,transparent 8%,#fffbe6e8 23% 77%,transparent 92%);border-radius:35% 35% 8% 8%;box-shadow:none;color:inherit}.baseline.card-face .card-stats>span{background:linear-gradient(110deg,#f6eacb,#fffdf2 50%,#f3e6c3);box-shadow:inset 0 0 0 1px #fff8dd,0 0 0 1px #d9c992}';document.head.append(old);
function sample(id,baseline=false){const i=ids.indexOf(id),c=CATALOG[id];return `<div class="sample" style="--width:${w}px"><div class="label">${labels[i]||c.type}<br>${id}</div>${cardMarkup(c,{compact:w<320,detail:w===320}).replaceAll('src="art-delivery/','src="../art-delivery/').replace('class="card-face','class="card-face'+(baseline?' baseline':''))}</div>`}
function section(title,list,baseline=false){return `<section><h2>${title}</h2><div class="scroller"><div class="${w===320?'normal':'strip'}">${list.map(id=>sample(id,baseline)).join('')}</div></div></section>`}
document.querySelector('#samples').innerHTML=p.has('all')?section(`全452枚・${w}px`,Object.keys(CATALOG)):section(`採用版・${w}px・14分類`,ids)+section(`従来版・${w}px・同じ14枚`,ids,true)+section('重点確認：類似色の隣接',['M-man-05','P-sea_mermaid','M-cat-05','C-cat_friend','G-area-claim','I-bowtie','E-new-encounter','W-forest']);
for(const im of document.images)im.loading='eager';await document.fonts.ready;document.querySelectorAll('.card-face').forEach(fitMainCardCopy);await Promise.all([...document.images].map(im=>im.decode().catch(()=>{})));document.querySelector('#audit').textContent=`表示 ${document.querySelectorAll('.card-face').length}枚 / 画像成功 ${[...document.images].filter(x=>x.naturalWidth>0).length}/${document.images.length} / ${w}px`;
</script></html>

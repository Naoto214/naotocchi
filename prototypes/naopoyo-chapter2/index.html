<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#edf3ee" />
    <title>なおぽよ。｜こもれびの森</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          なおぽよ<span>。</span><small>NAOPOYO. / CHAPTER 02 · VERSION 8</small>
        </div>
        <button id="compare" aria-label="8×8盤面">8×8</button
        ><button id="pause" aria-label="一時停止">Ⅱ</button>
      </header>
      <section class="intro">
        <div><span id="chapter">CHAPTER 02 · VERSION 8</span><span id="clock"></span></div>
        <h1 id="title"></h1>
      </section>
      <section class="arena">
        <canvas
          id="board"
          aria-label="キャラをなぞって合体・分裂し、全員を星へ"
        ></canvas>
        <div id="paused" hidden>
          ひとやすみ<br /><small>右上の ▶ でつづける</small>
        </div>
      </section>
      <div id="status" role="status">キャラから、なぞってみよう</div>
      <nav>
        <button id="undo">↶ <span>もどす</span></button
        ><button id="retry">↻ <span>やり直す</span></button
        ><button id="hint">✧ <span>ヒント</span></button
        ><button id="select">▦ <span>えらぶ</span></button>
      </nav>
    </main>
    <dialog id="dialog">
      <div class="dialog-head">
        <span>こもれびの森</span><button id="close">とじる</button>
      </div>
      <div id="content"></div>
      <p class="game-links"><a href="qa.html">11〜20面を直接試す</a> · <a href="index.html">通常の順次開放</a><br>魔法ゲートは同じ数字だけ中を通れ、上にはどの数字も乗れます。合体できない仲間は8方向に交換。星はだれでも通れ、数字が合えば脱出。星とトゲは足場になりません。<br>この試遊版は本番の記録を書き換えません。</p>
    </dialog>
    <script type="module">
      import { mount } from "./app.mjs";
      import { stages } from "./stages.mjs";
      window.pilot = mount();
    </script>
  </body>
</html>

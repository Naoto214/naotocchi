<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>なおぽよ。能力比較室</title><style>
*{box-sizing:border-box}body{margin:0;background:#1b3045;color:#edf1f7;font:14px system-ui;height:100dvh;display:flex;align-items:center;justify-content:center}.lab{max-width:500px;width:100%;height:100%;padding:12px;display:flex;flex-direction:column;gap:8px}h1{font-size:20px;margin:0}p{font-size:11px;line-height:1.5;margin:0}select,button{min-height:40px;border:0;border-radius:9px;padding:6px;color:#25405a}header{display:flex;gap:6px;flex-wrap:wrap}#board{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,calc(100dvh - 250px));aspect-ratio:1;align-self:center;touch-action:none;background:#536c81;gap:1px}#board>div{position:relative;display:grid;place-items:center;min-width:0;min-height:0;background:#71889b}.rock{background:#30475d!important}.gate{box-shadow:inset 0 0 0 4px #bfa4db}.sprite{position:absolute;inset:5% 0 0;width:100%;height:95%;object-fit:contain;pointer-events:none}.number{position:absolute;top:1px;font-size:15px;font-weight:900;text-shadow:0 1px 3px #000;z-index:1}.flight{border:2px solid #acebff;border-radius:50%;position:absolute;inset:4%;pointer-events:none}#status{min-height:30px;color:#ffe6a5}a{color:#d3e5fc}footer{display:flex;gap:10px}
</style></head><body><div class="lab"><h1>成長と飛行の比較室</h1><p>独立試作・第1章には適用されません。保存なし。<br>合体して羽化 → 空中へ。トゲは足場。幼い段階に戻ってもトゲのマスで止まり、離れて足場がなければ直ちに落下します。</p><header><select id="family" aria-label="種族"><option value="butterfly">ちょう：6から飛行</option><option value="cicada">セミ：6から飛行</option><option value="beetle">カブトムシ：5から飛行</option><option value="stagbeetle">クワガタムシ：5から飛行</option></select><select id="mode" aria-label="さなぎの比較"><option value="free">A：さなぎも地上操作</option><option value="horizontal">B：さなぎは水平のみ</option></select></header><div id="board" aria-label="能力比較の8×8盤面"></div><p id="status" role="status"></p><footer><button id="undo">もどす</button><button id="retry">最初から</button><a href="index.html">第1章へ</a></footer><p>青い輪＝飛行。岩・数字門は通り抜けません。飛行中の仲間も足場になります。セミにはさなぎ制限はありません。</p></div><script type="module" src="ability-ui.mjs"></script></body></html>

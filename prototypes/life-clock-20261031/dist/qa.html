<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>比較ページの画面幅QA</title><style>body{background:#ddd;font:13px sans-serif;margin:15px}iframe{display:block;border:1px solid #aaa;background:#fff;margin-top:15px}select{padding:10px}</style></head><body><label>画面幅<select id="size"><option>320x568</option><option>375x812</option><option selected>390x844</option><option>430x932</option><option>844x390</option></select></label><span> Chromium内のiframe幅検証。iPhone Safari実機の代替ではありません。</span><iframe id="preview" width="390" height="844" src="index.html" title="幅検証ページ"></iframe><script>document.querySelector('#size').onchange=e=>{const[w,h]=e.target.value.split('x');document.querySelector('iframe').width=w;document.querySelector('iframe').height=h;};</script></body></html>

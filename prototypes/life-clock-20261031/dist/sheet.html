<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A＋Bと従来4案比較 — 人生の時計</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6f1;color:#264356;font-family:Arial,sans-serif}main{padding:25px;max-width:1400px;margin:auto}h1{font-size:27px;font-weight:400;margin:0 0 8px}p{font-size:12px}#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}figure{margin:0}img{width:100%;height:320px;object-fit:contain;mix-blend-mode:multiply}figcaption{text-align:center;font-size:15px;padding:10px}a{color:inherit}@media(max-width:600px){img{height:220px}main{padding:15px}figcaption{font-size:11px}h1{font-size:20px}}</style></head><body><main><h1>NAOTOCCHI — 人生の時計</h1><p>青銀の正式カード裏面を継承するA＋Bと従来4案 · 意匠試作 / 正式採用前</p><div id="grid"></div><p>10＝赤い丸 / 11＝緑の丸 / 12＝青い丸。生成画像の微細な針長・マーカー位置は意匠表現です。共通寸法の操作図は比較ページで確認できます。</p><a href="index.html">比較ページに戻る</a></main><script type="module">import{variants}from'./clock.mjs';document.querySelector('#grid').innerHTML=Object.entries(variants).map(([id,v])=>`<figure><img src="assets/concept-${id}.png" alt="${id} ${v.name}"><figcaption>${id} — ${v.name}</figcaption></figure>`).join('');</script></body></html>

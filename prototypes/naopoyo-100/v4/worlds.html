<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6環境の比較</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="style.css"><main class="compare-main"><a href="./">← 操作できる比較室</a><p class="eyebrow">ENVIRONMENT STUDIES</p><h1>同じ道。六つの世界。</h1><p>床は平面、壁は厚みのある塊。形と輪郭で区別します。36px・48pxはCSS実寸で、画面より大きい見本は横にスクロールできます。</p><div class="size-buttons"><button data-size="36">36pxのマス</button><button data-size="48">48pxのマス</button></div><div class="compare-grid" id="samples"></div></main><script type="module">import{worlds}from './worlds.mjs';import{renderWorld}from './render.mjs';import{loadArt}from '../render.mjs';import{createGameState}from '../engine.mjs';import{stages}from '../stages.mjs';await loadArt();const root=document.querySelector('#samples');root.innerHTML=Object.entries(worlds).map(([id,w])=>`<article class="sample"><h2>${w.name}</h2><p>${w.motif}</p><canvas data-world="${id}" aria-label="${w.name}の8×8"></canvas></article>`).join('');function draw(size){for(const c of root.querySelectorAll('canvas')){c.style.width=size*8+'px';c.style.height=size*8+'px';renderWorld(c,createGameState(stages[58].board),{},c.dataset.world)}}document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>draw(Number(b.dataset.size)));draw(36);document.documentElement.dataset.ready='true';</script></html>

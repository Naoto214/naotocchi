<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6 比較と検証</title><link rel="stylesheet" href="../v5/style.css"><main><header><h1>VERSION 6 比較と検証</h1><p><a href="editor.html">制作エディター</a> · <a href="labs.html">飛行・掘削を操作比較</a> · <a href="../v5/index.html">V5 比較履歴</a></p></header><p>採用済みV5描画を使用した実寸のCanvas画像です。ブラウザー画面のスクリーンショットではありません。iPhone Safari実機・ブラウザーレイアウトは未検証です。</p><p>F1は1マス飛行と空中停止、F2は直線飛行と足場着地。D1は掘って進む、D2は掘削と移動を別操作にした比較です。試作盤面の最短はF1=10手、F2=7手、D1=D2=17手。変身テスト操作を除く探索結果です。</p><div id="images"></div><script type="module">
const root=document.getElementById('images'),names={sea:'海',snow:'雪山',forest:'森',sky:'空',earth:'地中',cave:'洞窟',F1:'飛行 F1',F2:'飛行 F2',D1:'掘削 D1',D2:'掘削 D2',characters:'31系統×8段階'};
for(const size of [36,48]){const heading=document.createElement('h2');heading.textContent=size+'px 実寸（盤面 '+size*8+'px）';root.append(heading);for(const[id,name]of Object.entries(names)){const figure=document.createElement('figure'),caption=document.createElement('figcaption'),img=document.createElement('img'),scroll=document.createElement('div');figure.style.margin='20px 0';caption.textContent=name;scroll.style.overflowX='auto';img.src='../../../../docs/naopoyo-100-v6/images/'+id+'-'+size+'.png';img.alt=name+' '+size+'px';img.width=size*8;img.style.maxWidth='none';scroll.append(img);figure.append(caption,scroll);root.append(figure)}}
</script></main></html>

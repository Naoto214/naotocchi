<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VERSION 6 独立能力比較室</title><link rel="stylesheet" href="../v5/style.css"></head><body><main class="editor-main"><a href="editor.html">← VERSION 6 エディター</a><p class="eyebrow">VERSION 6 / EXPERIMENTS ONLY</p><h1>飛び方と、掘り方をくらべる。</h1><p>正式ゲームとは独立した試作です。盤面の仲間を選び、隣のマスか矢印で操作。V5の保存や正式能力は変更しません。</p><div class="editor-layout"><div class="board-column"><div class="board-shell"><canvas id="board" aria-label="8×8独立実験盤面" style="touch-action:none"></canvas></div><div class="bar"><button data-dir="0,-1">↑</button><button data-dir="-1,0">←</button><button data-dir="1,0">→</button><button data-dir="0,1">↓</button><button id="undo">実験を1手戻す</button><button id="retry">やり直す</button></div><p id="message" class="status" role="status"></p><p id="moves"></p></div><section class="panel controls"><label>比較方式<select id="variant"><option>F1</option><option>F2</option><option>D1</option><option>D2</option></select></label><p id="description"></p><label>操作する仲間<select id="actor"></select></label><label id="dig-action-label" hidden>操作<select id="dig-action"><option value="move">移動</option><option value="dig">隣を掘る（D2）</option></select></label><p id="roles" class="fine"></p><details><summary>変身して能力の再判定を試す</summary><label>種族<select id="species"></select></label><label>段階<select id="level"></select></label><button id="transform">この種族・段階で試す</button><p class="fine">これは能力の消失を確認する実験操作です。おてほんの最短探索には変身を含めません。</p></details><div class="bar"><button id="solve">操作の解法を確認</button><button id="example" disabled>おてほんを1手</button></div><p id="result" class="fine"></p><div class="bar"><button id="save">実験を保存</button><button id="restore">実験を復元</button><button id="export">実験JSON</button></div><label>実験JSONを読み込む<input id="import" type="file" accept="application/json,.json"></label><p class="fine">飛行表は旧候補：ちょう/セミ6〜8、カブトムシ/クワガタ5〜8。二値のみ。掘削は実験役だけで、正式種族の能力にはしません。</p></section></div></main><script type="module" src="labs-ui.mjs"></script></body></html>

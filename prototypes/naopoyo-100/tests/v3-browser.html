<!doctype html><html lang="ja"><meta charset="utf-8"><title>VERSION 3 ブラウザ回帰</title><style>body{background:#e7eadd;font:14px system-ui;color:#294b4a;margin:10px}button{padding:12px}iframe{display:block;border:1px solid #ccc;margin-top:12px}pre{white-space:pre-wrap}header{display:flex;gap:10px;flex-wrap:wrap}</style><header><button id="audit">108盤面×6画面の表示検証</button><button id="finale">最終面のおてほん検証</button><label>幅<select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>568</option><option>844</option></select></label><a href="../quality.html">変更比較資料</a></header><p id="status">準備中</p><iframe id="game" width="390" height="844"></iframe><pre id="result"></pre><script type="module">
import{stages}from'../stages.mjs';
const $=s=>document.querySelector(s),f=$('#game'),wait=ms=>new Promise(r=>setTimeout(r,ms)),d=()=>f.contentDocument;
async function load(q){await new Promise(r=>{f.onload=r;f.src='../?'+q});for(let n=0;n<500;n++){if(d().documentElement.dataset.ready==='true')return;await wait(10)}throw Error('load timeout')}
function metrics(){const r=d().querySelector('#board').getBoundingClientRect();return{board:r.width,overflow:d().documentElement.scrollWidth>+f.width,buttons:[...d().querySelectorAll('.quick-controls button')].every(b=>b.getBoundingClientRect().height>=44)}}
$('#width').onchange=()=>{f.width=$('#width').value;f.height=+f.width>500?(+f.width===568?320:390):844};
$('#audit').onclick=async()=>{const rows=[];try{for(const w of [320,375,390,430,568,844]){f.width=w;f.height=w>500?(w===568?320:390):844;await wait(60);for(const q of [...Array.from({length:8},(_,i)=>({book:i})),...stages.map(s=>({stage:s}))]){d().querySelector('#menu').click();if(q.stage)d().querySelector(`[data-stage="${q.stage.id}"]`).click();else{d().querySelector('#open-book').click();for(let i=0;i<q.book;i++)d().querySelector('#book-next').click()}d().querySelector('#retry').click();await wait(20);const a=metrics();d().querySelector('#hint').click();const b=metrics();d().querySelector('#hint-close').click();d().querySelector('#example').click();const c=metrics();d().querySelector('#demo-back').click();const displayed=d().querySelector('h2').textContent;rows.push({width:w,stage:q.stage?.number??'book'+q.book,board:a.board,pass:!a.overflow&&a.buttons&&a.board===b.board&&a.board===c.board&&(w>500||a.board>=w-24)});$('#status').textContent=`${rows.length}/648`;}}$('#result').textContent=JSON.stringify({count:rows.length,failed:rows.filter(r=>!r.pass),sizes:[...new Set(rows.map(r=>r.width+':'+r.board))]},null,2);$('#status').textContent='表示検証完了'}catch(e){$('#status').textContent='失敗';$('#result').textContent=e.stack}};
$('#finale').onclick=async()=>{try{await load('stage=100');d().querySelector('#retry').click();const a=metrics();d().querySelector('#example').click();let steps=0;while(!d().querySelector('#demo-step').disabled&&steps<50){d().querySelector('#demo-step').click();steps++;await wait(450)}for(let i=0;i<1500&&d().querySelector('#clear-panel').hidden;i++)await wait(20);const b=metrics(),clear=!d().querySelector('#clear-panel').hidden;$('#result').textContent=JSON.stringify({steps,clear,boardBefore:a.board,boardAfter:b.board,sameSize:a.board===b.board});$('#status').textContent='最終面検証完了'}catch(e){$('#result').textContent=e.stack}};
await load('stage=100');$('#status').textContent='準備完了';
</script></html>

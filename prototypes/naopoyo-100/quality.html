<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VERSION 3 · 全100面比較</title><link rel="stylesheet" href="style.css"><style>main{max-width:1100px}details{padding:12px;background:#fffdf7;margin:12px 0;border-radius:12px}summary{cursor:pointer;font-weight:bold}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair canvas{width:100%;max-width:360px;height:auto}table{border-collapse:collapse;min-width:850px}td,th{padding:8px;border-bottom:1px solid #c8d4c7;text-align:left}.scroll{overflow:auto}p{line-height:1.7}@media(max-width:550px){.pair{grid-template-columns:1fr}}</style><main><a href="./">← 100の冒険</a><h1>VERSION 3 · 全100面比較</h1><p>22面を再設計し、難度の流れを並べ直しました。保存IDは維持しています。番号と8軸評価は設計上の仮説で、初見の面白さ・難しさは本人試遊で確かめます。</p><p><a href="../../docs/naopoyo-100-v3/REPORT.md">変更・検証・未確認事項</a> · <a href="reports.html">ヒント・解法・図鑑対応</a></p><div id="status"></div><h2>変更した盤面</h2><p>開くと変更前後の盤面を、ゲーム本体と同じ描画処理で表示します。</p><div id="changes"></div><h2>100面の評価</h2><p>各軸1〜5。明瞭さは高いほど理解しやすく、反復は高いほど操作の繰り返しが多い評価です。最短手数は難易度点に使っていません。</p><div class="scroll"><table><thead><tr><th>新←旧</th><th>問題</th><th>発見</th><th>推論</th><th>分合計画</th><th>複合</th><th>先読み</th><th>独自性</th><th>明瞭さ</th><th>反復</th><th>最短手数</th><th>解法分類</th></tr></thead><tbody id="ratings"></tbody></table></div></main><script type="module">
import{stages}from'./stages.mjs';import{createGameState}from'./engine.mjs';import{loadArt,renderBoard}from'./render.mjs';
const base='../../docs/naopoyo-100-v3/',[e,b,v]=await Promise.all(['evaluation.json','baseline.json','validation.json'].map(x=>fetch(base+x).then(r=>r.json())));await loadArt();const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#status').textContent=`全100面合法解・最短手数確認。盤面変更${v.counts.changed}面、表示番号変更${v.counts.reordered}面。`;
document.querySelector('#ratings').innerHTML=e.stages.map(s=>`<tr><td>${s.number}←${s.previousNumber}</td><td><a href="./?stage=${s.number}">${esc(s.title)}</a></td>${e.axes.map(a=>`<td>${s.ratings[a]}</td>`).join('')}<td>${s.steps}</td><td>${esc(s.family)}</td></tr>`).join('');
for(const s of e.stages.filter(s=>s.changed)){const d=document.createElement('details');d.innerHTML=`<summary>${s.number} · ${esc(s.title)}（旧${s.previousNumber}）</summary><p>${esc(s.idea)}</p><p>${esc(s.reason)}</p><div class="pair"><section>変更前<canvas width="512" height="512"></canvas></section><section>変更後<canvas width="512" height="512"></canvas></section></div><a href="./?stage=${s.number}">この面を遊ぶ</a>`;d.addEventListener('toggle',()=>{if(d.open){const canvases=d.querySelectorAll('canvas');[b.find(x=>x.id===s.id),stages.find(x=>x.id===s.id)].forEach((x,i)=>renderBoard(canvases[i],createGameState(x.board),{reduced:true}))}});document.querySelector('#changes').append(d)}
document.documentElement.dataset.ready='true';
</script></html>

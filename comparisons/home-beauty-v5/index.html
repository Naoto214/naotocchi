<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>13地域の環境比較｜なおとっち</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="bar">
  <h1><span class="brand">なおとっち</span><span class="bar-title">13地域の環境比較</span></h1>
  <div class="tools">
    <select id="region" aria-label="地域を切り替え"></select>
    <select id="quick-variant" aria-label="演出案をすばやく切り替え"></select>
    <button type="button" id="split-toggle" aria-label="分割比較" aria-pressed="false">分割<span class="split-word">比較</span></button>
    <button type="button" id="panel-toggle" aria-controls="panel" aria-expanded="false">設定</button>
  </div>
</header>
<main>
  <section class="view" aria-label="ホームの動作比較">
    <div class="viewport"><iframe id="home" title="なおとっちのホーム" allow="autoplay"></iframe>
      <div id="wipe" hidden>
        <button type="button" id="wipe-handle" role="slider" aria-label="左右の比較境界" aria-valuemin="5" aria-valuemax="95" aria-valuenow="50">
          <span id="wipe-previous">旧版</span><b aria-hidden="true">↔</b><span id="wipe-candidate">E3</span>
        </button>
      </div>
    </div>
    <p id="status" role="status">ホームを読み込み中…</p>
  </section>
  <div id="scrim" hidden></div>
  <aside id="panel" aria-labelledby="panel-title">
    <div class="panel-heading"><h2 id="panel-title">比較設定</h2><button type="button" id="panel-close">閉じる</button></div>
    <form id="settings" autocomplete="off">
      <fieldset class="variant full-motion"><legend>演出案</legend><div class="choices" id="variants"></div></fieldset>
      <p class="split-note">分割線の左が旧版、右がE3です。住民と時刻は共通です。</p>
      <div class="strength-control"><label for="strength">演出強度</label><output for="strength" id="strength-value">100%</output>
        <input type="range" id="strength" name="strength" min="0" max="2" step="0.05" value="1">
      </div>
      <section class="scene-note"><p id="scene-note"></p><button type="button" id="scene-preset">見どころの条件で再生</button></section>
      <div id="conditions"></div>
      <details id="effect-detail"><summary>個別エフェクト</summary><div id="effects"></div>
        <fieldset class="detail-group" id="sea-detail"><legend>うみの波と光</legend><div id="sea-effects"></div></fieldset>
        <fieldset class="detail-group" id="forest-detail"><legend>もり</legend><div id="forest-effects"></div></fieldset>
      </details>
      <div class="playback" id="playback"></div>
      <div class="restarts"><button type="button" id="clock-replay">演出を最初から</button><button type="button" id="replay">同じ配置から再生</button></div>
    </form>
  </aside>
</main>
<script type="module" src="./controls.mjs"></script>
</body>
</html>

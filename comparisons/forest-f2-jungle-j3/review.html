<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F2/J3 表示検証</title><style>body{margin:0;background:#e6eee4;font:12px system-ui}iframe{border:0;display:block}#panel{position:fixed;left:860px;top:10px;width:460px;white-space:pre-wrap}a{padding:8px;display:inline-block}pre{font:11px monospace}</style><iframe id="game" title="比較ホーム"></iframe><aside id="panel"><a href="./">景観一覧</a><nav id="nav"></nav><pre id="status">loading</pre></aside><script>
const p=new URLSearchParams(location.search),scene=['forest-current','forest-f2','jungle-current','jungle-j3'].includes(p.get('scene'))?p.get('scene'):'forest-f2',count=[1,6,28].includes(+p.get('count'))?+p.get('count'):6,width=[320,375,390,430,844].includes(+p.get('width'))?+p.get('width'):390,height=width===844?390:844;
const frame=document.getElementById('game');frame.width=width;frame.height=height;frame.src='play.html?scene='+scene+'&count='+count+'&qa=1';
document.getElementById('nav').innerHTML=['forest-current','forest-f2','jungle-current','jungle-j3'].flatMap(s=>[1,6,28].map(n=>'<a href="?scene='+s+'&count='+n+'&width='+width+'">'+s+' '+n+'</a>')).join('');
setInterval(()=>{try{const w=frame.contentWindow,q=w.HomeReleaseQA;if(!q)return;const d=q.detail();document.getElementById('status').textContent=JSON.stringify({scene,width,height,count,loaded:d.world?.loaded,candidate:d.world?.candidate,blocked:d.blocked,actors:d.actors.length,safe:d.actors.every(a=>a.safe),metrics:d.metrics,slots:d.slots,images:[...w.document.images].filter(i=>i.offsetWidth&&i.src).every(i=>i.complete&&i.naturalWidth>0)},null,2)}catch(e){document.getElementById('status').textContent=e.message}},250);
</script></html>

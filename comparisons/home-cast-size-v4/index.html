<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>なおとっち｜住民数とサイズの比較</title>
  <link rel="stylesheet" href="../v1/style.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="bar">
    <h1><span class="brand">なおとっち</span><span>住民数とサイズの比較</span></h1>
    <div class="tools">
      <div class="presets" role="group" aria-label="現行サイズからの追加倍率">
        <button type="button" data-variant="current" aria-pressed="false">現行<small>基準</small></button>
        <button type="button" data-variant="A" aria-pressed="false">A<small>最大10%</small></button>
        <button type="button" data-variant="B" aria-pressed="true">B<small>最大15%</small></button>
        <button type="button" data-variant="C" aria-pressed="false">C<small>最大20%</small></button>
      </div>
      <button id="freeze" type="button" aria-pressed="false" aria-label="住民の動きを一時停止">停止</button>
      <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="panel">設定<small id="toolbar-count">28体</small></button>
    </div>
  </header>
  <main>
    <section class="stage" aria-label="ホーム動作比較">
      <div class="frame-wrap"><iframe id="home" title="なおとっちのホーム" allow="autoplay"></iframe></div>
      <div class="feedback"><p id="status" role="status">ホームを読み込んでいます…</p><button id="retry" type="button" hidden>読み込み直す</button></div>
    </section>
    <div id="scrim" hidden></div>
    <aside id="panel" aria-labelledby="panel-title">
      <div class="panel-head">
        <h2 id="panel-title">比較設定</h2>
        <button id="settings-close" type="button" aria-label="設定を閉じる">閉じる</button>
      </div>
      <fieldset class="trials">
        <legend>28体で試す</legend>
        <div class="shortcuts">
          <button type="button" data-trial="river_lake">みずべ</button>
          <button type="button" data-trial="forest">もり</button>
          <button type="button" data-trial="home">おうち</button>
        </div>
      </fieldset>
      <div class="scene-pick">
        <label for="region">地域<select id="region"></select></label>
        <label for="time">時間帯<select id="time"></select></label>
      </div>
      <label class="count-label" for="count">住民数</label>
      <div class="count-pick">
        <button type="button" id="fewer" aria-label="住民を1体減らす">−</button>
        <select id="count"></select>
        <button type="button" id="more" aria-label="住民を1体増やす">＋</button>
      </div>
      <fieldset>
        <legend>人数による拡大</legend>
        <div class="choices">
          <label><input type="radio" name="curve" value="linear" checked><span>段階的に拡大</span></label>
          <label><input type="radio" name="curve" value="step"><span>一度に拡大</span></label>
        </div>
        <p class="hint" id="curve-note"></p>
      </fieldset>
      <fieldset>
        <legend>初期配置</legend>
        <div class="choices">
          <label><input type="radio" name="layout" value="fixed" checked><span>同じ配置</span></label>
          <label><input type="radio" name="layout" value="optimized"><span>サイズ別の配置</span></label>
        </div>
        <p class="hint" id="layout-note"></p>
      </fieldset>
      <section class="sizes" aria-labelledby="sizes-title">
        <h3 id="sizes-title">住民の実寸</h3>
        <p id="gain-readout"></p>
        <p id="size-note">現行は主人公・恋人120%、仲間105%。表は本体の幅 × 高さ（CSS px）です。透明な余白と装備を除き、他の住民に隠れた部分を含みます。</p>
        <table aria-describedby="size-note">
          <thead><tr><th scope="col">住民</th><th scope="col">倍率</th><th scope="col">本体の実寸</th></tr></thead>
          <tbody id="measurements"></tbody>
        </table>
        <p id="companion-range" hidden></p>
        <details id="companion-detail" hidden>
          <summary>仲間ごとの実寸</summary>
          <table aria-label="仲間ごとの本体寸法"><thead><tr><th scope="col">仲間</th><th scope="col">幅 × 高さ（CSS px）</th></tr></thead><tbody id="individual-sizes"></tbody></table>
        </details>
        <button id="measure" type="button" disabled>現在の実寸を測る</button>
        <span id="measurement-status" role="status"></span>
      </section>
      <a class="archive" href="../v3/">前回のサイズ比較（V3）を開く</a>
    </aside>
  </main>
  <script type="module" src="./controls.mjs"></script>
</body>
</html>

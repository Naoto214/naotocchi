<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>住民の大きさを見比べる｜なおとっち</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="bar">
    <h1><span class="brand">なおとっち</span><span>住民の大きさを見比べる</span></h1>
    <div class="tools">
      <div class="presets" role="group" aria-label="住民サイズの比較案">
        <button type="button" data-preset="current" aria-pressed="true">現行</button>
        <button type="button" data-preset="A" aria-pressed="false" aria-label="A案">A案</button>
        <button type="button" data-preset="B" aria-pressed="false" aria-label="B案">B案</button>
      </div>
      <button id="freeze" type="button" aria-pressed="false" aria-label="住民の配置を固定" title="同じ配置で見比べる"><span class="play-icon" aria-hidden="true"></span><span id="freeze-text">配置を固定</span></button>
      <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="panel">設定</button>
    </div>
  </header>
  <main>
    <section class="stage" aria-label="ホーム動作比較">
      <div class="frame-wrap"><iframe id="home" title="なおとっちのホーム" allow="autoplay"></iframe></div>
      <div class="feedback"><p id="status" role="status">ホームを読み込んでいます…</p><button type="button" id="retry" hidden>読み込み直す</button></div>
    </section>
    <div id="scrim" hidden></div>
    <aside id="panel" aria-labelledby="panel-title">
      <div class="panel-head"><h2 id="panel-title">比較設定</h2><button type="button" id="settings-close" aria-label="比較設定を閉じる">閉じる</button></div>
      <form autocomplete="off" id="settings">
        <div class="scene-pick">
          <label for="region">地域<select id="region"></select></label>
          <label for="time">時間帯<select id="time"></select></label>
        </div>
        <fieldset class="resident-count"><legend>住民数</legend><div id="counts"></div></fieldset>
        <fieldset class="multipliers">
          <legend>住民の大きさ</legend>
          <p id="scale-note">現行の表示サイズを100%とします。</p>
          <div id="scales"></div>
          <p id="pair-note"></p>
        </fieldset>
        <p class="instructions">「配置を固定」を押すと、歩いている住民を同じ位置で見比べられます。</p>
      </form>
    </aside>
  </main>
  <script src="./controls.mjs" type="module"></script>
</body>
</html>

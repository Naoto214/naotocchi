<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>箱庭の演出比較｜なおとっち</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="bar">
  <h1><span class="brand">なおとっち</span><span class="bar-title">箱庭の演出比較</span></h1>
  <select id="quick-variant" aria-label="演出強度をすばやく切り替え"></select>
  <button type="button" id="panel-toggle" aria-controls="panel" aria-expanded="false">比較設定</button>
</header>
<main>
  <section class="view" aria-label="ホームの動作比較">
    <div class="viewport"><iframe id="home" title="なおとっちのホーム" allow="autoplay"></iframe></div>
    <p id="status" role="status">ホームを読み込み中…</p>
  </section>
  <div id="scrim" hidden></div>
  <aside id="panel" aria-labelledby="panel-title">
    <div class="panel-heading"><h2 id="panel-title">比較設定</h2><button type="button" id="panel-close">閉じる</button></div>
    <form id="settings" autocomplete="off">
      <fieldset class="variant"><legend>演出強度</legend><div class="choices" id="variants"></div></fieldset>
      <label class="region-label" for="region">地域</label>
      <select id="region" name="region"></select>
      <div id="conditions"></div>
      <details id="effect-detail"><summary>個別エフェクト</summary><div id="effects"></div></details>
      <div class="playback" id="playback"></div>
      <button type="button" id="replay">同じ配置から再生</button>
    </form>
  </aside>
</main>
<script type="module" src="./controls.mjs"></script>
</body>
</html>

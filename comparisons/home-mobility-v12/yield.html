<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>森のタヌキの道譲り｜なおとっち</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f7ef;color:#263c2c;font:1rem/1.55 system-ui,sans-serif}main{max-width:46rem;margin:0 auto;padding:.8rem 1rem}a{color:#285c43}h1{font-size:clamp(1.35rem,4.8vw,2rem);margin:.5rem 0 .2rem}p{margin:.4rem 0}.controls{display:flex;flex-wrap:wrap;gap:.45rem .6rem;align-items:center;margin:.65rem 0}.controls label{display:flex;align-items:center;gap:.4rem}select,button{font:inherit;min-height:44px;max-width:100%;border:1px solid #697c67;border-radius:.42rem;background:#fff;color:#23392c;padding:.35rem .65rem}button#play{background:#315f43;color:#fff;font-weight:650}button:disabled{opacity:.52}select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #ad7829}.view{width:100%;max-width:375px;overflow:clip;margin:0 auto;background:#e7eadd}iframe{width:375px;height:792px;border:0;display:block;transform-origin:0 0}#status{font-variant-numeric:tabular-nums;min-height:1.6em}#participants{margin-bottom:.5rem}details{margin:.5rem 0}summary{cursor:pointer;color:#285c43}
</style></head><body><main>
<a href="./">ホームの比較に戻る</a>
<h1>森のタヌキの道譲り</h1>
<p>375px幅の森で、助け手が順に道を空け、タヌキが8px歩く様子を再生します。</p>
<div class="controls"><label>タヌキの進む方位 <select id="bearing"></select></label>
<label>再生速度 <select id="rate"><option value=".25">ゆっくり（¼速）</option><option value="1">通常</option></select></label></div>
<p id="participants"></p><p id="exits"></p>
<div class="controls"><button id="play" disabled>記録した経路を再生</button><button id="live" disabled>V12が道を探す</button><button id="pause" disabled>一時停止</button><button id="reset" disabled>開始位置に戻す</button></div>
<p id="status" role="status">28体を読み込んでいます…</p>
<details><summary>記録の条件</summary><p>森・秋・昼・晴れ、乱数937。28体を保存した開幕位置に戻し、VERSION 11で確認した23方向を、実際の歩行と描画処理で再生します。各区間は道を譲る住民とタヌキだけが動きます。「V12が道を探す」では助け手の手順を与えず、同じ足位置と8pxの目標から、全員が休んでいる条件で実際の探索を走らせます。通常生活での選択頻度・長時間の公平性は別に測定しています。</p></details>
</main><div class="view"><iframe title="375px幅の森で道を譲る住民とタヌキ"></iframe></div>
<script type="module" src="./yield.mjs"></script></body></html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>なおとっち｜住民の最終配置</title>
  <link rel="stylesheet" href="./v1/style.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="bar">
    <h1><span class="brand">なおとっち</span><span>住民の最終配置</span></h1>
    <div class="tools">
      <div class="presets" role="group" aria-label="表示と配置の比較">
        <button type="button" data-mode="current" aria-pressed="false">現行</button>
        <button type="button" data-mode="adopted" aria-pressed="false" aria-label="採用サイズ・従来の配置">サイズのみ</button>
        <button type="button" data-mode="final" aria-pressed="true" aria-label="採用サイズ・最終配置">最終配置</button>
      </div>
      <button id="freeze" type="button" aria-pressed="false" aria-label="配置を固定"><span class="play-icon" aria-hidden="true"></span><span id="freeze-text">固定</span></button>
      <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="panel">設定</button>
    </div>
  </header>
  <main>
    <section class="stage" aria-label="ホーム動作確認">
      <div class="frame-wrap"><iframe id="home" title="なおとっちのホーム" allow="autoplay"></iframe></div>
      <div class="feedback"><p id="status" role="status">ホームを読み込んでいます…</p><button type="button" id="retry" hidden>読み込み直す</button></div>
    </section>
    <div id="scrim" hidden></div>
    <aside id="panel" aria-labelledby="panel-title">
      <div class="panel-head"><h2 id="panel-title">確認設定</h2><button type="button" id="settings-close" aria-label="設定を閉じる">閉じる</button></div>
      <div class="scene-pick">
        <label for="region">地域<select id="region"></select></label>
        <label for="time">時間帯<select id="time"></select></label>
      </div>
      <fieldset class="resident-count"><legend>住民数</legend><div id="counts"></div></fieldset>
      <section class="sizes" aria-labelledby="size-title">
        <h3 id="size-title">住民の表示サイズ</h3>
        <p id="size-note">原画の透明余白を除いた、本体の幅 × 高さです。装備は含まず、手前の住民や地形に隠れた部分も測ります。仲間は各寸法の中央値です。</p>
        <table aria-describedby="size-note">
          <thead><tr><th scope="col">住民</th><th scope="col">倍率</th><th scope="col">実寸（CSS px）</th></tr></thead>
          <tbody id="measurements"></tbody>
        </table>
        <details id="companion-detail" hidden>
          <summary>仲間ごとの実寸</summary>
          <table aria-label="仲間の原画の表示寸法"><thead><tr><th scope="col">仲間</th><th scope="col">幅 × 高さ（CSS px）</th></tr></thead><tbody id="individual-sizes"></tbody></table>
        </details>
        <button id="measure" type="button">現在の実寸を測る</button>
        <span id="measurement-status" role="status"></span>
      </section>
      <p class="instructions">最終配置との切替、人数・地域の変更は同じ世帯の初期位置から始まります。「固定」で現在の位置を観察できます。</p>
      <a class="archive" href="./v1/">以前のサイズ比較を開く</a>
    </aside>
  </main>
  <script type="module" src="./controls.mjs"></script>
</body>
</html>

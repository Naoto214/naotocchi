<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>森の歩行地図｜なおとっち</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ee;color:#243e34;font:1rem/1.55 system-ui,sans-serif}main{max-width:50rem;margin:auto;padding:1rem clamp(.8rem,3vw,2rem) 2rem}a{color:#155e48}h1{font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.3;margin:.6rem 0}p{margin:.6rem 0}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));gap:.45rem .9rem}label{display:grid;font-weight:650;font-size:.87rem;gap:.15rem}select{font:inherit;color:inherit;width:100%;min-height:44px;border:1px solid #98aa99;background:#fffdf8;border-radius:.35rem;padding:0 .5rem}select:focus-visible,a:focus-visible{outline:3px solid #a56d2c}figure{margin:.85rem 0}.projection{background:#e4e8dc;border:1px solid #b7c4ae;border-radius:.45rem;padding:.3rem;display:grid;justify-items:center}canvas{display:block;max-width:100%;width:auto;max-height:56vh;height:auto}figcaption,#reading{font-size:.94rem}.key{white-space:nowrap}.dot{display:inline-block;width:.62rem;height:.62rem;border-radius:50%;vertical-align:baseline;margin-left:.35rem}.moving{background:#217c5d}.stuck{background:#a44d20}.chosen{background:#4a424c}.area{background:#e2cda4;border:1px solid #82775e;border-radius:0}#reading{border-left:3px solid #217c5d;padding-left:.6rem;font-variant-numeric:tabular-nums}.intro{max-width:42rem}.note{font-size:.85rem;color:#445c50}#error{color:#973e23}
</style>
<main>
<a href="./">本人限定試遊に戻る</a>
<h1>森の28体の歩行地図</h1>
<p class="intro">V10の10分試験から、住民の足位置と、その時点で安全に一人で進めた方向を見比べられます。</p>
<div class="controls">
<label for="width">画面幅<select id="width"><option value="320">320px</option><option value="375">375px</option><option value="390">390px</option><option value="430">430px</option></select></label>
<label for="seats">初期配置<select id="seats"><option value="reference">V9の調整配置</option><option value="original">従来配置</option></select></label>
<label for="phase">観察時刻<select id="phase"></select></label>
<label for="resident">住民<select id="resident"></select></label>
<label for="range">確認する距離<select id="range"><option>3</option><option selected>8</option><option>16</option></select></label>
</div>
<figure>
<div class="projection"><canvas id="map" width="640" height="576" role="img" aria-describedby="reading legend"></canvas></div>
<figcaption id="legend"><span class="key"><i class="dot area"></i> 歩行地形</span>　<span class="key"><i class="dot moving"></i> 進める方向あり</span>　<span class="key"><i class="dot stuck"></i> 進める方向なし</span>　<span class="key"><i class="dot chosen"></i> 選択中の足元</span></figcaption>
</figure>
<p id="reading" aria-live="polite">記録を読み込み中です。</p>
<p class="note">足元の点をタップして住民を選べます。選択した足元から伸びる線は、96方位で安全を確認した距離と向きです。ほかの住民が道を譲る前の状態を表示します。時刻はゲーム内時間です。</p>
<p id="error" role="alert"></p>
</main>
<script type="module" src="./space-view.mjs"></script>
</html>

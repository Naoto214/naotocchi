<title>なおとっち 環境演出くらべ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;600&display=swap">
<style>
/* Layout: the two phone-shaped scenes lead; one band of chips underneath drives both. */
:root{color-scheme:dark;--ink:#f3efe6;--muted:#b4b9c4;--ground:#151a26;--panel:#1f2636;--line:#34405a;--now:#8fa3c8;--mid:#9ed0b4;--next:#f2b866;--max:#ff8fa8;--final:#8fe3d0;
 --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;--body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
html,body{background:var(--ground)}
body{color:var(--ink);font:400 14px/1.7 var(--body)}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font:700 22px/1.3 var(--display);margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:760px;width:100%;margin:0 auto}
.pane{display:flex;flex-direction:column;gap:6px;min-width:0}
.pane h2{font:700 15px/1.2 var(--display);margin:0;display:flex;align-items:center;gap:8px}
.pane h2 i{width:10px;height:10px;border-radius:50%;background:var(--now)}
.pane[data-side="b"] h2 i{background:var(--mid)}
.pane[data-side="c"] h2 i{background:var(--next)}
.pane[data-side="d"] h2 i{background:var(--max)}
.pane[data-side="e"] h2 i{background:var(--final)}
.scene{position:relative;overflow:hidden;aspect-ratio:9/16;max-width:100%;border-radius:18px;background:#0c1018;outline:1px solid var(--line)}
.scene .stage{position:absolute;inset:0}
/* Zoom is a view of the same canvas, so both methods are magnified identically. */
.scene canvas{transition:transform .35s ease}
.panes[data-zoom="top"] .scene canvas{transform:scale(2.4);transform-origin:50% 8%}
.panes[data-zoom="edge"] .scene canvas{transform:scale(3);transform-origin:80% 20%}
.panes[data-zoom="grass"] .scene canvas{transform:scale(2.4);transform-origin:30% 96%}
.panes[data-zoom="mid"] .scene canvas{transform:scale(2.6);transform-origin:50% 42%}
.chips.sway button{padding:7px 10px;font-size:12.5px}
.zoomrow{max-width:760px;width:100%;margin:0 auto}
.home-art-canvas{display:block;position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pane p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.55;min-height:4.7em}
.gallery{display:flex;flex-direction:column;gap:10px}
.gallery h2{font:700 16px/1.3 var(--display);margin:0}
.gallery p{margin:0;color:var(--muted);max-width:62ch}
.gallery .strip{overflow-x:auto}
.gallery img{display:block;border-radius:12px;max-width:none;height:auto}
.gallery table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.gallery th,.gallery td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:right;white-space:nowrap}
.gallery th:first-child,.gallery td:first-child{text-align:left}
.gallery a{color:var(--next)}
.swap{display:flex;flex-wrap:wrap;justify-content:center;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;align-self:center}
.swap button{border:0;border-radius:0}
.controls{display:flex;flex-direction:column;gap:12px;background:var(--panel);border-radius:16px;padding:14px}
.row{display:grid;grid-template-columns:5.5em 1fr;gap:8px;align-items:start}
.row>span{color:var(--muted);font-size:12.5px;padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:600 13px/1 var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--next);border-color:var(--next);color:#231a08}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.presets button{border-style:dashed}
@media(max-width:700px){
 .panes{grid-template-columns:1fr;max-width:340px}
 .pane[data-side="left"]{display:none}
 .row{grid-template-columns:1fr}.row>span{padding-top:0}
}
</style>
<!--INLINE_CSS-->
<div class="wrap">
 <header>
  <h1>木の揺れくらべ</h1>
  <p>木と草の揺れ方だけが違う4方式です。ほたる・星・水面・雨・雪など、ほかの演出はどれも最終候補Eのままで、背景・時間帯・風は左右で同じです。左右それぞれで方式を選べます。</p>
 </header>
 <div class="row zoomrow"><span>見る場所</span><div class="chips" id="zoom"></div></div>
 <div class="row zoomrow"><span>風</span><div class="chips" id="wind"></div></div>
 <div class="panes" id="panes">
  <section class="pane" data-side="left"><div class="chips sway" id="swayLeft"></div><div class="scene" id="sceneLeft"><div class="stage"></div></div><p id="noteLeft"></p></section>
  <section class="pane" data-side="right"><div class="chips sway" id="swayRight"></div><div class="scene" id="sceneRight"><div class="stage"></div></div><p id="noteRight"></p></section>
 </div>
 <div class="controls">
  <div class="row presets"><span>見どころ</span><div class="chips" id="presets"></div></div>
  <div class="row"><span>地域</span><div class="chips" id="region"></div></div>
  <div class="row"><span>季節</span><div class="chips" id="season"></div></div>
  <div class="row"><span>天気</span><div class="chips" id="weather"></div></div>
  <div class="row"><span>時間帯</span><div class="chips" id="time"></div></div>
  <div class="row"><span>粒子の量</span><div class="chips" id="tier"></div></div>
 </div>
 <!--GALLERY-->
</div>
<script src="world-scene.js"></script>
<script type="module" src="compare.mjs"></script>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>なおとっち｜ホーム試遊</title>
  <link rel="stylesheet" href="../v1/style.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="bar">
    <h1><span class="brand">なおとっち</span>ホーム試遊</h1>
    <div class="tools">
      <div class="presets" role="group" aria-label="足元の表現">
        <button type="button" data-ground="off" aria-pressed="false">元の足元</button>
        <button type="button" data-ground="on" aria-pressed="true">新しい足元</button>
      </div>
      <button id="freeze" type="button" aria-pressed="false">停止</button>
      <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="panel">設定 <span id="toolbar-count">28体</span></button>
    </div>
  </header>
  <main>
    <section class="stage" aria-label="ホーム">
      <div class="frame-wrap"><iframe id="home" title="なおとっちのホーム" allow="autoplay"></iframe></div>
      <div class="feedback"><p id="status" role="status">ホームを読み込んでいます…</p><button id="retry" type="button" hidden>読み込み直す</button></div>
    </section>
    <div id="scrim" hidden></div>
    <aside id="panel" aria-labelledby="panel-title">
      <div class="panel-head"><h2 id="panel-title">ホームの設定</h2><button id="settings-close" type="button" aria-label="設定を閉じる">閉じる</button></div>
      <div class="scene-pick">
        <label for="region">地域<select id="region"></select></label>
        <label for="time">時間帯<select id="time"></select></label>
      </div>
      <label for="count">住民数<select id="count"></select></label>
      <div class="residents">
        <h3>住民のサイズ</h3>
        <p id="gain" aria-live="polite"></p>
        <p>採用したBの倍率を使います。19体から人数に応じて大きくなり、幅375px以上では28体で15%拡大します。</p>
      </div>
      <p class="instructions">住民をタップすると選べます。行かせたい場所までドラッグすると、その住民が地面の上を歩きます。</p>
    </aside>
  </main>
  <script type="module" src="./controls.mjs"></script>
</body>
</html>
